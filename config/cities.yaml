# Pilot cities (handover §9). osm_relation_id values were looked up via Nominatim on 2026-10-01;
# query: https://nominatim.openstreetmap.org/search?city=<name>&country=<country>&format=jsonv2
# lau_code / fua_code are filled in M2 (GISCO). EPSG = ETRS89 / UTM zone of the city.
# Lookups: berlin 62422 (city=Berlin&country=Germany); paris 71525 (city=Paris&country=France,
# city commune; 7444 and 1641193 are suburb/district hits); vienna 109166 (city=Wien&country=Austria);
# wroclaw 451516 (city=Wrocław&country=Poland); copenhagen: the city= query returns only a place
# node, so 2192363 (Københavns Kommune, municipality) came from q=København Kommune Denmark.
cities:
  - id: berlin
    name: Berlin
    country_iso2: DE
    epsg: 25833
    geofabrik_region: europe/germany/berlin
    osm_relation_id: 62422
  - id: paris
    name: Paris
    country_iso2: FR
    epsg: 25831
    geofabrik_region: europe/france/ile-de-france
    osm_relation_id: 71525
  - id: vienna
    name: Wien
    country_iso2: AT
    epsg: 25833
    geofabrik_region: europe/austria
    osm_relation_id: 109166
  - id: copenhagen
    name: København
    country_iso2: DK
    epsg: 25832
    geofabrik_region: europe/denmark
    osm_relation_id: 2192363
  - id: wroclaw
    name: Wrocław
    country_iso2: PL
    epsg: 25833
    geofabrik_region: europe/poland/dolnoslaskie
    osm_relation_id: 451516
