# Pilot cities (handover §9). osm_relation_id values were looked up via Nominatim on 2026-10-01;
# query: https://nominatim.openstreetmap.org/search?city=<name>&country=<country>&format=jsonv2
# lau_code = GISCO LAU 2024 GISCO_ID; fua_code = URAU 2024 FUA code; nuts3_code = NUTS 2024
# (see docs/research/m2-data-sources-2026-10-01.md). EPSG = ETRS89 / UTM zone of the city.
# population_nuts3 = NUTS3 unit identical to the commune, used only when LAU has no population;
# set only where that holds (Paris FR101 = Ville de Paris). nuts3_code is for QECIO matching.
# bikenetkit_id = BikeNetKit city id (zip file stem); nuts3_is_city: NUTS3 unit equals the city
# (Wroclaw PL514 = Miasto Wroclaw, QECIO area 292.068 vs LAU 292.80 km2, research doc lines 19, 76).
# Lookups: berlin 62422 (city=Berlin&country=Germany); paris 71525 (city=Paris&country=France,
# city commune; 7444 and 1641193 are suburb/district hits); vienna 109166 (city=Wien&country=Austria);
# wroclaw 451516 (city=Wrocław&country=Poland); copenhagen: the city= query returns only a place
# node, so 2192363 (Københavns Kommune, municipality) came from q=København Kommune Denmark.
#
# M5 lookups (Task 13), all run on 2026-10-03:
# - osm_relation_id: Nominatim search?city=<name>&country=<country>&format=jsonv2 (UA velometer),
#   then details?osmtype=R&osmid=<id> for admin_level; the municipality relation is taken, never
#   a place node. amsterdam 47811 (city=Amsterdam&country=Netherlands; admin_level 8,
#   ref:gemeentecode 0363; 271110 is the admin_level 10 woonplaats); utrecht 419203 (admin 8,
#   gemeentecode 0344; 1433619 is an admin 10 district); madrid 5326784; barcelona 347950;
#   stockholm 398021 (Stockholms kommun, admin 7; node 25929985 is the place node); oslo 2775550
#   (Oslo kommune, admin 7; 406091 is the admin 4 fylke); helsinki 34914; lyon 120965 (INSEE
#   69123; 1663048 is the arrondissement); strasbourg 71033 (INSEE 67482; 4630050 arrondissement);
#   bordeaux 105270 (INSEE 33063; 1667452 arrondissement); warsaw 336075 (city=Warszawa&
#   country=Poland); krakow 449696 (city=Kraków); budapest 1244004; prague 435514 (city=Praha&
#   country=Czechia; the only hit, admin 4, ref:nuts:3 CZ010); ljubljana 1675898 (municipality;
#   node 6968827 is the place node).
# - lau_code: LAU_RG_01M_2024_3035.gpkg where CNTR_CODE=<cc> and LAU_NAME LIKE '%<name>%',
#   exact-name row taken (Warszawa, Kraków, Praha, Helsinki / Helsingfors).
# - fua_code: URAU_RG_100K_2024_3035_FUA.gpkg, URAU_NAME of the city, URAU_CATG F.
# - nuts3_code: the QECIO v2.10 Summary-all CSV row (NUTS 2021 codes, as QECIO uses them);
#   nuts3_is_city = QECIO Area within 5 % of LAU AREA_KM2. True: oslo NO081 454.86 vs 454.04,
#   warsaw PL911 517.69 vs 517.19, krakow PL213 327.57 vs 326.85, budapest HU110 525.93 vs
#   525.18, prague CZ010 497.20 vs 496.39; the others carry a nuts3_note.
# - geofabrik_region: index-v1-20261002.json, the smallest region with a pbf whose polygon covers
#   the LAU polygon (uncovered area within velometer.sources.geofabrik.tolerance_m2).
# - epsg: utm_epsg(LAU centroid longitude in EPSG:4326); stockholm 17.994E -> 25833.
# - bikenetkit_id: bike_networks.zip listing, bike_networks/<id>.gpkg.
# - population: LAU POP_2024 where positive. It is 0 for madrid, barcelona, lyon, strasbourg and
#   bordeaux, and no fallback holds: their NUTS3 units are provinces/départements, and the Urban
#   Audit city codes are greater cities, not the communes (URAU_AT_2024.csv AREA_SQM vs LAU:
#   FR002C Lyon 297.3 vs 48.0 km2, FR009C Strasbourg 139.7 vs 78.2, FR005C Bordeaux 340.4 vs
#   49.7, ES001C Madrid 953.1 vs 605.0, ES002C Barcelona 211.1 vs 98.3; urb_cpop1 labels them
#   "(greater city)"). So population_urau is not set and these cities have no per-100k figure.
# - boundary check (ADR 0004, spec 3.1): GISCO LAU polygon vs the OSM relation polygon from the
#   region extract, both in the city EPSG; |LAU - OSM| / OSM. Above 5 %: oslo 5.31 % and
#   helsinki 69.1 % (OSM includes fjord / sea water), so both use admin_boundary: osm_relation
#   (population still LAU POP_2024). Others: amsterdam 0.12, utrecht 0.54, madrid 0.08,
#   barcelona 2.29, stockholm 2.12, lyon 0.13, strasbourg 0.12, bordeaux 1.00, warsaw 0.05,
#   krakow 0.01, budapest 0.04, prague 0.13, ljubljana 0.10 (%).
# - Bratislava is not configured: LAU 2024 has no Bratislava municipality, only its 17 boroughs
#   (SK_528595 ... SK_529494, 367.61 km2, POP_2024 sum 478,040), and the code needs a lau_code
#   even for an osm_relation admin boundary. Queried for the record: Nominatim relation 1702499
#   (admin 5), FUA SK001F, NUTS3 SK010 (Bratislavský kraj, 2052.2 km2, not the city), Urban
#   Audit SK001C (367.61 km2 = the 17 boroughs), BikeNetKit bratislava_sk, region europe/slovakia
#   (smallest covering the union of the borough polygons; centroid 17.12E -> EPSG 25833).
