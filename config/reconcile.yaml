# Comparison map (spec §3). ours: either {preset} (metric value), {road_class} (km),
# or {tiers, basis, exclude?} (sum of tier km). Gap = (ours - theirs) / theirs.
# A basis of {parameter: name} (and a preset that has one) follows the presets.yaml parameter;
# the same gap on the other basis is listed as an informational `<key>~<basis>` row.
# required: true -> `reconcile --check` fails for a city with a run but no external row for it
# (M2 acceptance: Clean Cities 2025, QECIO and BikeNetKit for every pilot city).
threshold: 0.20
date_gap_days: 365
comparisons:
  - id: cc_ratio
    external: {source: clean_cities_2025, metric_name: protected_share_pct}
    ours: {preset: clean_cities_2025}
    required: true
  - id: cc_km
    external: {source: clean_cities_2025, metric_name: protected_km}
    ours: {tiers: [A, B], basis: {parameter: clean_cities_basis}}
  - id: cc_network_km
    external: {source: clean_cities_2025, metric_name: network_km}
    ours: {road_class: all_public}
  - id: qecio_main_km
    external: {source: qecio_v2_10, metric_name: main_roads_km}
    ours: {road_class: main_incl_motorway_raw}
    required: true
  - id: qecio_tracks_km
    external: {source: qecio_v2_10, metric_name: cycle_tracks_km}
    ours: {tiers: [A, B/segregated], basis: qecio_weighted}
  - id: qecio_lanes_km
    external: {source: qecio_v2_10, metric_name: cycle_lanes_km}
    ours: {tiers: [C, D], basis: qecio_weighted}
  - id: qecio_shared_km
    external: {source: qecio_v2_10, metric_name: shared_pedestrians_km}
    ours: {tiers: [B], exclude: [B/segregated], basis: qecio_weighted}
  - id: qecio_total_km
    external: {source: qecio_v2_10, metric_name: total_cycle_infra_km}
    ours: {tiers: [A, B, C, D], basis: qecio_weighted}
    tags: [definition_mismatch]   # QECIO total also counts limited-access roads
  - id: bnk_network_km
    external: {source: bikenetkit_v1, metric_name: bike_network_km}
    ours: {tiers: [A, B, E], basis: per_side}   # R10: BikeNetKit has no lanes (research §7)
    tags: [definition_mismatch, boundary_mismatch]
    required: true
  - id: official_new_km
    external: {source: [official, changing_cities], metric_name: new_cycle_infra_km}
    informational: true   # new km in a year, not stock: listed, never flagged
# Extra boundary_mismatch tags: source -> city ids. QECIO rows of a city with
# `nuts3_is_city: false` in cities.yaml are tagged automatically (e.g. Copenhagen: DK011 Byen
# København != Københavns Kommune), so list a city here only for another source.
boundary_mismatch: {}
# A source that does not cover a city: source id -> [{city, reason}]. A required comparison of
# that source is then not demanded for the city, and the report says so. A city listed here
# with a figure row from the source is a config error.
not_in_source:
  clean_cities_2025:
    - city: utrecht
      reason: not in the Clean Cities 2025 ranking (36 cities)
    - city: stockholm
      reason: not in the Clean Cities 2025 ranking (36 cities)
    - city: strasbourg
      reason: not in the Clean Cities 2025 ranking (36 cities)
    - city: bordeaux
      reason: not in the Clean Cities 2025 ranking (36 cities)
