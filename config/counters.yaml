# Open bike-counter portals (M8 spec §5.1). Research and retrieval log: docs/review/m8-counters.md;
# feasibility: docs/review/m8-feasibility.md §A. `velometer counters fetch` downloads `urls` in
# order into data/counters/<city>/ (git-ignored; retrieved.json records URL, licence and time per
# file); `load` reads them in that order, a later file winning on an hour both hold.
#
# Keys: adapter (src/velometer/counters/adapters/<adapter>.py), source (publisher, for the
# attribution line), licence, licence_url, page (dataset page), timezone (local hours), grain,
# base_year (index = 100, default 2019; spec §2.13), site_aliases (a portal id -> the canonical
# site id; ids mapped to one site are summed), exclude_columns (columns that aggregate other
# columns of the same file), boundary (drop sites outside the city's stored boundary of that kind).
cities:
  - city: berlin
    adapter: berlin
    source: Senatsverwaltung für Mobilität, Verkehr, Klimaschutz und Umwelt Berlin
    licence: dl-de-zero-2.0
    licence_url: https://www.govdata.de/dl-de/zero-2-0
    page: https://www.berlin.de/sen/uvk/mobilitaet-und-verkehr/verkehrsplanung/radverkehr/weitere-radinfrastruktur/zaehlstellen-und-fahrradbarometer/
    urls:
      - https://www.berlin.de/sen/uvk/_assets/verkehr/verkehrsplanung/radverkehr/weitere-radinfrastruktur/zaehlstellen-und-fahrradbarometer/gesamtdatei-stundenwerte.xlsx
    timezone: Europe/Berlin
    grain: hourly
    # Year-sheet headers renumbered against sheet Standortdaten; each pair shares its
    # installation date in the header (2021-12-16, 2022-10-06, 2023-11-22, 2016-05-01).
    # Standortdaten spells 17-SK-BRE-*; the year sheets 17-SZ-BRE-* (Steglitz-Zehlendorf).
    site_aliases:
      02-MI-AL-W: 01-MI-AL-W
      02-PA-SE-N: 11-PA-SE-N
      03-SP-NO-O: 16-SP-NO-O
      03-SP-NO-W: 16-SP-NO-W
      17-SZ-BRE-O: 17-SK-BRE-O
      17-SZ-BRE-W: 17-SK-BRE-W
  - city: paris
    adapter: paris
    source: Ville de Paris, Direction de la Voirie et des Déplacements
    licence: ODbL
    licence_url: http://opendatacommons.org/licenses/odbl/
    page: https://opendata.paris.fr/explore/dataset/comptage-velo-historique-donnees-compteurs/
    urls:
      - https://opendata.paris.fr/api/explore/v2.1/catalog/datasets/comptage-velo-historique-donnees-compteurs/attachments/2016_comptage_velo_donnees_compteurs_zip
      - https://opendata.paris.fr/api/explore/v2.1/catalog/datasets/comptage-velo-historique-donnees-compteurs/attachments/2017_comptage_velo_donnees_compteurs_zip
      - https://opendata.paris.fr/api/explore/v2.1/catalog/datasets/comptage-velo-historique-donnees-compteurs/attachments/2018_comptage_velo_donnees_compteurs_csv_zip
      - https://opendata.paris.fr/api/explore/v2.1/catalog/datasets/comptage-velo-historique-donnees-compteurs/attachments/2019_comptage_velo_donnees_compteurs_csv_zip
      - https://opendata.paris.fr/api/explore/v2.1/catalog/datasets/comptage-velo-historique-donnees-compteurs/attachments/2020_comptage_velo_donnees_compteurs_csv_zip
      - https://opendata.paris.fr/api/explore/v2.1/catalog/datasets/comptage-velo-historique-donnees-compteurs/attachments/2021_comptage_velo_donnees_compteurs_csv_zip
      - https://opendata.paris.fr/api/explore/v2.1/catalog/datasets/comptage-velo-historique-donnees-compteurs/attachments/2022_comptage_velo_donnees_compteurs_zip
      - https://opendata.paris.fr/api/explore/v2.1/catalog/datasets/comptage-velo-historique-donnees-compteurs/attachments/2023_comptage_velo_donnees_compteurs_zip
      - https://opendata.paris.fr/api/explore/v2.1/catalog/datasets/comptage-velo-historique-donnees-compteurs/attachments/2024_comptage_velo_donnees_compteurs_zip
      - https://opendata.paris.fr/api/explore/v2.1/catalog/datasets/comptage-velo-historique-donnees-compteurs/attachments/2025_comptage_velo_donnees_compteurs_zip
      # rolling 13 months (comptage-velo-donnees-compteurs), labels as headers, times in UTC
      - https://opendata.paris.fr/api/explore/v2.1/catalog/datasets/comptage-velo-donnees-compteurs/exports/csv?select=id_compteur,nom_compteur,id,name,sum_counts,date,coordinates&use_labels=true&timezone=UTC&delimiter=%3B
    timezone: Europe/Paris
    grain: hourly
  - city: vienna
    adapter: vienna
    source: Stadt Wien
    licence: CC BY 4.0
    licence_url: https://creativecommons.org/licenses/by/4.0/deed.de
    page: https://www.data.gv.at/katalog/datasets/2e9f926c-f688-4889-856d-5e6935440c28
    urls:
      - https://www.wien.gv.at/gogv/l9ogdradverkehrszaehlungen
    timezone: Europe/Vienna
    grain: daily
    # `Opernring` = `Opernring Innen` + `Opernring Außen` on every row of the 2026-10-07 file
    exclude_columns: [Opernring]

  - city: helsinki
    adapter: helsinki
    source: City of Helsinki, Urban Environment Division (Helsingin kaupunkiympäristön toimiala)
    licence: CC BY 4.0
    licence_url: https://creativecommons.org/licenses/by/4.0/
    page: https://hri.fi/data/en_GB/dataset/helsingin-pyorailijamaarat
    urls:
      - https://www.hel.fi/static/avoindata/kymp/Helsingin_pyorailijamaarat.xlsx
      - https://www.hel.fi/static/avoindata/kymp/pyoralaskentapisteiden_sijainnit.csv
    timezone: Europe/Helsinki
    grain: hourly
    # The two sides of three bridges are one site each (summed): the file moves counts between
    # the side columns (publisher: 2016 has both Kulosaari sides in one column; the 2026-08 file
    # has Kulosaari et. near 0 in 2015-2017 and Lauttasaari pohjoispuoli 0 in 2019 while the
    # other side holds about the pair's total; yearly totals in docs/review/m8-counters.md).
    site_aliases:
      Kulosaaren silta et.: Kulosaaren silta
      Kulosaaren silta po.: Kulosaaren silta
      Lauttasaaren silta eteläpuoli: Lauttasaaren silta
      Lauttasaaren silta pohjoispuoli: Lauttasaaren silta
      Munkkiniemen silta eteläpuoli: Munkkiniemen silta
      Munkkiniemi silta pohjoispuoli: Munkkiniemen silta
    # Our reading of the daily data (docs/review/m8-counters.md, Helsinki): these sites' counts
    # step down while they keep counting; the data do not say why. Used only for the Counts tab
    # note, which gives the index without them from that year on; the stored index keeps them
    # (spec §2.13, user ruling 2026-10-07).
    step_downs:
      - {site: Kaivokatu, since: 2024-04}
      - {site: Pitkäsilta länsipuoli, since: 2025-05}
  - city: madrid
    adapter: madrid
    source: Ayuntamiento de Madrid
    licence: CC BY 4.0
    licence_url: https://creativecommons.org/licenses/by/4.0/legalcode.es
    page: https://datos.madrid.es/dataset/300321-0-aforos-peatones-bicicletas
    # "Aforos bicicletas. <year>" CSVs. Files: none from July 2021 to August 2022; portal:
    # interruption August 2021 to September 2022 (detectors replaced). None published after
    # June 2024 (2026-10-07)
    urls:
      - https://datos.madrid.es/dataset/300321-0-aforos-peatones-bicicletas/resource/300321-25-aforos-peatones-bicicletas-csv/download/300321-25-aforos-peatones-bicicletas-csv.csv  # 2019 (from September)
      - https://datos.madrid.es/dataset/300321-0-aforos-peatones-bicicletas/resource/300321-12-aforos-peatones-bicicletas-csv/download/300321-12-aforos-peatones-bicicletas-csv.csv  # 2020
      - https://datos.madrid.es/dataset/300321-0-aforos-peatones-bicicletas/resource/300321-13-aforos-peatones-bicicletas-csv/download/300321-13-aforos-peatones-bicicletas-csv.csv  # 2021 (to June)
      - https://datos.madrid.es/dataset/300321-0-aforos-peatones-bicicletas/resource/300321-24-aforos-peatones-bicicletas-csv/download/300321-24-aforos-peatones-bicicletas-csv.csv  # 2022 (from September)
      - https://datos.madrid.es/dataset/300321-0-aforos-peatones-bicicletas/resource/300321-11-aforos-peatones-bicicletas-csv/download/300321-11-aforos-peatones-bicicletas-csv.csv  # 2023
      - https://datos.madrid.es/dataset/300321-0-aforos-peatones-bicicletas/resource/300321-10-aforos-peatones-bicicletas-csv/download/300321-10-aforos-peatones-bicicletas-csv.csv  # 2024 (to June)
    timezone: Europe/Madrid
    grain: hourly
    base_year: 2020  # data start in September 2019 (spec §2.13)
    # the methodology's clause after the gaps (the portal: interruption, detectors replaced)
    note: while the detectors were changed
    note_de: während die Detektoren getauscht wurden
  - city: oslo
    adapter: oslo
    source: Statens vegvesen (state counters)
    source_de: Statens vegvesen (staatliche Zählstellen)
    licence: NLOD
    licence_url: https://data.norge.no/nlod/no
    page: https://dataut.vegvesen.no/dataset/trafikkdata
    # GraphQL API, public, no key; the adapter queries BICYCLE points of county 3 and their
    # byDay volumes (see src/velometer/counters/adapters/oslo.py)
    urls:
      - https://trafikkdata-api.atlas.vegvesen.no/
    timezone: Europe/Oslo
    grain: daily
    boundary: lau
  - city: barcelona
    adapter: barcelona
    source: Ajuntament de Barcelona
    licence: CC BY 4.0
    licence_url: https://creativecommons.org/licenses/by/4.0/
    page: https://opendata-ajuntament.barcelona.cat/data/en/dataset/aforaments-detall
    # aforaments-descriptiu (gauges) then aforaments-detall (monthly average daily intensity per
    # day type), each by year; a later descriptor wins on a gauge
    urls:
      - https://opendata-ajuntament.barcelona.cat/data/dataset/2cdafd00-e37a-424e-a524-b551cd09052d/resource/eaa38b6a-6ebc-4341-ac27-54d3a68384fd/download/2017_aforament_descripcio.csv
      - https://opendata-ajuntament.barcelona.cat/data/dataset/2cdafd00-e37a-424e-a524-b551cd09052d/resource/fd64aa86-361f-4360-9d30-723a45d83c62/download/2018_aforament_descripcio.csv
      - https://opendata-ajuntament.barcelona.cat/data/dataset/2cdafd00-e37a-424e-a524-b551cd09052d/resource/1fd21acc-9207-4c71-88e5-42228c3b9a9a/download/2019_aforament_descripcio.csv
      - https://opendata-ajuntament.barcelona.cat/data/dataset/2cdafd00-e37a-424e-a524-b551cd09052d/resource/4f8a5bc4-dd6d-4a0a-bfad-6ae9ce952884/download/2020_aforament_descripcio.csv
      - https://opendata-ajuntament.barcelona.cat/data/dataset/2cdafd00-e37a-424e-a524-b551cd09052d/resource/96f546df-0d33-482d-b25e-3a95481c7309/download/2021_aforament_descripcio.csv
      - https://opendata-ajuntament.barcelona.cat/data/dataset/2cdafd00-e37a-424e-a524-b551cd09052d/resource/2430f242-8c05-441d-9fcf-128e0626d78c/download/2022_aforament_descripcio.csv
      - https://opendata-ajuntament.barcelona.cat/data/dataset/2cdafd00-e37a-424e-a524-b551cd09052d/resource/3d21495a-15b0-4779-b747-5a04edb67862/download/2023_aforament_descripcio.csv
      - https://opendata-ajuntament.barcelona.cat/data/dataset/2cdafd00-e37a-424e-a524-b551cd09052d/resource/f24b813b-f7ca-44fa-98e8-62efb35e72c5/download/2024_aforament_descripcio.csv
      - https://opendata-ajuntament.barcelona.cat/data/dataset/2cdafd00-e37a-424e-a524-b551cd09052d/resource/36d41387-a4e5-48fa-801d-698257e3a106/download/2025_aforament_descripcio.csv
      - https://opendata-ajuntament.barcelona.cat/data/dataset/a7a093f1-56ea-4766-a4ba-d6abad68d41d/resource/1fe314f4-0cfa-4a1a-8c6d-772f1ed56bf4/download/2017_aforament_detall_valor.csv
      - https://opendata-ajuntament.barcelona.cat/data/dataset/a7a093f1-56ea-4766-a4ba-d6abad68d41d/resource/49802a64-7863-4267-b2c8-6107d20dd898/download/2018_aforament_detall_valor.csv
      - https://opendata-ajuntament.barcelona.cat/data/dataset/a7a093f1-56ea-4766-a4ba-d6abad68d41d/resource/11ae1848-00d4-4163-b986-b5710fe20c03/download/2019_aforament_detall_valor.csv
      - https://opendata-ajuntament.barcelona.cat/data/dataset/a7a093f1-56ea-4766-a4ba-d6abad68d41d/resource/e37158fa-4f4b-4e78-a8de-6ea4532fae1b/download/2020_aforament_detall_valor.csv
      - https://opendata-ajuntament.barcelona.cat/data/dataset/a7a093f1-56ea-4766-a4ba-d6abad68d41d/resource/aee8449a-d120-48c3-a2fc-9cd1004cbbb4/download/2021_aforament_detall_valor.csv
      - https://opendata-ajuntament.barcelona.cat/data/dataset/a7a093f1-56ea-4766-a4ba-d6abad68d41d/resource/16d6d769-c9b5-4347-a6c9-46e8ff12d678/download/2022_aforament_detall_valor.csv
      - https://opendata-ajuntament.barcelona.cat/data/dataset/a7a093f1-56ea-4766-a4ba-d6abad68d41d/resource/3fb834b2-b353-4382-b1f1-b78177fbf5e8/download/2023_aforament_detall_valor.csv
      - https://opendata-ajuntament.barcelona.cat/data/dataset/a7a093f1-56ea-4766-a4ba-d6abad68d41d/resource/5b2c39d8-2f51-4fc5-9478-a479b77f9a48/download/2024_aforament_detall_valor.csv
      - https://opendata-ajuntament.barcelona.cat/data/dataset/a7a093f1-56ea-4766-a4ba-d6abad68d41d/resource/45fc3faa-cdc6-4ac3-83e9-d019c8a629b9/download/2025_aforament_detall_valor.csv
    timezone: Europe/Madrid
    grain: monthly

# Cities without an open, licensed counter series covering 2018-2025, and the portals checked
# (feasibility log §A, 2026-10-07). `note_de` is the German note, required beside `note` (M12).
none:
  - city: copenhagen
    checked: [data.kk.dk faste-cykeltaellinger]
    note: hourly counts 2005-2014 only, no licence stated
    note_de: nur Stundenwerte 2005–2014, keine Lizenz angegeben
  - city: amsterdam
    checked: [data.amsterdam.nl, NDW Dexter, maps-vervoerregio.nl]
    note: no city counter dataset found; regional counts published as maps only
    note_de: kein städtischer Zählstellendatensatz gefunden; regionale Zählwerte nur als Karten veröffentlicht
  - city: utrecht
    checked: [open.utrecht.nl fietstellingen]
    note: 2014-2016 only
    note_de: nur 2014–2016
  - city: stockholm
    checked: [openstreetgs.stockholm.se]
    note: counter station points and weekday mean flows; no open count series verified
    note_de: Zählstellenpunkte und mittlere Werktagsverkehre; keine offene Zählreihe bestätigt
  - city: lyon
    checked: [data.grandlyon.com]
    note: counting sites published; the count series not verified
    note_de: Zählstellen veröffentlicht; die Zählreihe nicht bestätigt
  - city: strasbourg
    checked: [data.strasbourg.eu, data.gouv.fr]
  - city: bordeaux
    checked: [opendata.bordeaux-metropole.fr pc_velo_p]
    note: rolling window from 2024-10 only
    note_de: nur ein gleitendes Zeitfenster ab 2024-10
  - city: wroclaw
    checked: [open-data.cui.wroclaw.pl]
  - city: warsaw
    checked: [zdm.waw.pl counter viewer]
    checked_de: [Zählstellen-Ansicht auf zdm.waw.pl]
    note: counts in a web viewer only, no dataset
    note_de: Zählwerte nur in einer Webansicht, kein Datensatz
  - city: krakow
    checked: [otwartedane.um.krakow.pl, bip.krakow.pl]
    note: counter locations and survey reports only
    note_de: nur Zählstellenstandorte und Erhebungsberichte
  - city: budapest
    checked: [kerekparosklub.hu/szamlalo]
    note: published by a cyclists' association, no open licence stated
    note_de: von einem Radfahrverband veröffentlicht, keine offene Lizenz angegeben
  - city: prague
    checked: [lkod.cz/catalog/praha, api.golemio.cz]
    note: API needs a token; bulk files after 2020 not confirmed
    note_de: API erfordert ein Token; Gesamtdateien nach 2020 nicht bestätigt
  - city: ljubljana
    checked: [podatki.gov.si pldp-stevna-mesta-kolesarji]
    note: national counts, no site in Ljubljana
    note_de: landesweite Zählungen, keine Zählstelle in Ljubljana
  - city: bratislava
    checked: [data.bratislava.sk]
