  SE: {status: pending, basis: "Golden sample and tagging diagnostics (M5)",
       basis_de: "Referenzstichprobe und Tagging-Diagnose (M5)", golden: tests/fixtures/golden/se}
  "NO": {status: pending, basis: "Golden sample and tagging diagnostics (M5)",
