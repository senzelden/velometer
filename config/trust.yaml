# Per-country trust gate (M5 spec section 3). Not part of config_sha256: signing off a country
# never invalidates runs. Report surfaces show only cities of trusted countries.
thresholds:            # set in Task 13 from the pilots (largest pilot value x 1.25)
  unrecognised_share_max: 1.0
  excluded_share_max: 1.0
  b_share_of_ab_max: 1.0
  boundary_diff_pct_max: 5.0
# basis_de: the German wording of basis, shown in docs/methodology.de.md (falls back to basis)
countries:
  DE: {status: trusted, basis: "Berlin golden set (M1)",
       basis_de: "Berliner Referenzstichprobe (M1)"}
  FR: {status: trusted, basis: "M2 reconciliation",
       basis_de: "Abgleich mit veröffentlichten Zahlen (M2)", pilot: paris}
  AT: {status: trusted, basis: "M2 reconciliation",
       basis_de: "Abgleich mit veröffentlichten Zahlen (M2)", pilot: vienna}
  DK: {status: trusted, basis: "M2 reconciliation",
       basis_de: "Abgleich mit veröffentlichten Zahlen (M2)", pilot: copenhagen}
  PL: {status: trusted, basis: "M2 reconciliation",
       basis_de: "Abgleich mit veröffentlichten Zahlen (M2)", pilot: wroclaw}
