# Known limitations, rendered into docs/methodology.md (en) and docs/methodology.de.md (de)
# by `velometer report methodology` (M4 spec section 4.4). Every entry needs non-empty `en`
# and `de` text; a missing language fails the load and `report methodology --check`.
limitations:
  - id: mapped_km
    en: >-
      All OSM lengths are mapped km, not built km. A rise can come from construction, but also
      from a mapping campaign, an import or a change in tagging practice. No figure here states
      what a city has built [ADR 0006].
    de: >-
      Alle OSM-Längen sind kartierte Kilometer, keine gebauten Kilometer. Ein Zuwachs kann auf
      Bau zurückgehen, aber auch auf eine Kartierungsaktion, einen Import oder eine geänderte
      Erfassungspraxis. Keine der Zahlen hier besagt, was eine Stadt gebaut hat [ADR 0006].
  - id: population_2024
    en: >-
      The population is the LAU 2024 figure. Where the LAU has none, as for French communes, it
      is a cited national-statistics figure described below, or else the figure of the
      identical NUTS3 unit [ADR 0004]. The same value is used for
      every snapshot year, so per-100k values do not follow population change [M3 spec,
      decision 2].
    de: >-
      Die Einwohnerzahl ist der LAU-Wert 2024. Fehlt er, wie bei französischen Gemeinden, gilt
      der unten beschriebene, belegte Wert des nationalen Statistikamts, ersatzweise der Wert
      der deckungsgleichen NUTS-3-Einheit [ADR 0004]. Derselbe Wert
      gilt für jedes
      Stichjahr. Werte je 100.000 Einwohner bilden Bevölkerungsänderungen daher nicht ab
      [M3-Spezifikation, Entscheidung 2].
  - id: fua_no_per_100k
    en: >-
      FUA runs carry no population, so the FUA has no per-100k figure [M4 spec §4.4;
      `city_boundary` in `sources/boundaries.py` returns a population only for the LAU]. The FUA
      serves as a robustness check [ADR 0004].
    de: >-
      FUA-Läufe führen keine Einwohnerzahl. Für die FUA gibt es daher keinen Wert je 100.000
      Einwohner [M4-Spezifikation §4.4; `city_boundary` in `sources/boundaries.py` liefert eine
      Einwohnerzahl nur für die LAU]. Die FUA dient als Robustheitsprüfung [ADR 0004].
  - id: no_width_surface
    en: >-
      The tiers do not consider width or surface. A narrow or rough cycle track counts like any
      other way of its tier. The share of lengths tagged with `width`, `surface` and
      `segregated` is recorded per tier as a diagnostic only [ADR 0002, ADR 0006].
    de: >-
      Die Stufen berücksichtigen weder Breite noch Oberfläche. Ein schmaler oder holpriger
      Radweg zählt wie jeder andere Weg seiner Stufe. Der Längenanteil mit `width`, `surface`
      und `segregated` wird je Stufe nur als Diagnose erfasst [ADR 0002, ADR 0006].
  - id: classifier_gaps_excluded
    en: >-
      Tagging that the classifier recognises but does not treat as cycling infrastructure, for
      example `cycleway=shoulder`, an untyped `cycleway=yes` or a path with explicit mountain-bike
      tagging (`mtb:scale`, `mtb`, `mtb:type`, `cycling=mtb`), is classified as excluded and
      counts in no preset (see the rules table). Road sides with cycling tags that no rule
      matches are reported as unrecognised km. They are not added to any tier [M3 R11;
      classifier v2, decided after M3].
    de: >-
      Erfassungen, die der Klassifikator erkennt, aber nicht als Radverkehrsanlage wertet, etwa
      `cycleway=shoulder`, ein `cycleway=yes` ohne Typ oder ein Weg mit ausdrücklicher
      Mountainbike-Kennzeichnung (`mtb:scale`, `mtb`, `mtb:type`, `cycling=mtb`), gelten als
      ausgeschlossen und zählen in keiner Kennzahlvariante (siehe Regeltabelle). Straßenseiten mit Radverkehrs-Tags,
      auf die keine Regel passt, werden als nicht erkannte Kilometer ausgewiesen. Sie fließen
      in keine Stufe ein [M3 R11; Klassifikator v2, nach M3 entschieden].
  - id: published_scope
    en: >-
      Clean Cities 2025 used city-submitted figures for most cities and OSM only as a fallback.
      The `clean_cities_2025` preset reproduces that fallback method, not the published
      numbers [ADR 0001, ADR 0003]. QECIO v2.10 publishes results only per NUTS3 region,
      frozen in January 2024. A NUTS3 region need not match the city boundary [ADR 0001].
    de: >-
      Clean Cities 2025 hat für die meisten Städte von den Städten gemeldete Zahlen verwendet
      und OSM nur ersatzweise. Die Kennzahlvariante `clean_cities_2025` bildet diese
      Ersatzmethode nach, nicht die veröffentlichten Zahlen [ADR 0001, ADR 0003]. QECIO v2.10
      veröffentlicht Ergebnisse nur je NUTS-3-Region, Stand Januar 2024. Eine NUTS-3-Region
      muss nicht mit der Stadtgrenze übereinstimmen [ADR 0001].
  - id: dirty_provenance_m3
    en: >-
      A run records the git commit it ran from. When the working tree had uncommitted changes,
      the commit carries the suffix `-dirty` and does not pin the code exactly. Most M3 history
      runs (classifier v1) carry it, because docs and scripts were uncommitted while they ran
      [M3 R19]. They are superseded by the M4 runs and not shown; no run in this report carries
      the suffix [M4 spec §3.4].
    de: >-
      Jeder Lauf speichert den Git-Commit, mit dem er erstellt wurde. Gab es dabei
      nicht committete Änderungen im Arbeitsverzeichnis, trägt der Commit die Endung `-dirty`
      und legt den Code nicht genau fest. Die meisten historischen Läufe aus M3 (Klassifikator
      v1) tragen diese Endung, weil Dokumentation und Skripte während der Läufe nicht committet
      waren [M3 R19]. Sie sind durch die Läufe aus M4 ersetzt und werden nicht gezeigt; kein Lauf
      in diesem Bericht trägt die Endung [M4-Spezifikation §3.4].
  - id: history_vs_current_date
    en: >-
      History snapshots are cut from Geofabrik full-history files, which end on the date they
      were downloaded. The current run reads public extracts, whose OSM timestamp can be a
      different date. The mapping activity of the current point ends where the history file
      ends [M3 R9]. A current run merged from several regions takes the oldest region
      timestamp [M4 spec §3.2].
    de: >-
      Die Jahresstände werden aus Geofabrik-Dateien mit vollständiger Versionsgeschichte
      geschnitten. Diese enden am Tag ihres Downloads. Der aktuelle Lauf liest öffentliche
      Extrakte, deren OSM-Zeitstempel ein anderes Datum haben kann. Die Kartierungsaktivität
      des aktuellen Stands endet dort, wo die Verlaufsdatei endet [M3 R9]. Ein aktueller Lauf
      aus mehreren zusammengeführten Regionen trägt den ältesten Zeitstempel der Regionen
      [M4-Spezifikation §3.2].
  - id: trust_gate
    en: >-
      The trust gate checks tagging practice, not whether the map is complete. Its thresholds
      catch cycling tags that the classifier does not recognise or excludes, an unusually high
      share of tier B in A+B, and an admin boundary that differs from the OSM relation [M5 spec
      §3.1]. The golden sample has about 12 ways per new country. That is too few to cover
      every local tagging habit [M5 spec §3.2]. France, Poland, Austria and Denmark have no
      golden sample of their own: they were trusted through the M2 reconciliation of their
      pilot cities [M5 spec, decision 7].
    de: >-
      Die Freigabe je Land prüft die Erfassungspraxis, nicht die Vollständigkeit der Karte.
      Ihre Schwellenwerte schlagen an bei Radverkehrs-Tags, die der Klassifikator nicht erkennt
      oder ausschließt, bei einem ungewöhnlich hohen Anteil der Stufe B an A+B und bei einer
      Verwaltungsgrenze, die von der OSM-Relation abweicht [M5-Spezifikation §3.1]. Die
      Referenzstichprobe umfasst etwa 12 Wege für jedes neue Land. Das reicht nicht, um jede
      örtliche Erfassungsgewohnheit abzudecken [M5-Spezifikation §3.2]. Frankreich, Polen,
      Österreich und Dänemark haben keine eigene Referenzstichprobe: Sie wurden über den Abgleich
      ihrer Pilotstädte in M2 freigegeben [M5-Spezifikation, Entscheidung 7].
  - id: population_national_statistics
    en: >-
      Some cities have no LAU population, and neither their NUTS3 unit (a province or
      département) nor their Urban Audit city (a greater city) matches the municipality. Their
      population is the official figure of the national statistics office, cited with its year
      and URL in `config/cities.yaml` (`population_override`) [user decision on population of
      2026-10-03, `docs/superpowers/rulings-m5.md`]. That year may not be 2024, so their per-100k values can
      rest on a different year than those of the other cities. The tables above give the year
      and source of each figure.
    de: >-
      Für einige Städte gibt es keine LAU-Einwohnerzahl, und weder ihre NUTS-3-Einheit (eine
      Provinz oder ein Département) noch ihre Urban-Audit-Stadt (eine erweiterte Stadt) deckt
      sich mit der Gemeinde. Ihr Einwohnerwert ist die amtliche Zahl des nationalen
      Statistikamts, mit Jahr und URL belegt in `config/cities.yaml` (`population_override`)
      [Entscheidung zur Einwohnerzahl vom 3. Oktober 2026, `docs/superpowers/rulings-m5.md`]. Das Jahr muss nicht
      2024 sein; ihre Werte je 100.000 Einwohner können sich daher auf ein anderes Jahr stützen
      als die der übrigen Städte. Jahr und Quelle jedes Werts stehen in den Tabellen oben.
  - id: qecio_nuts3_not_city
    en: >-
      QECIO v2.10 publishes results per NUTS3 region. Where that region is not the city, the
      QECIO figure covers a different area than our runs. The city's QECIO comparison rows then
      carry the note "NUTS3 unit is not the city", and the rankings chart marks the city with †
      [M5 spec §4.3].
    de: >-
      QECIO v2.10 veröffentlicht Ergebnisse je NUTS-3-Region. Ist diese Region nicht die Stadt,
      bezieht sich die QECIO-Zahl auf ein anderes Gebiet als die eigenen Läufe. Die
      QECIO-Vergleichszeilen der Stadt tragen dann den Hinweis „NUTS3 unit is not the city“
      (NUTS-3-Einheit ist nicht die Stadt), und das Ranglistendiagramm kennzeichnet die Stadt
      mit † [M5-Spezifikation §4.3].
  - id: subareas_osm
    en: >-
      Bezirk boundaries are the 12 OSM administrative relations (admin_level 9), queried from
      the Berlin extract. Km inside the LAU boundary but outside every Bezirk (the LAU is
      generalised at 1:1M) are reported as a separate "outside the Bezirke" row, so the Bezirk
      rows plus that row add up to the city total.
    de: >-
      Die Bezirksgrenzen sind die 12 administrativen OSM-Relationen (admin_level 9), abgefragt
      aus dem Berliner Extrakt. Kilometer innerhalb der LAU-Grenze, aber außerhalb jedes
      Bezirks (die LAU ist im Maßstab 1:1 Mio. generalisiert), werden als eigene Zeile
      „außerhalb der Bezirke“ ausgewiesen, sodass die Bezirkszeilen und diese Zeile zusammen
      die Summe der Stadt ergeben.
  - id: change_map_mapped
    en: >-
      The change map compares two snapshots on the same classifier. A gain is a way newly mapped
      as cycling infrastructure, and a loss is one no longer mapped. Redrawn and retagged ways
      are shown separately; a piece split off an existing way (a new way id on the length that
      way lost) counts as redrawn, not as a gain. The page also gives the net change per tier.
      None of it is evidence of construction (ADR 0006). A single new path that replaces tracks
      on both sides of a road counts as redrawn on both sides, so redrawn km can include a real
      reduction from two sides to one.
    de: >-
      Die Änderungskarte vergleicht zwei Stände mit demselben Klassifikator. Ein Zugewinn ist
      ein Weg, der neu als Radverkehrsanlage kartiert ist, ein Verlust ein Weg, der nicht mehr
      so kartiert ist. Neu gezeichnete und neu getaggte Wege werden getrennt ausgewiesen; ein
      Stück, das von einem bestehenden Weg abgetrennt wurde (eine neue Weg-ID auf der Länge, die
      dieser Weg verlor), zählt als neu gezeichnet, nicht als Zugewinn. Die Seite nennt auch die
      Nettoänderung je Stufe. Nichts davon belegt einen Bau (ADR 0006). Ein einzelner neuer Weg,
      der Radwege auf beiden Seiten einer Straße ersetzt, zählt auf beiden Seiten als neu
      gezeichnet; die neu gezeichneten Kilometer können daher eine tatsächliche Verringerung von
      zwei Seiten auf eine enthalten.
  - id: mtb_excluded
    en: >-
      Paths with explicit mountain-bike tagging (mtb:scale, mtb, mtb:type, cycling=mtb) are
      excluded. Trails without such tags remain counted.
    de: >-
      Wege mit ausdrücklicher Mountainbike-Kennzeichnung (mtb:scale, mtb, mtb:type, cycling=mtb)
      sind ausgeschlossen. Pfade ohne solche Tags bleiben gezählt.
