# Cycling plans, one entry per plan (M8 spec §4.1); loaded by velometer.plans.models.
# Research log with the page-level check of every value: docs/review/m8-plans.md.
# Targets are stored as printed. A plan without a printed km target has target_kind none.
# Berlin publishers are organisation profile ids; the other cities name their publisher
# (`publisher_de` only where that name holds our English words).

- id: berlin_rvp_2021
  city: berlin
  title: Radverkehrsplan des Landes Berlin (Verordnung vom 16. November 2021, Vorlage zur Kenntnisnahme vo19-013)
  adopted: 2021-11-16
  url: https://www.parlament-berlin.de/ados/19/IIIPlen/vorgang/verordnungen/vo19-013.pdf
  status: current
  publisher: senmvku
  note: >-
    Issued by the Senatsverwaltung für Umwelt, Verkehr und Klimaschutz (predecessor of SenMVKU).
    Targets from Tabelle 7 'Jahresausbauziele zur Errichtung des Radverkehrsnetzes Berlin' (PDF p.
    42, plan p. 21): yearly completion in km, rounded to 5 km; the printed sums 850 km
    (Vorrangnetz ohne RSV), 1.500 km (Ergänzungsnetz) and 2.350 km are rounded to 25 km
    (footnote 12). Tabelle 3 (PDF p. 35, plan p. 14) gives the network lengths 865 km
    (Radvorrangnetz), 1.506 km (Ergänzungsnetz), 2.371 km in total. Progress reports before 2022
    count facility length with each side of a street counted (item anlagen); from the 2021 report
    on, network items count route length once per street section.
  note_de: >-
    Herausgegeben von der Senatsverwaltung für Umwelt, Verkehr und Klimaschutz (Vorgängerin der
    SenMVKU). Ziele aus Tabelle 7 'Jahresausbauziele zur Errichtung des Radverkehrsnetzes Berlin'
    (PDF S. 42, Plan S. 21): jährliche Fertigstellung in km, auf 5 km gerundet; die gedruckten
    Summen 850 km (Vorrangnetz ohne RSV), 1.500 km (Ergänzungsnetz) und 2.350 km sind auf 25 km
    gerundet (Fußnote 12). Tabelle 3 (PDF S. 35, Plan S. 14) nennt die Netzlängen 865 km
    (Radvorrangnetz), 1.506 km (Ergänzungsnetz), insgesamt 2.371 km. Fortschrittsberichte vor 2022
    zählen die Anlagenlänge mit jeder Straßenseite (Position anlagen); ab dem Bericht 2021 zählen
    die Netzpositionen die Streckenlänge einmal je Straßenabschnitt.
  items:
    - id: vorrangnetz
      label: Vorrangnetz (ohne Radschnellverbindungen)
      label_de: Vorrangnetz (ohne Radschnellverbindungen)
      target_kind: km_per_year
      targets: {2022: 40, 2023: 60, 2024: 100, 2025: 150, 2026: 250, 2027: 250}
    - id: ergaenzungsnetz
      label: Ergänzungsnetz
      label_de: Ergänzungsnetz
      target_kind: km_per_year
      targets: {2025: 50, 2026: 100, 2027: 100, 2028: 350, 2029: 450, 2030: 450}
    - id: radverkehrsnetz
      label: Radverkehrsnetz (Vorrangnetz + Ergänzungsnetz)
      label_de: Radverkehrsnetz (Vorrangnetz + Ergänzungsnetz)
      target_kind: km_per_year
      targets: {2022: 40, 2023: 60, 2024: 100, 2025: 200, 2026: 350, 2027: 350, 2028: 350, 2029: 450, 2030: 450}
    - id: hauptverkehrsstrassen
      label: Hauptverkehrsstraßen außerhalb des Radverkehrsnetzes
      label_de: Hauptverkehrsstraßen außerhalb des Radverkehrsnetzes
      target_kind: none
    - id: sonstige_strecke
      label: Sonstige Strecke
      label_de: Sonstige Strecke
      target_kind: none
    - id: sonstiges_netz
      label: Sonstiges Netz (as named in Drs 19/27049; outside Vorrang- and Ergänzungsnetz)
      label_de: Sonstiges Netz (so benannt in Drs 19/27049; außerhalb von Vorrang- und Ergänzungsnetz)
      target_kind: none
    - id: total
      label: All reported routes (Summe)
      label_de: Alle gemeldeten Strecken (Summe)
      target_kind: none
    - id: anlagen
      label: Radverkehrsanlagen, facility length with each side counted (reports on 2020 and 2021)
      label_de: Radverkehrsanlagen, Anlagenlänge mit jeder Straßenseite gezählt (Berichte zu 2020 und 2021)
      target_kind: none

