# GoAccess for the visitor statistics (M16 spec §4.4, ruling R3), as /etc/goaccess/velometer.conf
# on the server. `tools/server.py stats` feeds it the last 14 days of both sites' Caddy access
# logs (JSON, client address already masked to IPv4 /24 and IPv6 /48 by Caddy) and copies the
# HTML report to data/stats/. The report is never served.

log-format CADDY

# The masked addresses are not shown as a panel; they only feed the visitor count and countries.
ignore-panel HOSTS

# Countries offline from DB-IP Lite Country (CC BY 4.0, legal review 1.10), downloaded monthly
# on the server by velometer-dbip.timer (deploy/cloud-init.yaml).
geoip-database /var/lib/goaccess/dbip-country-lite.mmdb
html-report-title velometer and Zählwerk Berlin Datalab. IP Geolocation by DB-IP (https://db-ip.com), CC BY 4.0

# One report for both sites; the virtual-hosts panel tells them apart.
real-os true
no-query-string true

# File downloads count as static requests (CSV, PNG, GeoJSON and the site's own assets).
static-file .css
static-file .js
static-file .png
static-file .svg
static-file .ico
static-file .woff2
static-file .csv
static-file .geojson
static-file .json
static-file .pmtiles
