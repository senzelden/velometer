id: infravelo
name: GB infraVelo GmbH
lang: de
kind: agency
url: https://www.infravelo.de/
sections:
  - heading: Who they are
    paragraphs:
      - >-
        GB infraVelo GmbH was founded in mid-2017 on behalf of the Senate transport department
        [@infravelo-ueber-uns]. It is a wholly owned subsidiary of the state-owned Grün Berlin GmbH
        [@infravelo-ueber-uns] and is funded by allocations from Berlin's public budget
        [@infravelo-faq]. It does not initiate projects: SenMVKU assigns and prioritises them, and
        infraVelo manages their planning and construction as the client [@infravelo-faq]. The
        <i lang="de">Bezirke</i> (districts) and SenMVKU also run cycling projects themselves
        [@infravelo-faq].
  - heading: How they measure
    dimensions:
      scope: >-
        cycling measures of all Berlin <i lang="de">Bezirke</i> (districts), recorded as projects
        [@infravelo-faq]
      kind: projects, monitored above all for scheduling and finances [@infravelo-faq]
      length: not stated by the source
      date: updated quarterly by the districts [@infravelo-faq]
      area: <i lang="de">Land Berlin</i> (state of Berlin) [@infravelo-faq]
      method: >-
        a cloud project database developed by infraVelo and kept up by district project leads
        [@infravelo-faq]
    paragraphs:
      - >-
        Since January 2020 infraVelo has kept a central database of all cycling measures in
        Berlin, which the districts update every quarter [@infravelo-faq]. The Senate's progress
        report draws mainly on this database [@berlin-fortschrittsbericht-2025], so the reported
        km and infraVelo's project list share one source.
      - >-
        In our reading this is a register of projects, not a survey of the street: a measure
        enters when a district records it, with the length its project gives.
  - heading: Political role
    paragraphs:
      - >-
        The direction and priorities of infraVelo's projects lie with SenMVKU
        [@infravelo-organisation]; in our reading it has no political mandate of its own. It chairs
        three to four steering rounds a year with each of the <i lang="de">Bezirke</i> (districts)
        and SenMVKU [@infravelo-faq] and shows the database on a public project map
        [@infravelo-faq].
      - >-
        In our reading, because the report to the Hauptausschuss rests on its database
        [@berlin-fortschrittsbericht-2025] [@berlin-dpa-fortschrittsbericht-hauptausschuss], the
        completeness of infraVelo's data is part of what parliament scrutinises when it reads
        the Senate's figures.
