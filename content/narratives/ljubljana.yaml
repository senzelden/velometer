city_id: ljubljana
title: "Ljubljana: sidepaths redrawn, then a steady climb"
dek: >-
  The headline rose from 46.5 to 73.5 mapped A+B km per 100 km of main roads between 2018 and
  October 2026; its largest step is the same paths mapped a new way.
sections:
  - heading: From 2018 to now
    paragraphs:
      - >-
        Mapped A+B km in Ljubljana's city proper rose from 128 in 2018 to 245 in October 2026,
        and the headline from 46.5 to 73.5. The largest step sits at the 2021 point, 138 → 194
        km. Our explanation finds a mapping campaign in late 2020: road sides lost their
        cycle-track tags and the sidepaths beside them were drawn as separate ways [#ts_lau_2021].
        Much of that step is existing paths mapped in a new way, not new infrastructure.
      - >-
        In 2022 and 2023 the same sidepaths were retagged from cycleway to path, which under
        classifier v4 moves almost nothing between tiers [#ts_lau_2022]. Mapped painted lanes
        (tier D) went from 37 to 102 km. Since the January 2026 snapshot A+B rose again, from
        228 to 245 km, as side paths were drawn as separate ways along a few roads at the city
        edge [#shift_current]. Whether those paths are new on the ground cannot be told from the
        data.
      - >-
        The functional urban area nearly tripled, from 211 to 617 mapped km. After 2021 its
        flagged jumps come mostly from mapping outside the city; for 2025 the explanation infers
        from the tags of two ways that some of the new km is probably new infrastructure
        [#ts_fua_2025].
  - heading: Why the figures differ
    role: figures
    paragraphs:
      - >-
        Ljubljana's own figures disagree with one another and state no length basis or counting
        date: the city's web page counts lanes on footways and carriageways together with
        separated tracks and shared paths [@ljubljana-mol-hoja-in-kolesarjenje], while our
        headline leaves lanes out. Clean Cities 2025 counts protected infrastructure only
        [@cc2025-annexes]. Its 251 km is close to our per-side A+B of 245 km (−2.4%), though the
        report does not say whether the city submitted it. Its road network of 1,649 km is wider
        than our 1,172 km, so its ratio is 15% against our 20.9% [#rec_cc_ratio]. QECIO counts
        the whole NUTS3 region around the city, not the municipality [#rec_qecio_main].
