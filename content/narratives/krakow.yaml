city_id: krakow
title: "Kraków: mapped km nearly doubled, and half of one jump is retagging"
dek: >-
  The headline rose from 40.2 to 72.6 mapped A+B km per 100 km of main roads between 2018 and
  October 2026, the steepest relative climb of the three Polish cities.
sections:
  - heading: From 2018 to now
    paragraphs:
      - >-
        Kraków's mapped A+B km in the city proper rose from 161 in 2018 to 296 in October 2026,
        up 84%, and the headline from 40.2 to 72.6. Tier A went from 112 to 192 km and tier B
        from 49 to 105 km; painted lanes stayed small, at 22 km now.
      - >-
        The largest step is the 2024 point, +33 km of A+B. About half of it is new ways and half
        is existing footways and paths retagged as designated cycle paths [#ts_lau_2024], so
        part of that jump is a change of tags, not new infrastructure. The earlier flag, on
        2022, is a tag change on contraflow lanes that leaves A+B on its normal course
        [#ts_lau_2022].
      - >-
        The functional urban area grew from 202 to 541 mapped km. Its early jumps came largely from
        mappers adding long regional routes east of the city, the Wiślana Trasa Rowerowa in
        2019 and Velo Raba in 2020 [#ts_fua_2019].
  - heading: Why the figures differ
    role: figures
    paragraphs:
      - >-
        The city's own totals use a broad definition that also counts <i lang="pl">chodniki z
        dopuszczonym ruchem rowerowym</i> (footways where cycling is allowed) and
        <i lang="pl">kontraruch rowerowy</i> (contraflow cycling) in calmed streets, both outside
        our A+B [@krakow-250km-2022], and they give neither a length basis nor a counting method.
        Clean Cities 2025 counts protected infrastructure [@cc2025-annexes]: its 229 km is below
        every OSM count near its date, and our per-side A+B is 29.3% above it. As for Warsaw, the
        reason may be that shared foot and cycle paths are left out, but that is an inference
        [#rec_cc_km]. Its road network of 2,128 km is wider than our 1,718 km, so its ratio is 11%
        against our 17.2%.
