city_id: krakow
title:
  text: >-
    Krakau: kartierte km fast verdoppelt, ein Sprung geht zur Hälfte auf Umtaggung
    zurück
  src: a9a4ba7ceaca
dek:
  text: >-
    Die Hauptkennzahl stieg zwischen 2018 und Oktober 2026 von 40,2 auf 72,6 kartierte
    A+B-km je 100 km Hauptstraßen, der steilste relative Anstieg der drei polnischen
    Städte.
  src: 61f6dabfc930
sections:
- heading:
    text: Von 2018 bis heute
    src: 75c16b3a0a92
  paragraphs:
  - text: >-
      Die kartierten A+B-km in Krakaus Kernstadt stiegen von 161 im Jahr 2018 auf
      296 im Oktober 2026, ein Plus von 84 %, und die Hauptkennzahl von 40,2 auf 72,6.
      Stufe A ging von 112 auf 192 km und Stufe B von 49 auf 105 km; markierte Radfahrstreifen
      blieben ein kleiner Posten, heute 22 km.
    src: 991662f98cb1
  - text: >-
      Der größte Schritt ist der Punkt 2024, +33 km A+B. Etwa die Hälfte davon sind
      neue Wege, die andere Hälfte bestehende Gehwege und Wege, die als für den Radverkehr
      ausgewiesene Wege neu getaggt wurden [#ts_lau_2024]; ein Teil dieses Sprungs
      ist also eine Änderung von Tags, keine neue Infrastruktur. Der frühere Prüfhinweis,
      für 2022, betrifft eine Tag-Änderung an Radfahrstreifen gegen die Einbahnrichtung,
      die den normalen Verlauf von A+B nicht verändert [#ts_lau_2022].
    src: fb5e91ad53ad
  - text: >-
      Der funktionale Stadtraum wuchs von 202 auf 541 kartierte km. Seine frühen Sprünge
      kamen größtenteils von Kartierenden, die lange regionale Routen östlich der
      Stadt hinzufügten, die Wiślana Trasa Rowerowa im Jahr 2019 und Velo Raba im
      Jahr 2020 [#ts_fua_2019].
    src: a349a805d85a
- heading:
    text: Warum die Zahlen abweichen
    src: 8cc8463f82aa
  paragraphs:
  - text: >-
      Die eigenen Summen der Stadt verwenden eine weite Definition, die auch Gehwege
      mit erlaubtem Radverkehr und Radfahren gegen die Einbahnrichtung in verkehrsberuhigten
      Straßen zählt, beides außerhalb unseres A+B [@krakow-250km-2022], und sie nennen
      weder Längenbasis noch Zählmethode. Clean Cities 2025 zählt geschützte Infrastruktur
      [@cc2025-annexes]: Seine 229 km liegen unter jeder OSM-Zählung nahe seinem Datum,
      und unser A+B-Wert je Seite liegt 29,3 % darüber. Wie bei Warschau könnte der
      Grund sein, dass Geh- und Radwege ausgelassen werden, doch das ist eine Schlussfolgerung
      [#rec_cc_km]. Sein Straßennetz von 2.128 km ist weiter gefasst als unsere 1.718
      km, daher beträgt sein Verhältnis 11 % gegenüber unseren 17,2 %.
    src: f28416373942
