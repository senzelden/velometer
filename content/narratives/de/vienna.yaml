city_id: vienna
title:
  text: 'Wien: ein später, stetiger Anstieg'
  src: d10d8399767d
dek:
  text: >-
    Die kartierten A+B-km je 100 km Hauptstraßen stiegen von 74,6 im Jahr 2018 auf
    89,1 im Oktober 2026, größtenteils seit 2024.
  src: fe6d02b32e69
sections:
- heading:
    text: Seit 2018
    src: 310f41f80f38
  paragraphs:
  - text: >-
      Wiens Hauptkennzahl, kartierte A+B-km je 100 km Hauptstraßen, ging von 74,6
      im Jahr 2018 auf 89,1 im Oktober 2026 und die kartierten A+B-km von 558 auf
      666 km [#ts-lau]. Bis 2024 blieb sie zwischen 73,8 und 79,7; seitdem ist sie
      jedes Jahr gestiegen, auf 83,0 im Jahr 2025 und 87,3 im Jahr 2026. Kartierte
      baulich getrennte Radwege (Stufe A) tragen den größten Teil des Zuwachses, von
      239 auf 314 km. Geh- und Radwege (B) stiegen von 320 auf 352 km, Fahrradstraßen
      und Busspuren (E) von 18 auf 41 km.
    src: d396c92ae56f
  - text: >-
      Das einzige markierte Jahr, 2025, ist eine Drift der Tags, keine neue Infrastruktur:
      Kartierende ersetzten das alte Tag `cycleway=opposite_lane` für Gegenrichtungs-Radfahrstreifen
      in Einbahnstraßen [#expl-lau-2025]. Das betraf nur markierte Radfahrstreifen
      (D), die seit 2018 zwischen 252 und 285 km liegen [#ts-lau].
    src: 17fdfe627c99
  - text: >-
      Der funktionale Stadtraum stieg gleichmäßiger, von 18,1 auf 22,8, mit einer
      anderen Mischung: Dort schrumpfte Stufe A von 603 auf 512 km, während Stufe
      B von 683 auf 1.105 km wuchs [#ts-fua].
    src: 14fc691b511a
- heading:
    text: Warum die Zahlen der Stadt abweichen
    src: af1f35c88bc5
  paragraphs:
  - text: >-
      Wiens eigene Netzsumme zählt jede Art von Anlage auf beiden Seiten einer Straße,
      einschließlich Straßen mit Radverkehr gegen die Einbahnrichtung, verkehrsberuhigter
      Gebiete und beschilderter Routen [@vienna-radverkehrsnetz-fakten], und umfasst
      damit weit mehr als A+B. Die Bilanz 2025 von 20,4 km zählt Projekte im Hauptradverkehrsnetz,
      die in diesem Jahr begonnen wurden, nicht abgeschlossene [@vienna-radwegeausbau-bilanz-2025].
      Clean Cities druckte zuerst 14 %; im Juli 2025 setzte es Wien auf 22,0 % herauf,
      nachdem Straßen mit eingeschränkter Kfz-Zufahrt in verkehrsberuhigten Gebieten
      in die Zählung aufgenommen wurden [@cc2025-cycling-table]. Nach der Methode
      von Clean Cities liegt unser Verhältnis bei 22,7 %, +3 % gegenüber der korrigierten
      Zahl, und die Straßennetze stimmen überein [#recon].
    src: 75c96a2289bc
