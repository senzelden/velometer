city_id: bratislava
title: "Bratislava: a dip, then a steady climb"
dek: >-
  The headline rose from 43.5 in 2018 to 58.7 in October 2026, after a fall in 2020 that was a
  retagging clean-up, not lost paths.
sections:
  - heading: Since 2018
    paragraphs:
      - >-
        Bratislava's mapped A+B went from 124 km in 2018 to 172 km in October 2026, and its
        headline, mapped A+B km per 100 km of main roads, from 43.5 to 58.7 [#ts-lau]. The
        path was not smooth. A+B fell from 132 km in 2019 to 113 km in 2020 and passed its 2019
        level again only in 2024. That fall was retagging during 2019: ways left the cycling tiers,
        the largest a long embankment path retagged as a footway, which was a cycleway again by
        late 2024 [#shift-lau-2020]. From 2024 tier A rose fastest, from 63 to 90 km.
      - >-
        Painted lanes (D) more than tripled on the map, from 17 to 55 km per side. Since 2024 part
        of that is retagging of shared lanes into proper lanes, alongside lanes on roads that had
        no cycleway tag [#recon-lanes]. The activity flag on the current point is a pedestrian
        mapping campaign of sidewalks and crossings; A+B moved normally [#expl-lau-current].
      - >-
        The functional urban area grew faster than the city, A+B from 284 to 443 km. Its 2022 jump
        is mostly newly mapped cycleways; the city's share of it was 15.5 km [#ts-fua]
        [#expl-fua-2022].
  - heading: Why the figures differ
    role: figures
    paragraphs:
      - >-
        Clean Cities 2025 and our figures roughly agree: it reports 186 km of protected
        infrastructure and 12% of the road network [@cc2025-report], against our 172 km and 13.2%
        [#recon]. QECIO measured the whole Bratislava region, more than five times the city's area,
        so its km are not the city's [#recon-qecio]. The city reports km added by type, km of
        <i lang="sk">ochranných pruhov</i> (advisory lanes) among them, and a total of its own
        without a stated length basis [@bratislava-city-infra-2025]; the local cycling NGO counted a
        new path on both sides of the road, as we do [@bratislava-cyklokoalicia-2025].
