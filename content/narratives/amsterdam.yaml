city_id: amsterdam
title: "Amsterdam: a full map that barely moves"
dek: >-
  The headline went from 205.6 in 2018 to 203.0 in October 2026; the one visible shift, from
  tracks to shared paths in 2025, was a retag.
sections:
  - heading: From 2018 to now
    paragraphs:
      - >-
        Amsterdam's map is dense and changes little. In the city proper (LAU) the headline (mapped
        A+B km per 100 km of main roads) was 205.6 in 2018 and 203.0 in October 2026, and mapped A+B
        stayed between 852 and 867 km throughout [#ts-amsterdam].
      - >-
        What moved is the split inside it. Between the 2024 and 2025 points separated tracks
        (tier A) fell from 704 to 660 km and shared paths (tier B) rose from 160 to 207 km, with
        A+B flat. That is tag drift: in September 2024 hundreds of cycle paths that carry their
        footway on the same line lost `segregated=yes`, mostly in one contributor's edits, so
        the classifier now reads them as shared with pedestrians [#shift-amsterdam-2025].
        Retagging is not a change on the street. Painted lanes (tier D, 76 → 90 km) and cycle
        streets (tier E, 0.2 → 9.0 km) grew slowly.
      - >-
        The functional urban area (FUA) rose slowly, 134.1 → 138.6. Its one flagged
        year, 2022, was contraflow retagging that touched painted lanes only
        [#ts-amsterdam-fua-2022].
  - heading: Why the figures differ
    role: figures
    paragraphs:
      - >-
        Clean Cities counts 919 km of protected infrastructure [@cc2025-report]; our A+B is 862 km
        per side (−6%). We found no published city total, but the city's own definition of a
        fietspad, quoted below, matches that scope [@amsterdam-maps-fietsnetten]. The gap is in the
        road network: Clean Cities divides by 2,700 km, we by 2,041 km (−24%), so its ratio is 34%
        against our 42.2% [#recon-amsterdam-cc-ratio]. Which roads its network includes, and whether
        the city or OpenStreetMap supplied the data, is not stated. Their data date from early 2025,
        ours from October 2026. QECIO reports Groot-Amsterdam, a region larger than the city
        [#recon-amsterdam-qecio-main].
