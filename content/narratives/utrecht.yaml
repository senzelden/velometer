city_id: utrecht
title: "Utrecht: small gains on a dense map"
dek: >-
  The headline rose from 179.7 in 2018 to 193.6 in October 2026, partly because fewer main-road
  km were mapped; inside A+B, km drifted from tracks to shared paths.
sections:
  - heading: From 2018 to now
    paragraphs:
      - >-
        Utrecht's headline (mapped A+B km per 100 km of main roads) rose from 179.7 in 2018 to 193.6
        in October 2026; mapped A+B rose more modestly, from 341 to 360 km [#ts-utrecht]. The
        rest is the denominator: mapped main roads in the city fell slightly, from 190 to 186 km.
      - >-
        Inside A+B the split shifted. Separated tracks (tier A) went from 336 to 317 km, shared
        paths (tier B) from 5.0 to 43.6 km. Cycle streets (tier E) rose from 10 to 27 km and
        painted lanes (tier D) moved from 51 to 48 km [#ts-utrecht].
      - >-
        No year in the city series is flagged, and the city's own move from A to B has not been
        traced way by way. The functional urban area (FUA), where A+B rose from 1,216 to
        1,269 km, shows how such shifts arise: during 2019 mappers moved cycle streets from a
        non-standard tag to `cyclestreet=yes`, which shifted km into tier E, outside the
        headline, and cycleways that gained `foot=yes` moved from A to B
        [#ts-utrecht-fua-2020]. Retagging of this kind is not new infrastructure.
  - heading: Why the figures differ
    role: figures
    paragraphs:
      - >-
        No current official total was found for the city. A historical-society article gives older
        figures that keep cycle paths apart from painted lanes, quoted below
        [@utrecht-oud-utrecht-fietsstad]; that is roughly our tiers A and B against tier D, but the
        date is 2012 and the source is secondary. The city grits a main cycle path network
        [@utrecht-actieplan-fietst-2015], a maintenance scope, not a total. Area: QECIO reports the
        whole province, with 2,324 km of main roads against our 423 km for the city
        [#recon-utrecht-qecio-main], so it is no benchmark. BikeNetKit, also from OpenStreetMap,
        counts 420 km against our 387 km of tiers A, B and E (−8%) [@bikenetkit-zenodo]; which
        boundary it uses is not stated by the source.
