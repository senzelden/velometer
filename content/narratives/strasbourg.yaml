city_id: strasbourg
title: "Strasbourg: high from the start, reshuffled between A and B"
dek: >-
  Mapped A+B rose from 184 to 241 km between 2018 and October 2026; already in 2018 the headline
  was 123.2 mapped A+B km per 100 km of main roads.
sections:
  - heading: Since 2018
    paragraphs:
      - >-
        Strasbourg starts far ahead of the other French cities: in 2018 the map already held more
        A+B km than main-road km. A+B grew slowly and steadily, from 184 to 241 km, and the
        headline (mapped A+B km per 100 km of main roads) from 123.2 to 136.1. The headline dipped
        from 132.6 to 116.9 in 2021 although A+B rose, because the main-road length it divides
        by went from 150 to 176 mapped km that year. The year was not flagged, so no cause is
        recorded.
      - >-
        The larger change is inside A+B. Tier B, shared foot and cycle paths, rose from 28 to 69
        km while tier A stayed between 156 and 172 km. Part of that is tagging, not new paths: in
        spring 2024 mappers swept the city's cycle paths, adding segregation and designation tags
        and turning some cycleways into shared paths [#ts-strasbourg-2025]. Tier A fell and tier
        B rose that year while their sum moved normally. A 2022 footway campaign shows in the
        activity flags but not in the tiers [#ts-strasbourg-2023]. Mapped painted lanes fell
        from 58 to 45 km.
      - >-
        The wider urban area (FUA) shows the same shift: tier B grew from 201 to 426 km and now
        nearly equals tier A at 428 km.
  - heading: Why the figures differ
    role: figures
    paragraphs:
      - >-
        The official network figure [@strasbourg-a-velo] is more than twice our A+B. The page
        does not say whether it covers the commune or the whole Eurométropole, which facilities
        it counts, how length is measured or at what date. The city's open data are drawn on its
        own road centreline network in the national BNAC schema [@strasbourg-opendata-bnac], not
        taken from OSM, so they are a measure independent of ours. Strasbourg is not in the Clean
        Cities ranking. QECIO reports the Bas-Rhin département, which is why its main-road km sit
        −95.3% away from ours; measured on that area, the main roads agree
        [#rc-strasbourg-qecio_main_km].
