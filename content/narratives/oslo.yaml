city_id: oslo
title: "Oslo: a retag in 2020, then steady mapping"
dek: >-
  The headline rose from 53.1 to 70.8 between 2018 and October 2026; its one large step came
  from footways retagged as combined foot and cycle paths.
sections:
  - heading: From 2018 to now
    paragraphs:
      - >-
        In Oslo kommune (LAU) mapped A+B rose from 261 km in 2018 to 341 km in October 2026, and the
        headline (mapped A+B km per 100 km of main roads) from 53.1 to 70.8 [#ts-oslo]. The one
        flagged step is the 2021 point, when A+B went from 264 to 298 km. Most of it is tag drift:
        during 2020 existing footways were retagged as combined foot and cycle paths, the way
        Norway's standard <i lang="nb">gang- og sykkelvei</i> (shared walking and cycling path) is
        mapped [@oslo-sykkelkart], and newly drawn ways added the rest [#ts-oslo-2021]. Retagging is
        not new infrastructure.
      - >-
        Shared paths (tier B) dominate throughout, 222 → 282 km, against 38 → 60 km of separated
        tracks (tier A). Painted lanes (tier D) rose from 111 to 161 km, most of it at the 2023
        point (128 → 160 km). An evaluation commissioned by the city describes the network as mainly
        <i lang="nb">markerte sykkelfelt</i> (marked cycle lanes) [@oslo-ey-evaluering-2024]; in the
        mapped data shared paths are the largest group.
      - >-
        The functional urban area (FUA) grew more, A+B 1,546 → 2,071 km, with its own flagged
        step in 2021: combined foot and cycle paths newly drawn in the surrounding
        municipalities, plus retagging [#ts-oslo-fua-2021]. Tier A there fell from 268 to 161 km,
        in part because cycleways gained foot tags and moved to B.
  - heading: Why the figures differ
    role: figures
    paragraphs:
      - >-
        Clean Cities counts 307 km of protected infrastructure for Oslo [@cc2025-report]; our A+B is
        341 km per side, 11% above [#recon-oslo-cc-ratio]. Its data date from early 2025, ours from
        October 2026, and whether the city or OpenStreetMap supplied it is not stated. The city's
        own figure for its <i lang="nb">sykkelveinett</i> (cycle network), quoted below, includes
        <i lang="nb">gang- og sykkelveier, sykkelfelt og sykkelveier</i> (shared walking and cycling
        paths, painted cycle lanes and cycle tracks) [@oslo-sykkelkart], so its scope is our tiers
        A, B and D; its length basis and method are not stated by the source. QECIO's region here is
        the city itself, and its total of 413 km of cycle infrastructure matches our 414 km counted
        on its half-length rule [#recon-oslo-qecio-tracks].
