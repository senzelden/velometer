city_id: stockholm
title: "Stockholm: a steady total, with tracks overtaking shared paths"
dek: >-
  The headline moved only from 257.9 to 261.0 between 2018 and October 2026, while years of
  small retags moved km from shared paths to separated tracks.
sections:
  - heading: From 2018 to now
    paragraphs:
      - >-
        Stockholm stays near the top of the 21 cities throughout. In the city proper (LAU)
        mapped A+B went from 944 km in 2018 to 991 km in October 2026 (+5%), and the headline
        from 257.9 to 261.0 mapped A+B km per 100 km of main roads, never below 249.7 or above 262.5
        [#ts-stockholm]. No year is flagged.
      - >-
        Inside that steady total the split moved. Separated tracks (tier A) rose from 315 to
        415 km, while shared foot and cycle paths (tier B) fell from 629 to 577 km. This is
        gradual tag drift alongside newly drawn ways, not one sweep [#shift-stockholm]: shared
        paths gained `segregated=yes` and moved to A, other cycleways gained foot tags and moved
        to B, and some cycleways became footways and left the tiers. The largest steps fell
        between 2020 and 2021 and between 2022 and 2023, each spread over many contributors.
        Retagging is not new infrastructure. Painted lanes (tier D) stay small, 38 → 48 km.
      - >-
        The functional urban area (FUA) tells a growth story the city does not: A+B rose from
        3,272 to 3,906 km (+19%), most of it in tier B (2,022 → 2,635 km), so most of the newly
        mapped km lie outside the city [#ts-stockholm].
  - heading: Why the figures differ
    role: figures
    paragraphs:
      - >-
        The city's own network figure, quoted below, counts <i lang="sv">egna cykelbanor,
        kombinerade gång- och cykelbanor och cykelfält</i> (separate cycle tracks, combined walking
        and cycling paths and painted cycle lanes) together [@stockholm-cykelvagar]. Scope: that is
        our tiers A, B and D, 991 km of A+B plus 48 km of lanes. Its length basis, date and method
        are not stated by the source; ours are per road side, October 2026 and OpenStreetMap. Area:
        QECIO reports <i lang="sv">Stockholms län</i> (Stockholm County)
        [@lansstyrelsen-stockholm-om-lanet], far larger than the city, with 4,946 km of main roads
        against our 667 km [#recon-stockholm-qecio-main], so its figures are no check on the city.
        BikeNetKit, also based on OpenStreetMap, counts 1,102 km against our 995 km of tiers A, B
        and E (−10%) [@bikenetkit-zenodo].
