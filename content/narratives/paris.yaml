city_id: paris
title: "Paris: two fast years, then a steady climb"
dek: >-
  Mapped A+B rose from 209 to 357 km between 2018 and October 2026, and the headline
  from 34.8 to 63.1 mapped A+B km per 100 km of main roads.
sections:
  - heading: Since 2018
    paragraphs:
      - >-
        Most of Paris's rise falls in two years. Between 2019 and 2021 mapped A+B went from 224 to
        306 km, and the headline (mapped A+B km per 100 km of main roads) from 37.5 to 51.9. The
        2020 step is cycleways that mappers drew during 2019, while the city's 2015–2020 Plan Vélo
        ran; no official figure for what was finished that year is cited [#ts-paris-2020]. In the
        same years contraflow lanes were retagged, which moved a diagnostic count, not the tiers.
        The 2021 step is the temporary coronapistes of 2020 as mappers recorded them
        [#ts-paris-2021]; the city's 2021–2026 plan set out to make them permanent.
      - >-
        After a flat 2022 and 2023, the 2024 and 2025 points are flagged for activity, which was
        mostly footway mapping, tens of thousands of new footways in 2023 alone; footways carry no
        tier [#ts-paris-2024]. Cycling A+B kept its usual pace, to 346 km in 2025 and 357 km now.
        Separated tracks (tier A, 181 to 332 km) carry almost all of the gain; painted lanes (tier
        D) went from 127 to 147 km.
      - >-
        The wider urban area (FUA) grew more evenly, from 2,326 to 3,726 mapped km of A+B. Its one
        flagged year, 2019, was ordinary catch-up mapping by many hands, not a campaign or an
        import [#ts-paris-fua-2019].
  - heading: Why the figures differ
    role: figures
    paragraphs:
      - >-
        The city's yearly cycle-route length counts much more than our A+B: lanes, bus lanes open to
        bikes, pedestrian streets and contraflow cycling as well as tracks
        [@paris-opendata-lineaire-km]. It is dated to the start of each year; we read the October
        2026 map. It is also not independent of ours: the city extracts it from OSM, the map we
        read, so it cannot confirm or refute our km. Clean Cities' 822 km of protected
        infrastructure (48% of the road network) exceeds everything we map in Paris across all tiers
        [#rc-paris-cc_km]; Clean Cities took most cities' figures from the cities themselves
        [@cc2025-report]. QECIO, also measuring OSM, lands within +9.3% of our tracks.
