city_id: berlin
title: "Berlin: one re-mapping campaign, then a slow climb"
dek: >-
  Mapped A+B km per 100 km of main roads went from 113.7 in 2018 to 109.1 in October 2026: one
  step down in a 2022 re-mapping campaign, a slow climb since.
sections:
  - heading: Since 2018
    paragraphs:
      - >-
        Berlin's headline, mapped A+B km per 100 km of main roads, was 113.7 in 2018 and
        109.1 in October 2026; mapped A+B went from 1,640 to 1,551 km [#ts-lau]. The fall is one
        step, not a trend. The headline peaked at 117.0 in 2021 and stood at 104.3 in January
        2022, after mappers redrew road-side tracks as separate ways and retagged many shared paths
        as footways where cycling is only allowed. That was a mapping campaign, not lost
        infrastructure [#expl-lau-2022]. Since then the headline has risen in every year but 2024.
      - >-
        Outside A+B the map gained too. Painted lanes (tier D) went from 403 to 461 km, cycle
        streets and bus lanes (E) from 53 to 117 km, and lanes mapped with a physical buffer (C),
        absent in 2018, now come to 29 km [#ts-lau]. The functional urban area fell with the same
        campaign, which reached into Brandenburg, from 71.5 in 2021 to 64.7 in 2022, and is at
        64.5 now [#ts-fua] [#expl-fua-2022].
  - heading: The 12 Bezirke (districts)
    paragraphs:
      - >-
        The 12 Bezirke diverge [#bezirke]. Neukölln maps densest (164.3), Pankow thinnest (62.8).
        Since 2018 Mitte (75.2 to 90.7) and Tempelhof-Schöneberg (123.9 to 138.3) gained most;
        Spandau fell most (149.3 to 109.8), the largest part of it in 2022.
  - heading: Why the Senate's figures differ
    role: figures
    paragraphs:
      - >-
        The Senate's figures answer a different question [@berlin-fortschrittsbericht-2025]. Its
        21.2 km for 2025 are km of route that projects completed or improved, taken from a project
        database at year end. The 20.5 km was a preliminary figure the administration called
        possibly incomplete [@berlin-tagesspiegel-dpa-2025-12]; the 9.8 km covers the
        <i lang="de">Radvorrangnetz</i> (priority network) alone [@berlin-drs-19-25987], for which
        the progress report itself gives a smaller figure.
      - >-
        We count all mapped infrastructure per road side, whenever mappers record it. From 2023 to
        October 2026, 442 km of way-sides were newly mapped and 656 km redrawn, and A+B rose by 35.6
        km net [#change]. The report's <i lang="de">Vorrangnetz</i> inventory used OpenStreetMap
        too, but only within that network. Neither set confirms or refutes the other.
