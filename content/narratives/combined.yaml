city_id: combined
title: "21 cities on one map: a stable top, faster climbers below"
dek: >-
  Across the 21 cities, mapped A+B rose from 8,942 km in January 2018 to 10,400 km in October
  2026. The top of the table held its places; several cities that started low gained fastest.
sections:
  - heading: One yardstick for 21 cities
    step: all
    paragraphs:
      - >-
        Every figure here is mapped km in OpenStreetMap, measured the same way in each city proper
        (LAU) every January from 2018 and in October 2026 [#runset]. Tiers A (separated tracks) and
        B (shared foot and cycle paths) make up the headline, mapped A+B km per 100 km of main
        roads, counted per road side. A rise on the map can be new infrastructure, catch-up mapping
        or the same paths retagged, and the map alone rarely tells which.
  - heading: The leaders
    step: leaders
    paragraphs:
      - >-
        Helsinki (262.3), Stockholm (261.0) and Copenhagen (237.9) lead, followed by Amsterdam
        (203.0) and Utrecht (193.6) [#runset]. Each of them maps more km of A+B than of main
        roads. The top seven, down to Strasbourg and Berlin, hold the same ranks as in 2018.
        Helsinki leads on shared paths: 943 of its 1,279 mapped A+B km are tier B, a kind of
        path Clean Cities also counts as protected. Its headline fell, from 276.2 to 262.3, while
        its mapped A+B barely moved; the cause is in the main roads it divides by.
  - heading: At the other end
    step: tail
    paragraphs:
      - >-
        Budapest (22.3) and Prague (29.6) trail, behind Bordeaux (40.3) and Madrid (42.5)
        [#runset]. A low value
        can mean little infrastructure,
        little mapping, or infrastructure in tiers the headline leaves out: Prague's painted
        lanes rose from 56 to 190 km and Budapest's from 72 to 161 km, all in tier D. The middle
        of the table moved more: Wrocław passed Vienna for eighth, Kraków rose from 14th to 12th,
        Paris from 16th to 14th and Lyon from 19th to 17th, while Oslo slipped from 11th to 13th
        and Madrid from 15th to 18th.
  - heading: Indexed, who grew fastest on the map
    step: growth
    paragraphs:
      - >-
        Indexed to its own 2018 value, Ljubljana's mapped A+B reaches 192, Kraków's 184, Lyon's 175
        and Paris's 171 [#runset]. In km, Warsaw's mapped A+B rose most, by 235 km (from 528 to
        763), ahead of Paris (+148), Wrocław (+137), Kraków (+135) and Ljubljana (+117). The densely
        mapped northern and Dutch cities barely moved: Helsinki stands at 100, Amsterdam 101,
        Stockholm 105 and Utrecht 106. Two cities map less A+B now than in 2018: Helsinki only just,
        1,279 km against 1,283 km, and Berlin clearly, at 95, from one re-mapping step, not a trend.
  - heading: Not every jump is new infrastructure
    step: jumps
    paragraphs:
      - >-
        Seven city years carry a km-jump flag, and in most of them the step is a change in how
        existing paths were mapped. Berlin's 2022 drop, from 1,677 to 1,494 km, is mappers redrawing
        road-side tracks as separate ways and retagging shared paths as footways
        [#expl-berlin-2022]. Ljubljana's 2021 step, 138 to 194 km, was a campaign that drew
        sidepaths as separate ways [#expl-ljubljana-2021]. Most of Oslo's 2021 step, 264 to 298 km,
        is footways retagged as combined foot and cycle paths [#expl-oslo-2021], and most of the 31
        km of mapped A+B Prague gained in 2020 is park and riverside footways retagged as cycleways
        [#expl-prague-2020]. About half of Kraków's 2024 step of 33 km is retagging
        [#expl-krakow-2024]. Paris is different: its rise from 224 to 306 km between 2019 and 2021
        coincides with the Plan Vélo and the 2020 coronapistes, but no official build figure is
        cited, so these remain mapped km only [#expl-paris-2020] [#expl-paris-2021].
      - >-
        Some jumps sit in the yardstick and carry no flag. In Warsaw the mapped main roads fell
        from 1,039 to 946 km between the 2024 and 2025 points, when expressways were retagged as
        motorways, which the headline does not count; the headline rose from 67.9 to 77.8 while
        A+B rose 4% [#shift-warsaw-2025]. In Helsinki residential streets reclassified as
        tertiary roads lifted the main roads from 467 to 484 km, and the headline fell from
        274.4 to 264.7 with A+B flat [#shift-helsinki-2025]. Both describe the road map, not
        cycling infrastructure.
  - heading: Inside one city, Berlin's 12 Bezirke (districts)
    step: bezirke
    paragraphs:
      - >-
        Berlin maps the most A+B of any city, 1,551 km, at a headline of 109.1, seventh [#runset].
        Inside the city the spread is wide: Neukölln maps 164.3 and Pankow 62.8 [#bezirke]. Mitte
        (75.2 to 90.7) and Tempelhof-Schöneberg (123.9 to 138.3) gained most since 2018, while
        Spandau fell from 149.3 to 109.8, most of it in 2022. The Senate's figures answer another
        question: its 21.2 km for 2025 are km of route that projects completed or improved
        [@berlin-fortschrittsbericht-2025]. We count all mapped infrastructure per road side: from
        2023 to October 2026 the map gained 442 km of newly mapped way-sides, redrew 656 km, and A+B
        rose 35.6 km net [#change].
  - heading: Against published figures
    role: figures
    paragraphs:
      - >-
        Published figures differ from ours along six dimensions, set out on the differences
        page. Scope: Clean Cities 2025, which covers 17 cities here,
        counts protected infrastructure only [@cc2025-annexes], and its Vienna figure rose from
        384 to 625.1 km in July 2025, once roads with restricted motor access in traffic-calmed
        areas were counted [@cc2025-cycling-table]. Length: Clean Cities defines
        the road network it divides by, each road once whatever its lanes or directions, and
        gives no rule for how cycling km are measured. Berlin's 925 km sits by our centreline
        basis, 913.5 km, not our 1,550.7 km per side [#recon-berlin-cc-km]; Ljubljana's 251 km
        sits by our per-side 245 km [#recon-ljubljana-cc-ratio].
      - >-
        Date: their data date from early 2025, ours from October 2026. Area: QECIO reports NUTS3
        regions from data of January 2024 [@qecio-metadata]. Where the region is the city the main
        roads agree closely: 2,153 against 2,150 km for Berlin [#recon-berlin]; elsewhere it covers
        a <i lang="sv">län</i> (county) [@scb-lan-och-kommuner], as Stockholm's 4,946 km of main
        roads against our 667 km show [#recon-stockholm-qecio-main]. Method: Clean Cities took most
        figures from the cities themselves [@cc2025-report], and its 822 km for Paris exceeds
        everything we map there across all tiers [#recon-paris-cc-km].
