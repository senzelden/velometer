city_id: vienna
title: "Vienna: a late, steady rise"
dek: >-
  Mapped A+B km per 100 km of main roads rose from 74.6 in 2018 to 89.1 in October 2026, most of
  it since 2024.
sections:
  - heading: Since 2018
    paragraphs:
      - >-
        Vienna's headline, mapped A+B km per 100 km of main roads, went from 74.6 in 2018
        to 89.1 in October 2026, and mapped A+B from 558 to 666 km [#ts-lau]. Until 2024 it stayed
        between 73.8 and 79.7; since then it has risen every year, to 83.0 in 2025 and 87.3 in
        2026. Mapped separated tracks (tier A) carry most of the gain, from 239 to 314 km. Shared
        foot and cycle paths (B) rose from 320 to 352 km, cycle streets and bus lanes (E) from 18
        to 41 km.
      - >-
        The one flagged year, 2025, is tag drift, not new infrastructure: mappers replaced the old
        contraflow tag `cycleway=opposite_lane` on one-way streets [#expl-lau-2025]. That touched
        painted lanes (D) only, which have stayed between 252 and 285 km since 2018 [#ts-lau].
      - >-
        The functional urban area rose more evenly, from 18.1 to 22.8, with a different mix: there
        tier A shrank from 603 to 512 km while tier B grew from 683 to 1,105 km [#ts-fua].
  - heading: Why the city's figures differ
    role: figures
    paragraphs:
      - >-
        Vienna's own network total counts every facility type on both sides of a street, including
        <i lang="de">Radfahren gegen die Einbahn</i> (contraflow cycling),
        <i lang="de">Verkehrsberuhigter Bereich</i> (traffic-calmed area) and
        <i lang="de">Radroute</i> (cycle route) [@vienna-radverkehrsnetz-fakten], so it covers far
        more than A+B. The 2025 tally of 20.4 km counts projects in the
        <i lang="de">Hauptradverkehrsnetz</i> (main cycle network) that started that year, not
        finished ones [@vienna-radwegeausbau-bilanz-2025]. Clean Cities first printed 14%; in July
        2025 it raised Vienna to 22.0% after roads with restricted motor access in traffic-calmed
        areas were included in the count [@cc2025-cycling-table]. On Clean Cities' method our ratio
        is 22.7%, +3% against the corrected figure, and the road networks agree [#recon].
