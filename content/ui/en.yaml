# English UI strings: every word a page shows that is not content (content/) or config (config/).
# Flat keys; a plural is {one, other}, chosen by `count=`. Keys mirror de.yaml (i18n.check).
# Families: site.* nav.* crumbs.* (layout) · page.<page>.* (one page's text) · table.* (column
# heads) · note.* (notes in tables) · cite.* (citations; cite.title.* the figure titles) · unit.*
# · fmt.* · city.keynum.* · counts.* · compare.* · story.* · time.* · sources.* · search.* ·
# org.* · plan.* · regions.* · permalink.* · subarea.*. Built from ids (i18n.DYNAMIC_FAMILIES): country.* tier.* road_class.*
# city.tab.* compare.group.* compare.metric.* compare.view.* org.kind.* plan.doc_type.*
# plan.status.* change.category.* js.tier.* figure.scope.* figure.basis.* plan.unit.* · preset.*
# js.* (at the end): the scripts' strings, the only keys a page sends to the browser (base.html
# #ui-strings, static/js/strings.js); i18n.js_strings adds js.month.short.* and js.month.long.*.
