  - id: figures
    text: 'Carrils bici actuals: 271,1 km Altres vies ciclables segures (dades 2024): 801 km de carrers
      30 i 147 km de prioritat invertida'
    gloss_en: 'Current bike lanes: 271.1 km. Other safe cycle routes (2024 data): 801 km of 30 km/h streets
      and 147 km of reversed-priority streets.'
    gloss_de: "Heutige Radwege: 271,1 km. Weitere sichere Radverkehrsanlagen (Daten von 2024): 801 km Tempo-30-Straßen und 147 km Straßen mit umgekehrtem Vorrang"
    locator: box 'Els carrils bicis de Barcelona, en xifres'
  - id: colau
    text: l'etapa de BComú al capdavant del consistori -amb el PSC com a soci durant gran part de l'acció
      de govern- va deixar fins a 143 km nous dedicats a la bicicleta. Al mandat de Trias (CiU) van desenvolupar-se'n
      26,4.
    gloss_en: the BComú period at the head of the council, with the PSC as partner for much of it, left
      up to 143 new km dedicated to cycling. Under Trias (CiU) 26.4 were built.
    gloss_de: "Die Zeit von BComú an der Spitze des Rathauses, mit der PSC als Partner während eines Großteils der Regierungszeit, hinterließ bis zu 143 km neue Strecken für das Fahrrad. In der Amtszeit von Trias (CiU) waren es 26,4."
