- id: madrid-opendata-infraestructura-ciclista
  publisher: Ayuntamiento de Madrid, Portal de datos abiertos
  title: Bici. Infraestructura ciclista, dataset description
  url: https://datos.madrid.es/dataset/205107-0-vias-ciclistas
  accessed: '2026-10-06'
  language: es
  kind: official
  archive_url: https://web.archive.org/web/20260418073719/https://datos.madrid.es/dataset/205107-0-vias-ciclistas
  excerpts:
  - id: scope
    text: El trazado y definición de las distintas tipologías de infraestructura ciclista de la ciudad,
      tanto de uso exclusivo como preferente así como aquellas vías o calles acondicionadas para el uso
      ciclista en secciones compartidas.
    gloss_en: The layout and definition of the city's different types of cycling infrastructure, both
      exclusive and preferential use, as well as roads or streets adapted for cycling in shared sections.
    locator: dataset description, first bullet
  - id: senda-ciclable
    text: 'Senda ciclable: Vías para peatones y ciclos que discurren por espacios abiertos, parques, jardines
      o bosques con independencia del trazado de las vías motorizadas.'
    gloss_en: 'Senda ciclable: ways for pedestrians and cycles running through open spaces, parks, gardens
      or woods independently of the motor road layout.'
    locator: dataset description, 'Vía uso exclusivo para bicicleta'
  - id: ciclocarril
    text: 'Ciclocarril: Carril especialmente acondicionado para el uso de la bicicleta en donde la circulación
      es compartida con el resto de vehículos, el ciclista no disfruta de un uso exclusivo o preferente.'
    gloss_en: 'Ciclocarril: a lane specially adapted for cycling where traffic is shared with other vehicles;
      the cyclist has no exclusive or preferential use.'
    locator: dataset description, 'Vía uso compartido para el uso ciclista'
- id: madrid-ultimahora-1167km
  publisher: Ultima Hora
  title: La red ciclista de la capital llega a los 1.167 kilómetros y da un estirón de un 11,4% más desde
    que Almeida es alcalde (figures as reported from the city's Área de Urbanismo, Medio Ambiente y Movilidad)
  url: https://www.ultimahora.es/noticias/comunidades/2026/03/31/2600335/red-ciclista-capital-llega-1167-kilometros-estiron-mas-desde-almeida-alcalde.html
  published: '2026-03-31'
  accessed: '2026-10-06'
  language: es
  kind: press
  archive_url: https://web.archive.org/web/20260401022143/https://www.ultimahora.es/noticias/comunidades/2026/03/31/2600335/red-ciclista-capital-llega-1167-kilometros-estiron-mas-desde-almeida-alcalde.html
  excerpts:
  - id: network-1167
    text: La red ciclista de la capital llega a los 1.167 kilómetros sumando un 11,4% más desde que José
      Luis Martínez-Almeida llegó a la Alcaldía en 2019, han informado desde el área de Urbanismo, Medio
      Ambiente y Movilidad, con Borja Carabante al frente.
    gloss_en: The capital's cycle network reaches 1,167 kilometres, 11.4% more than when José Luis Martínez-Almeida
      became mayor in 2019, the Urban Planning, Environment and Mobility department headed by Borja Carabante
      reported.
    locator: article body, paragraph 1
  - id: breakdown
    text: También ha dado un estirón el carril bici segregado con 764,7 kilómetros, esto es, un 9,3% más
      que en 2019, cuando eran 699 los kilómetros.
    gloss_en: Segregated cycle lanes have also grown, to 764.7 kilometres, 9.3% more than in 2019, when
      there were 699 kilometres.
    locator: article body, paragraph 2
  - id: ciclocarriles
    text: Algo similar pasa con los kilómetros de los ciclocarriles, hasta 402,4 kilómetros, lo que supone
      un incremento del 15,9% respecto a 2019, cuando eran 347 kilómetros.
    gloss_en: Something similar has happened with ciclocarriles, up to 402.4 kilometres, a 15.9% increase
      on 2019, when there were 347 kilometres.
    locator: article body, paragraph 3
- id: madrid-enbici-300km-segregadas
  publisher: En bici por Madrid
  title: Desaparecen 300 km de vías ciclistas segregadas de Madrid por un error recurrente de 'El País'
  url: https://www.enbicipormadrid.es/2020/09/desaparecen-300-km-de-vias-ciclistas.html
  published: '2020-09-03'
  accessed: '2026-10-06'
  language: es
  kind: ngo
  archive_url: https://web.archive.org/web/20260314090312/https://www.enbicipormadrid.es/2020/09/desaparecen-300-km-de-vias-ciclistas.html
  excerpts:
  - id: segregated-347
    text: Estos 347 km no incluyen otros 345 km de ciclocarriles (ya que no se trata de vías segregadas
      del tráfico, sino compartidas). Si se cuentan ambos, suman 692 km.
    gloss_en: These 347 km do not include another 345 km of ciclocarriles (since they are shared with
      traffic, not segregated from it). Counting both gives 692 km.
    locator: section 'Madrid tiene oficialmente 347 km de vías ciclistas segregadas'
  - id: carril-bici-only
    text: Sólo los clasificados como "carril-bici" (En calzada junto a otros carriles de circulación,
      con o sin separación) se están teniendo en cuenta. Esta omisión está generando comparativas irreales
      con otras ciudades en las que sí se cuentan todas las categorías de vías ciclistas segregadas
    gloss_en: Only those classed as 'carril-bici' (on the carriageway next to other traffic lanes, with
      or without separation) are being counted. This omission produces unrealistic comparisons with other
      cities where all categories of segregated cycle ways are counted.
    locator: opening paragraphs
- id: madrid-enbici-red-continua-247km
  publisher: En bici por Madrid
  title: Madrid tiene una red continua de 247 km de carriles-bici que da servicio a 1 millón de personas
  url: https://www.enbicipormadrid.es/2022/02/madrid-tiene-una-red-continua-de-247-km.html
  accessed: '2026-10-06'
  language: es
  kind: ngo
  archive_url: https://web.archive.org/web/20260913024557/https://www.enbicipormadrid.es/2022/02/madrid-tiene-una-red-continua-de-247-km.html
  excerpts:
  - id: connected-247
    text: Lo que aparece en amarillo son 247 km de vías ciclistas conectadas entre sí (de las 360km de
      las que dispone Madrid). No se trata de ciclocarriles, sino de vías ciclistas sin tráfico a motor
      aunque en algunos casos también tienen presencia peatonal.
    gloss_en: What appears in yellow are 247 km of interconnected cycle ways (of the 360 km Madrid has).
      These are not ciclocarriles but cycle ways without motor traffic, though some also carry pedestrians.
    locator: article body, below the map
- id: madrid-eldiario-carriles-2019
  publisher: eldiario.es
  title: Los ciclistas crecieron un 83% en los carriles bici que se plantea desmontar el Ayuntamiento
    de Madrid
  url: https://www.eldiario.es/madrid/carriles-ayuntamiento-plantea-desmantelar-crecieron_1_1284081.html
  published: '2019-11-01'
  accessed: '2026-10-06'
  language: es
  kind: press
  archive_url: https://web.archive.org/web/20260309055352/https://www.eldiario.es/madrid/carriles-ayuntamiento-plantea-desmantelar-crecieron_1_1284081.html
  excerpts:
  - id: ciclocarriles
    text: Los ciclocarriles son carriles mixtos para coches y bicicletas con un límite de velocidad de
      30 kilómetros por hora. Es un modelo muy poco común en las ciudades europeas con más cultura ciclista
      porque implica dar más espacio a los vehículos motorizados.
    gloss_en: Ciclocarriles are mixed lanes for cars and bicycles with a 30 km/h speed limit. The model
      is very rare in European cities with a stronger cycling culture because it gives more space to motor
      vehicles.
    locator: article body
- id: barcelona-premsa-42km-2025
  publisher: Ajuntament de Barcelona, Servei de Premsa
  title: Barcelona intervé en més de 42 km de carrils bici per incrementar la connectivitat entre els
    barris i millorar la infraestructura ciclista
  url: https://ajuntament.barcelona.cat/premsa/2025/02/11/barcelona-interve-en-mes-de-42-km-de-carrils-bici-per-incrementar-la-connectivitat-entre-els-barris-i-millorar-la-infraestructura-ciclista/
  published: '2025-02-11'
  accessed: '2026-10-06'
  language: ca
  kind: official
  excerpts:
  - id: network-268
    text: Aquestes actuacions se sumaran als 15,4 km de nous carrils bici ja construïts durant aquest
      mandat i als 5,24 km millorats, en el marc de l’estratègia de millora de la connectivitat i de la
      infraestructura. Actualment, la xarxa de carrils bici de Barcelona és de 268 km.
    gloss_en: These works will add to the 15.4 km of new bike lanes already built this term and the 5.24
      km improved, under the strategy to improve connectivity and infrastructure. Barcelona's bike lane
      network is currently 268 km.
    locator: press release body
  - id: plan
    text: L’Ajuntament de Barcelona intervindrà en els pròxims anys en 21.770 metres de carrils bici per
      millorar la connectivitat i infraestructura ciclistes, que se sumaran als 20.640 metres executats
      fins ara en aquest mandat, fent un total de 42.410 metres de carrils bici.
    gloss_en: Barcelona City Council will work on 21,770 metres of bike lanes in the coming years to improve
      cycling connectivity and infrastructure, adding to the 20,640 metres completed so far this term,
      for a total of 42,410 metres.
    locator: press release, first paragraph
