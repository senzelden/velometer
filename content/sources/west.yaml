    gloss_en: The City (Ville) and the Eurométropole de Strasbourg (the metropolitan authority) are two
      separate institutions. They have the particularity of sharing a single administration and a common
      headquarters.
    gloss_de: "Die Stadt (Ville) und die Eurométropole de Strasbourg (der Metropolverband) sind zwei getrennte Institutionen. Sie haben die Besonderheit, eine einzige Verwaltung und einen gemeinsamen Sitz zu teilen."
    locator: intro text of the section Ville & Eurométropole
- id: bordeaux-plan-velo-2021-2026
  publisher: Bordeaux Métropole
  title: 3ème Plan vélo métropolitain 2021-2026
  url: https://www.bordeaux-metropole.fr/sites/MET-BXMETRO-DRUPAL/files/2023-08/Plan_velo2021.pdf
  accessed: '2026-10-06'
  language: fr
  kind: official
  archive_url: https://web.archive.org/web/20251008040927/https://www.bordeaux-metropole.fr/sites/MET-BXMETRO-DRUPAL/files/2023-08/Plan_velo2021.pdf
  excerpts:
  - id: network-2021
    text: 'En juin 2021, la Métropole était dotée de 1 506 km d’aménagements cyclables pour 1 022 km en
      2015, soit une augmentation de 47% (+100% en 10 ans) : 348 km de pistes cyclables et voies vertes
      367 km de bandes cyclables et couloirs bus 624 km de voies de circulation apaisée 167 km de voies
      piétonnes'
    gloss_en: 'In June 2021 the Métropole had 1,506 km of cycle facilities against 1,022 km in 2015, a
      47% increase (+100% in 10 years): 348 km of cycle tracks and greenways, 367 km of cycle lanes and
      bus lanes, 624 km of traffic-calmed streets, 167 km of pedestrian streets.'
    gloss_de: "Im Juni 2021 verfügte die Métropole über 1.506 km Radverkehrsanlagen, gegenüber 1.022 km im Jahr 2015, ein Zuwachs von 47 % (+100 % in zehn Jahren): 348 km Radwege und Grüne Wege, 367 km Radfahrstreifen und Busspuren, 624 km verkehrsberuhigte Straßen, 167 km Fußgängerstraßen"
    locator: PDF p. 8, action 1.1 'État des lieux'
- id: bordeaux-crc-plan-velo-2025
  publisher: Chambre régionale des comptes Nouvelle-Aquitaine
  title: Bordeaux Métropole – Plan vélo, rapport d’observations définitives, exercices 2019 et suivants,
    deliberated 5 August 2025 (copy published by the Ville de Mérignac)
  title_de: "Bordeaux Métropole – Plan vélo, rapport d’observations définitives, exercices 2019 et suivants, beschlossen am 5. August 2025 (Kopie, veröffentlicht von der Ville de Mérignac)"
  url: https://www.merignac.com/sites/default/files/2026-04/crc-bordeaux-metropole-plan-velo.pdf
  accessed: '2026-10-06'
  language: fr
  kind: official
  excerpts:
  - id: network-2024
    text: Les tableaux de suivi de Bordeaux Métropole montrent l’aménagement de 107 km supplémentaires
      d’itinéraires cyclables depuis l’adoption du plan vélo 2021-2026. À fin 2024, le réseau cyclable
      situé à l’intérieur du périmètre de Bordeaux Métropole s’élevait à 1 700 km.
    gloss_en: Bordeaux Métropole's monitoring tables show 107 km of additional cycle routes since the
      2021-2026 cycling plan was adopted. At the end of 2024 the cycle network within Bordeaux Métropole
      amounted to 1,700 km.
    gloss_de: "Die Monitoring-Tabellen von Bordeaux Métropole zeigen 107 km zusätzliche Radrouten seit der Annahme des Plan vélo 2021–2026. Ende 2024 umfasste das Radnetz innerhalb des Gebiets von Bordeaux Métropole 1.700 km."
    locator: p. 46 (PDF p. 47), §3.4.1
  - id: network-basis
    text: évolution du linéaire des voies cyclables tous types confondus (bandes, pistes, zones apaisées,
      couloirs « bus&vélo ») sur le territoire de Bordeaux Métropole
    gloss_en: change in the length of cycle ways of all types combined (lanes, tracks, traffic-calmed
      zones, bus-and-bike lanes) in Bordeaux Métropole.
    gloss_de: "Entwicklung der Länge der Radverkehrsanlagen aller Arten zusammen (Radfahrstreifen, Radwege, verkehrsberuhigte Zonen, Bus- und Radspuren) im Gebiet von Bordeaux Métropole"
    locator: p. 46 (PDF p. 47), title of Graphique n° 9
  - id: reve-progress
    text: À date, avec 36 kilomètres mis en service sur les 270 kilomètres prévus, il reste à réaliser
      86 % du programme du ReVE.
    gloss_en: To date, with 36 kilometres opened out of the 270 kilometres planned, 86% of the ReVE programme
      remains to be built.
    gloss_de: "Mit 36 in Betrieb genommenen von 270 geplanten Kilometern bleiben bislang 86 % des ReVE-Programms umzusetzen."
    locator: p. 47 (PDF p. 48), §3.4.1
  - id: plan-2017-2020
    text: Au-delà, c’est plus de 406 km d’aménagements favorables aux vélos (+ 38 % entre fin 2016 et
      fin 2020) et 62 km supplémentaires d’aménagements cyclables en site propre ou par bande cyclable,
      piste cyclable et couloir bus vélo (+ 10 % entre fin 2016 et fin 2020)
    gloss_en: Beyond that, more than 406 km of bicycle-friendly facilities (+38% between end 2016 and
      end 2020) and 62 km more of dedicated cycle facilities as cycle lanes, cycle tracks and bus-bike
      lanes (+10% between end 2016 and end 2020).
    gloss_de: "Darüber hinaus sind es mehr als 406 km fahrradfreundliche Anlagen (+38 % zwischen Ende 2016 und Ende 2020) und 62 km zusätzliche eigene Radverkehrsanlagen als Radfahrstreifen, Radweg oder Bus- und Radspur (+10 % zwischen Ende 2016 und Ende 2020)"
    locator: p. 30 (PDF p. 31), §2.2.1
- id: bordeaux-metropole-reve
  publisher: Bordeaux Métropole
  title: Le Réseau Vélo Express - ReVE
