  excerpts:
  - id: reve
    text: Le Réseau Vélo Express est un projet de réseau de 14 itinéraires (272km) de voies cyclables
      larges, sécurisées et dotés d’un jalonnement spécifique.
    gloss_en: The Réseau Vélo Express is a planned network of 14 routes (272 km) of wide, protected cycle
      ways with dedicated signposting.
    gloss_de: "Das Réseau Vélo Express ist ein geplantes Netz aus 14 Routen (272 km) breiter, geschützter Radwege mit eigener Wegweisung."
    locator: page introduction
  - id: network-1000
    text: En attendant la mise en service des itinéraires du ReVE, la Métropole dispose déjà de plus de
      1000 kms d’aménagements cyclables.
    gloss_en: While the ReVE routes are being opened, the Métropole already has more than 1,000 km of
      cycle facilities.
    gloss_de: "Bis die Routen des ReVE in Betrieb gehen, verfügt die Métropole bereits über mehr als 1.000 km Radverkehrsanlagen."
    locator: section on the ReVE lines
