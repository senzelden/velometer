    gloss_en: Bordeaux Métropole is a public body for inter-municipal cooperation (Établissement Public
      de Coopération Intercommunale, EPCI), serving the 28 municipalities (communes) that make it up.
    gloss_de: "Bordeaux Métropole ist ein öffentlicher Zweckverband für interkommunale Zusammenarbeit (Établissement Public de Coopération Intercommunale, EPCI), im Dienst der 28 Gemeinden (communes), aus denen er besteht."
