  - id: network-600
    text: Avec plus de 600 km d’itinéraires cyclables, Strasbourg propose le 1er réseau vélo de France.
    gloss_en: With more than 600 km of cycle routes, Strasbourg offers France's leading cycle network.
    locator: page introduction
- id: strasbourg-plan-velo-2024
  publisher: Ville et Eurométropole de Strasbourg
  title: L’Eurométropole développe 100 kilomètres d’itinéraires cyclables
  url: https://www.strasbourg.eu/-/plan-velo-eurometropole-102024
  published: '2024-10-30'
  accessed: '2026-10-06'
  language: fr
  kind: official
  archive_url: https://web.archive.org/web/20260308131306/https://www.strasbourg.eu/-/plan-velo-eurometropole-102024
  excerpts:
  - id: plan
    text: Une centaine d’opérations pour une centaine de kilomètres de pistes cyclables réaménagées ou
      construites dans l’agglomération strasbourgeoise d’ici 2026. C’est l’objectif du plan vélo lancé
      par l’Eurométropole en 2021.
    gloss_en: About a hundred operations for about a hundred kilometres of cycle tracks rebuilt or built
      in the Strasbourg conurbation by 2026. That is the aim of the cycling plan launched by the Eurométropole
      in 2021.
    locator: article lead
  - id: progress-2024
    text: A la fin d’année 2024, 52 opérations du plan vélo auront été réalisées, dont 30 opérations concernant
      des communes autres que la ville centre.
    gloss_en: By the end of 2024, 52 operations of the cycling plan will have been completed, 30 of them
      in municipalities other than the central city.
    locator: article body, paragraph 2
- id: strasbourg-velostras
  publisher: Ville et Eurométropole de Strasbourg
  title: Vélostras, le réseau cyclable à haut niveau de service
  url: https://www.strasbourg.eu/velostras-le-reseau-cyclable-a-haut-niveau-de-service
  accessed: '2026-10-06'
  language: fr
  kind: official
  archive_url: https://web.archive.org/web/20260616185333/https://www.strasbourg.eu/velostras-le-reseau-cyclable-a-haut-niveau-de-service
  excerpts:
  - id: velostras
    text: L’Eurométropole de Strasbourg s’est engagée depuis 2013 dans la réalisation d’un Réseau Express
      Vélo, Vélostras. Ce réseau cyclable hyper structurant maille tout le territoire, relie les communes
      entre elles et contourne le centre-ville de Strasbourg. Il totalisera au final plus de 130 km
    gloss_en: Since 2013 the Eurométropole de Strasbourg has been building an express cycle network, Vélostras.
      This backbone network covers the whole territory, links the municipalities and bypasses the city
      centre. It will finally total more than 130 km.
    locator: page introduction
- id: strasbourg-opendata-bnac
  publisher: Ville et Eurométropole de Strasbourg, data.strasbourg.eu
  title: Aménagements cyclables au format BNAC, dataset description
  url: https://data.strasbourg.eu/explore/dataset/amg_cycl_bnac/information/
  accessed: '2026-10-06'
  language: fr
  kind: official
  excerpts:
  - id: basis
    text: 'Données issues du filaire de voie de l''Eurométropole de Strasbourg structurées dans un schéma
      permettant de modéliser et définir les aménagements cyclables sur le territoire national : la Base
      Nationale des Aménagements Cyclables (BNAC).'
    gloss_en: 'Data derived from the Eurométropole de Strasbourg road centreline network, structured in
      a schema for modelling and defining cycle facilities nationally: the national cycle facility database
      (BNAC).'
    locator: dataset description, first paragraph (text read via the data.strasbourg.eu catalogue API)
- id: strasbourg-rue89-plan-velo-2021
  publisher: Rue89 Strasbourg
  title: Pistes cyclables et jonctions, le nouveau plan de la métropole pour le vélo
  url: https://www.rue89strasbourg.com/eurometropole-120-kilometres-pistes-cyclables-2026-211146
  published: '2021-06-23'
  accessed: '2026-10-06'
  language: fr
  kind: press
  archive_url: https://web.archive.org/web/20260614070648/https://www.rue89strasbourg.com/eurometropole-120-kilometres-pistes-cyclables-2026-211146
  excerpts:
  - id: targets
    text: 'Objectif : 120 kilomètres de pistes cyclables supplémentaires en 5 ans et arriver à 20% de
      part de déplacements à vélo d’ici 2030, contre 11% actuellement.'
    gloss_en: 'Target: 120 additional kilometres of cycle tracks in 5 years and a 20% cycling share of
      trips by 2030, against 11% today.'
    locator: article body, paragraph 1
  - id: junctions
    text: Mais plus que les kilomètres, c’est aussi « une cinquantaine de jonctions » qui doivent être
      réalisé, afin de relier les pistes existantes des 33 communes de la métropole.
    gloss_en: But beyond kilometres, 'about fifty junctions' must also be built to link the existing tracks
      of the metropolis's 33 municipalities.
    locator: article body
- id: strasbourg-cityra-mi-chemin
  publisher: Cityra
  title: 'Strasbourg : le plan vélo de l’Eurométropole à mi-chemin'
  url: https://cityramag.fr/strasbourg-le-plan-velo-de-leurometropole-a-mi-chemin/
  published: '2024-11-11'
  accessed: '2026-10-06'
  language: fr
  kind: press
  excerpts:
  - id: 750km
    text: Il ajoutera une centaine de kilomètres aux 750 kilomètres de pistes déjà existants sur l’ensemble
      des 33 communes de l’Eurométropole.
    gloss_en: It will add about a hundred kilometres to the 750 kilometres of tracks already existing
      across the Eurométropole's 33 municipalities.
    locator: article body, paragraph 2
- id: bordeaux-plan-velo-2021-2026
  publisher: Bordeaux Métropole
  title: 3ème Plan vélo métropolitain 2021-2026
  url: https://www.bordeaux-metropole.fr/sites/MET-BXMETRO-DRUPAL/files/2023-08/Plan_velo2021.pdf
  accessed: '2026-10-06'
  language: fr
  kind: official
  archive_url: https://web.archive.org/web/20251008040927/https://www.bordeaux-metropole.fr/sites/MET-BXMETRO-DRUPAL/files/2023-08/Plan_velo2021.pdf
  excerpts:
  - id: network-2021
    text: 'En juin 2021, la Métropole était dotée de 1 506 km d’aménagements cyclables pour 1 022 km en
      2015, soit une augmentation de 47% (+100% en 10 ans) : 348 km de pistes cyclables et voies vertes
      367 km de bandes cyclables et couloirs bus 624 km de voies de circulation apaisée 167 km de voies
      piétonnes'
    gloss_en: 'In June 2021 the Métropole had 1,506 km of cycle facilities against 1,022 km in 2015, a
      47% increase (+100% in 10 years): 348 km of cycle tracks and greenways, 367 km of cycle lanes and
      bus lanes, 624 km of traffic-calmed streets, 167 km of pedestrian streets.'
    locator: PDF p. 8, action 1.1 'État des lieux'
- id: bordeaux-crc-plan-velo-2025
  publisher: Chambre régionale des comptes Nouvelle-Aquitaine
  title: Bordeaux Métropole – Plan vélo, rapport d’observations définitives, exercices 2019 et suivants,
    deliberated 5 August 2025 (copy published by the Ville de Mérignac)
  url: https://www.merignac.com/sites/default/files/2026-04/crc-bordeaux-metropole-plan-velo.pdf
  accessed: '2026-10-06'
  language: fr
  kind: official
  excerpts:
  - id: network-2024
    text: Les tableaux de suivi de Bordeaux Métropole montrent l’aménagement de 107 km supplémentaires
      d’itinéraires cyclables depuis l’adoption du plan vélo 2021-2026. À fin 2024, le réseau cyclable
      situé à l’intérieur du périmètre de Bordeaux Métropole s’élevait à 1 700 km.
    gloss_en: Bordeaux Métropole's monitoring tables show 107 km of additional cycle routes since the
      2021-2026 cycling plan was adopted. At the end of 2024 the cycle network within Bordeaux Métropole
      amounted to 1,700 km.
    locator: p. 46 (PDF p. 47), §3.4.1
  - id: network-basis
    text: évolution du linéaire des voies cyclables tous types confondus (bandes, pistes, zones apaisées,
      couloirs « bus&vélo ») sur le territoire de Bordeaux Métropole
    gloss_en: change in the length of cycle ways of all types combined (lanes, tracks, traffic-calmed
      zones, bus-and-bike lanes) in Bordeaux Métropole.
    locator: p. 46 (PDF p. 47), title of Graphique n° 9
  - id: reve-progress
    text: À date, avec 36 kilomètres mis en service sur les 270 kilomètres prévus, il reste à réaliser
      86 % du programme du ReVE.
    gloss_en: To date, with 36 kilometres opened out of the 270 kilometres planned, 86% of the ReVE programme
      remains to be built.
    locator: p. 47 (PDF p. 48), §3.4.1
  - id: plan-2017-2020
    text: Au-delà, c’est plus de 406 km d’aménagements favorables aux vélos (+ 38 % entre fin 2016 et
      fin 2020) et 62 km supplémentaires d’aménagements cyclables en site propre ou par bande cyclable,
      piste cyclable et couloir bus vélo (+ 10 % entre fin 2016 et fin 2020)
    gloss_en: Beyond that, more than 406 km of bicycle-friendly facilities (+38% between end 2016 and
      end 2020) and 62 km more of dedicated cycle facilities as cycle lanes, cycle tracks and bus-bike
      lanes (+10% between end 2016 and end 2020).
    locator: p. 30 (PDF p. 31), §2.2.1
