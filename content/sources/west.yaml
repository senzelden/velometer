- id: barcelona-ara-32km-2021
  publisher: Ara
  title: Barcelona ampliarà en 32 quilòmetres la xarxa de carrils bici
  url: https://www.ara.cat/societat/ajuntament-barcelona-bici-bicing_1_4141511.html
  published: '2021-10-09'
  accessed: '2026-10-06'
  language: ca
  kind: press
  archive_url: https://web.archive.org/web/20251024223552/https://www.ara.cat/societat/ajuntament-barcelona-bici-bicing_1_4141511.html
  excerpts:
  - id: itineraris-1150
    text: A banda dels carrils bic, la ciutat ja té una xarxa de vies ciclables amb carrers a velocitats
      de 30, 20 o 10 km/h, entre els quals s'inclouen les superilles i les plataformes úniques.
    gloss_en: Besides the bike lanes, the city already has a network of cycle routes on streets limited
      to 30, 20 or 10 km/h, including the superblocks and single-surface streets.
    locator: article body, last section
  - id: total-1150
    text: D'aquesta manera, sumant tots els recorreguts, carrers i carrils bici aptes per desplaçar-se
      en bicicleta, Barcelona ja té prop de 1.150 quilòmetres d'itineraris ciclistes a disposició dels
      ciutadans.
    gloss_en: Thus, adding up all routes, streets and bike lanes suitable for cycling, Barcelona already
      has nearly 1,150 kilometres of cycle routes available to residents.
    locator: article body, last section
  - id: plan-2023
    text: Amb aquestes actuacions previstes, la ciutat arribarà als 270 quilòmetres de carrils bici a
      finals de l'actual legislatura.
    gloss_en: With these planned works, the city will reach 270 kilometres of bike lanes by the end of
      the current term.
    locator: article lead
