# External sources, west region (paris, lyon, strasbourg, bordeaux, madrid, barcelona).
# Research log: docs/review/m7-sources-west.md
sources:
- id: paris-plan-velo-2021-2026
  publisher: Ville de Paris
  title: 'Plan Vélo 2021-2026 : Paris 100 % cyclable (dossier de presse)'
  url: https://cdn.paris.fr/paris/2025/04/23/plan-velo_dossier-de-presse_fr-2024-web-W8kI.pdf
  accessed: '2026-10-06'
  language: fr
  kind: official
  archive_url: https://web.archive.org/web/20250918004108/https://cdn.paris.fr/paris/2025/04/23/plan-velo_dossier-de-presse_fr-2024-web-W8kI.pdf
  excerpts:
  - id: network-2021-basis
    text: 1094 km de voies cyclables recensées en 2021 (en comptant les pistes cyclables, voies réservées
      et voies à contre-sens cyclistes).
    gloss_en: 1,094 km of cycle ways recorded in 2021 (counting cycle tracks, reserved lanes and contraflow
      cycle lanes).
    locator: p. 8, sidebar 'Plan Vélo 2021-2026'
  - id: network-2020-observatoire
    text: Le linéaire cyclable fait 1404km en 2020 selon le bilan de l’Observatoire de l’Agence de la
      Moblité.
    gloss_en: The cycle network length is 1,404 km in 2020 according to the review of the Mobility Agency's
      Observatory.
    locator: p. 8, sidebar 'Plan Vélo 2021-2026' (text layer overlaps a budget graphic; sentence read
      in order from the PDF text layer)
  - id: edito-2014-2021
    text: entre 2014 et 2021, 300 kilomètres de nouveaux itinéraires cyclables et 52 kilomètres de pistes
      temporaires ont été aménagés portant à plus de 1 000 kilomètres le réseau cyclable à Paris.
    gloss_en: between 2014 and 2021, 300 kilometres of new cycle routes and 52 kilometres of temporary
      tracks were laid out, bringing the cycle network in Paris to more than 1,000 kilometres.
    locator: p. 3, editorial by Anne Hidalgo
  - id: targets-2026
    text: La Ville compte plus de 1 000 km d’aménagements cyclables dont plus de 300 km de pistes sécurisées.
    gloss_en: The City has more than 1,000 km of cycle facilities, of which more than 300 km are protected
      cycle tracks.
    locator: p. 15, 'Un maillage cyclable complet' infographic
  - id: targets-180km
    text: 180km de pistes cyclables sécurisées - 130 km de nouvelles pistes - 52 km de coronapistes pérénisées
    gloss_en: '180 km of protected cycle tracks: 130 km of new tracks, 52 km of coronapistes made permanent.'
    locator: p. 15, 'Un maillage cyclable complet'
- id: paris-opendata-lineaire-km
  publisher: Ville de Paris, Paris Data
  title: Linéaire cyclable (en km), dataset description
  url: https://opendata.paris.fr/explore/dataset/lineaire-cyclable-km/information/
  accessed: '2026-10-06'
  language: fr
  kind: official
  excerpts:
  - id: definition
    text: Le linéaire pour une année donnée correspond au cumul au 1er janvier des itinéraires cyclables
      sous forme de piste, voie verte, bande, couloir bus ouverts aux vélos, voies et chemins fermés à
      la circulation générale, voies piétonnes ouvertes aux vélos et doubles sens cyclable simples sur
      le territoire de la ville de Paris.
    gloss_en: The length for a given year is the total at 1 January of cycle routes in the form of tracks,
      greenways, lanes, bus lanes open to bicycles, roads and paths closed to general traffic, pedestrian
      streets open to bicycles and simple contraflow cycling on the territory of the City of Paris.
    locator: dataset description (Informations tab; text read via the Paris Data catalogue API)
  - id: osm-basis
    text: Ces données sont une extraction de la base de OSM © Les Contributeurs d’OpenStreetMap
    gloss_en: These data are an extract of the OSM database © OpenStreetMap contributors.
    locator: dataset description, last sentence
- id: paris-opendata-amenagements
  publisher: Ville de Paris, Direction de la Voirie et des Déplacements
  title: Linéaires d'aménagement cyclable, dataset description
  url: https://opendata.paris.fr/explore/dataset/amenagements-cyclables/information/
  accessed: '2026-10-06'
  language: fr
  kind: official
  excerpts:
  - id: definition
    text: Le choix de la ville de Paris est de définir comme itinéraire cyclable chacune des voies ou/et
      sens de circulation qui, tout en étant autorisé aux vélos, est en accès interdit ou restreint pour
      les autres utilisateurs (hors vélorues).
    gloss_en: The City of Paris chooses to define as a cycle route each road and/or direction of travel
      that, while open to bicycles, is closed or restricted for other users (except cycle streets).
    locator: dataset description, 'Contenu du jeu de donnée'
  - id: superposed
    text: 'dans certains cas, deux aménagements différents sont superposés (ex : piste cyclable côté droit
      et gauche de la voie).'
    gloss_en: in some cases two different facilities are superposed (e.g. a cycle track on the right and
      on the left side of the road).
    locator: dataset description, 'Points d'attention' 1
  - id: paths-excluded
    text: 'NB : donnée non prise en compte dans le calcul dans le chiffre du bilan des itinéraires cyclables'
    gloss_en: 'Note: these data are not counted in the cycle route review figure.'
    locator: dataset description, typology table, row 'Chemin interdit aux véhicules motorisés'
- id: paris-notice-amenagements
  publisher: Ville de Paris, Mission Vélo
  title: Notice – Aménagements cyclables (juin 2023)
  url: https://opendata.paris.fr/api/explore/v2.1/catalog/datasets/amenagements-cyclables/attachments/notice_amenagements_cyclables_pdf
  accessed: '2026-10-06'
  language: fr
  kind: official
  excerpts:
  - id: osm-source
    text: Les données aménagements cyclables sont issues de la base de données libre et ouverte OpenStreetMap
      (OSM) ©Les contributeurs d'OSM.
    gloss_en: The cycle facility data come from the free and open OpenStreetMap (OSM) database © OSM contributors.
    locator: p. 1, first paragraph
  - id: validation
    text: Les données sont extraites de la base OSM telles qu'elles y étaient présentes à la "date export",
      sauf pour les données les plus récentes, qui ne contiennent que des éléments issue d'OSM ayant fait
      l'objet d'une validation préalable de la mission vélo via l'outil de contrôle qualité "LeBonTag".
    gloss_en: The data are extracted from OSM as they stood at the 'export date', except the most recent
      data, which contain only OSM elements first validated by the cycling unit with the 'LeBonTag' quality-control
      tool.
    locator: p. 1, 'Processus'
- id: paris-lessentiel-1565km
  publisher: L'essentiel Paris
  title: 'Le chiffre : 1 565 kilomètres d''aménagements cyclables à Paris'
  url: https://www.lessentiel.fr/paris/notre-ville/2025-10-07/le-chiffre-1-565-kilometres-damenagements-cyclables-paris-7907
  published: '2025-10-06'
  accessed: '2026-10-06'
  language: fr
  kind: press
  excerpts:
  - id: figure-2025
    text: Parmi ces chiffres, on y apprend qu'il existe au 1er janvier de cette année 1 565 kilomètres
      d'aménagements cyclables.
    gloss_en: Among these figures we learn that on 1 January this year there were 1,565 kilometres of
      cycle facilities.
    locator: article body, 'À retenir'
  - id: figure-2015
    text: Au 1er janvier 2015, on comptait 935 km de linéaire cyclable.
    gloss_en: On 1 January 2015 there were 935 km of cycle network.
    locator: article body, 'Une évolution constante'
- id: paris-parisenselle-observatoire
  publisher: Paris en Selle
  title: Engagements du Plan vélo – Observatoire du Plan Vélo de Paris
  url: https://observatoire.parisenselle.fr/engagements/
  accessed: '2026-10-06'
  language: fr
  kind: ngo
  archive_url: https://web.archive.org/web/20251211001509/https://observatoire.parisenselle.fr/engagements/
  excerpts:
  - id: plan-2015-2020
    text: Le précédent Plan Vélo 2015-2020, dont nous avions suivi la réalisation à travers notre Observatoire,
      avait atteint 55 % du linéaire promis en 2015.
    gloss_en: The previous 2015-2020 Cycling Plan, whose delivery we tracked through our Observatory,
      reached 55% of the length promised in 2015.
    locator: opening paragraph
  - id: plan-2021-2026
    text: 'Doté d’un budget de 250 millions d’euros, son objectif est de faire de Paris une ville 100
      % cyclable en déployant un total de 180 km d’aménagements cyclables d’ici la fin de la mandature
      : 130 km de nouvelles pistes cyclables et la pérennisation d’ici 2024 des 52 km de coronapistes.'
    gloss_en: 'With a budget of 250 million euros, its aim is to make Paris 100% cyclable by deploying
      180 km of cycle facilities by the end of the term: 130 km of new cycle tracks and making the 52
      km of coronapistes permanent by 2024.'
    locator: section 'Le Plan Vélo 2021-2026'
- id: lyon-plan-velo-2024
  publisher: Métropole de Lyon
  title: Plan vélo de la Métropole de Lyon (août 2024)
  url: https://avelo.grandlyon.com/fileadmin/user_upload/pdf/GL_PlanVelo_FR_aout2024_BAT03.pdf
  accessed: '2026-10-06'
  language: fr
  kind: official
  archive_url: https://web.archive.org/web/20260428115825/https://avelo.grandlyon.com/fileadmin/user_upload/pdf/GL_PlanVelo_FR_aout2024_BAT03.pdf
  excerpts:
  - id: network-2020
    text: 1 013 kilomètres d’aménagements cyclables fin 2020 + 525 km entre 2014 et 2020
    gloss_en: 1,013 kilometres of cycle facilities at the end of 2020; +525 km between 2014 and 2020.
    locator: p. 4, 'Plus d'infrastructures'
  - id: breakdown-2023
    text: Répartition des 1 208 kilomètres d’aménagements cyclables 57 km en accotement revêtu 367 km
      en bande cyclable 234 km en piste cyclable 92 km en couloir bus/vélo 229 km en double sens cyclable
      228 km en voie verte
    gloss_en: 'Breakdown of the 1,208 kilometres of cycle facilities: 57 km paved shoulder, 367 km cycle
      lane, 234 km cycle track, 92 km bus/bike lane, 229 km contraflow cycling, 228 km greenway.'
    locator: p. 10, infographic 'Linéaire d'aménagements cyclables' (chart labels in PDF text-layer order,
      interleaved figures omitted)
  - id: target-2000km
    text: La Métropole de Lyon souhaite doubler le linéaire cyclable pour atteindre 2 000 kilomètres d’aménagements
      dédiés aux vélos.
    gloss_en: The Métropole de Lyon aims to double the cycle network to reach 2,000 kilometres of facilities
      dedicated to bicycles.
    locator: p. 10, action 2 'Améliorer la cyclabilité'
  - id: facility-types
    text: l’ensemble des projets d’aménagements de voirie comporte un aménagement cyclable, tel qu’une
      piste cyclable, une bande cyclable, une voie verte, un couloir de bus ouvert aux vélos ou un double
      sens cyclable.
    gloss_en: every road project includes a cycle facility, such as a cycle track, a cycle lane, a greenway,
      a bus lane open to bicycles or contraflow cycling.
    locator: p. 10, action 2
  - id: vl-target-2030
    text: 'Objectif 2030 : 355 km'
    gloss_en: '2030 target: 355 km (Voies Lyonnaises).'
    locator: p. 9, action 1, chart 'Évolution du linéaire des Voies lyonnaises'
- id: lyon-grandlyon-circuler-a-velo
  publisher: Métropole de Lyon
  title: Circuler à vélo
  url: https://www.grandlyon.com/mes-services-au-quotidien/se-deplacer/circuler-a-velo
  accessed: '2026-10-06'
  language: fr
  kind: official
  archive_url: https://web.archive.org/web/20260607193535/https://www.grandlyon.com/mes-services-au-quotidien/se-deplacer/circuler-a-velo
  excerpts:
  - id: network-1250
    text: Consultez le réseau d'infrastructures cyclables en expansion avec les Voies Lyonnaises, qui
      compte près de 1250 km d'aménagements cyclables et plus de 40 000 places de stationnements sécurisées
      pour les cycliste.
    gloss_en: See the cycling infrastructure network, expanding with the Voies Lyonnaises, which has nearly
      1,250 km of cycle facilities and more than 40,000 secure parking spaces for cyclists.
    locator: page body, map section
  - id: pistes-1100
    text: La sécurité a été développée grâce à plus de 1 100 km de pistes cyclables.
    gloss_en: Safety has been improved thanks to more than 1,100 km of cycle tracks.
    locator: page body, introduction
- id: lyon-lavilleavelo-bilan-vl
  publisher: La Ville à Vélo
  title: 'Bilan du premier mandat des Voies Lyonnaises : un effort inédit pour la sécurisation des cyclistes,
    un réseau discontinu à poursuivre'
  url: https://lavilleavelo.org/2025/12/17/bilan-du-premier-mandat-des-voies-lyonnaises-un-effort-inedit-pour-la-securisation-des-cyclistes-un-reseau-discontinu-a-poursuivre/
  published: '2025-12-17'
  accessed: '2026-10-06'
  language: fr
  kind: ngo
  archive_url: https://web.archive.org/web/20260612110755/https://lavilleavelo.org/2025/12/17/bilan-du-premier-mandat-des-voies-lyonnaises-un-effort-inedit-pour-la-securisation-des-cyclistes-un-reseau-discontinu-a-poursuivre/
  excerpts:
  - id: delivered
    text: 'Sur les 250 km promis pour 2026, seuls 170 km (dont 60 km préexistants) seront livrés en 2026
      : le réseau comporte encore de nombreuses discontinuités, qui constituent autant de points noirs
      soulevés par les cyclistes lors de l’enquête du Baromètre Vélo 2025.'
    gloss_en: 'Of the 250 km promised for 2026, only 170 km (including 60 km that already existed) will
      be delivered in 2026: the network still has many gaps, each a black spot raised by cyclists in the
      2025 Baromètre Vélo survey.'
    locator: section 'Un projet inachevé'
  - id: new-110km
    text: Avec un peu moins de 200 M€ investis, soit l’équivalent de quelques kilomètres d’une ligne de
      tramway, c’est près de 110 km de nouvelles infrastructures cyclables sécurisées qui auront été réalisées.
    gloss_en: With a little under €200m invested, the equivalent of a few kilometres of tram line, nearly
      110 km of new protected cycle infrastructure will have been delivered.
    locator: section 'Une volonté politique sans précédent'
- id: lyon-lyoncapitale-vl-2025
  publisher: Lyon Capitale
  title: '17 nouveaux km de Voies lyonnaises inaugurés : la Métropole de Lyon est-elle dans ses objectifs
    ?'
  url: https://www.lyoncapitale.fr/actualite/17-nouveaux-km-de-voies-lyonnaises-inaugures-la-metropole-de-lyon-est-elle-dans-ses-objectifs
  published: '2025-05-16'
  accessed: '2026-10-06'
  language: fr
  kind: press
  archive_url: https://web.archive.org/web/20260618113954/https://www.lyoncapitale.fr/actualite/17-nouveaux-km-de-voies-lyonnaises-inaugures-la-metropole-de-lyon-est-elle-dans-ses-objectifs
  excerpts:
  - id: targets
    text: 'Le cap des 396 km de pistes cyclables, réparties en 13 Voies lyonnaises, est par ailleurs figé
      à 2030. En plus de cette échéance, la collectivité écologiste dirigée par Bruno Bernard avait fixé
      un premier objectif : 250 km au cours du mandat, soit jusqu''en mars 2026.'
    gloss_en: 'The milestone of 396 km of cycle tracks across 13 Voies Lyonnaises is set for 2030. Besides
      that deadline, the green-led authority headed by Bruno Bernard had set a first target: 250 km during
      the term, i.e. until March 2026.'
    locator: article body, paragraph 2
  - id: revised
    text: Ambition revue à la baisse en janvier dernier à 200 km. Puis dernièrement à 180 km.
    gloss_en: Ambition lowered last January to 200 km. Then recently to 180 km.
    locator: section 'Près de 100 km réalisés à la mi-mai'
