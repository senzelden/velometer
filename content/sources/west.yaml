    gloss_en: 600 km of cycle network.
    locator: 'key-figures band at top of page (source line: Ville et Eurométropole de Strasbourg et INSEE)'
  - id: pama
    text: Doubler la part modale vélo, de 8 % à 16 %, à l’horizon 2030.
    gloss_en: Double the cycling modal share, from 8% to 16%, by 2030.
    locator: section 'Le Plan d'Actions des Mobilités Actives (PAMA)'
- id: strasbourg-a-velo
  publisher: Ville et Eurométropole de Strasbourg
  title: Strasbourg à vélo
  url: https://www.strasbourg.eu/a-velo
  accessed: '2026-10-06'
  language: fr
