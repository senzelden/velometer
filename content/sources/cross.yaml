  - id: bikenetkit-pbi-filter
    publisher: BikeNetKit (GitHub, IT University of Copenhagen)
    title: "GrowBikeNet constants.py: PBI_CUSTOM_FILTER (commit 8820875)"
    url: https://github.com/BikeNetKit/growbikenet/blob/8820875fcb1f363a743f2ce512e231a06a2337d9/growbikenet/constants.py
