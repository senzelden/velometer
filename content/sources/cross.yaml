  - id: osm-wiki-key-cycleway
    publisher: OpenStreetMap Wiki
    title: "Key:cycleway"
    url: https://wiki.openstreetmap.org/wiki/Key:cycleway
    accessed: 2026-10-06
    language: en
    kind: ngo
    excerpts:
      - id: inherent
        text: >-
          The cycleway=* tagging is used on linear features tagged with highway=* to map cycling
          infrastructure that is an inherent part of the road.
        gloss_de: "Das Tagging cycleway=* wird an linearen Objekten mit highway=* verwendet, um Radinfrastruktur zu kartieren, die fester Bestandteil der Straße ist."
        locator: "Introduction"
      - id: sides
        text: >-
          It is advisable to use cycleway tags in combination with side attributes, i.e.
          cycleway:left=*, cycleway:right=* or cycleway:both=* (instead of a simple cycleway=*).
          This clearly indicates which side of the road an infrastructure specification refers
          to.
        gloss_de: "Es empfiehlt sich, cycleway-Tags mit Seitenangaben zu verwenden, also cycleway:left=*, cycleway:right=* oder cycleway:both=* (statt eines einfachen cycleway=*). So ist klar, auf welche Straßenseite sich eine Angabe zur Infrastruktur bezieht."
        locator: "§3 Bicycle infrastructure in one-way roads"

  - id: osm-wiki-cycleway-lane
    publisher: OpenStreetMap Wiki
    title: "Tag:cycleway=lane"
