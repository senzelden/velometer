    excerpts:
      - id: def
        text: >-
          A cycle lane is bicycle infrastructure that is an inherent part of the road, but set
          aside for the exclusive use of bicycles, whilst being separated only by paint or other
          markings, and without a physical separation from vehicles.
        gloss_de: "Ein Radfahrstreifen ist Radinfrastruktur, die fester Bestandteil der Straße, aber ausschließlich dem Radverkehr vorbehalten ist; er ist nur durch Farbe oder andere Markierungen und ohne bauliche Trennung von den Fahrzeugen abgegrenzt."
        locator: "Introduction"
      - id: both-sides
        text: >-
          cycleway=lane is used to tag two-way streets where there are cycle lanes on both sides
          of the road, or sometimes for one-way streets where there is only a lane operating in
          the direction of main traffic flow
        gloss_de: "cycleway=lane wird für Straßen mit Gegenverkehr verwendet, an denen es auf beiden Straßenseiten Radfahrstreifen gibt, oder manchmal für Einbahnstraßen, in denen es nur einen Streifen in der Hauptfahrtrichtung gibt"
        locator: "Introduction"

