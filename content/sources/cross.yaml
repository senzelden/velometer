# Cross-city sources: definitions and methods of the external benchmarks.
# Research log: docs/review/m7-sources-cross.md
sources:
  - id: cc2025-report
    publisher: Clean Cities Campaign
    title: "Streets for Kids, Cities for All: City Ranking 2025 (report)"
    url: https://cleancitiescampaign.org/wp-content/uploads/2025/05/Report-Streets-For-Kids-Cities-For-All.pdf
    accessed: 2026-10-06
    language: en
    kind: ngo
    archive_url: https://web.archive.org/web/20260224120420/https://cleancitiescampaign.org/wp-content/uploads/2025/05/Report-Streets-For-Kids-Cities-For-All.pdf
    excerpts:
      - id: metric
        text: >-
          Ratio of protected (i.e. physically separated through a barrier, height difference or
          distance from motorised traffic) cycling infrastructure total vs road network (in km)
        gloss_de: "Verhältnis der geschützten Radinfrastruktur (d. h. baulich durch eine Barriere, einen Höhenunterschied oder Abstand vom Kfz-Verkehr getrennt) insgesamt zum Straßennetz (in km)"
        locator: "Table 1, Indicator 3, metric used; PDF p.10 (report p.18)"
      - id: city-data
        text: >-
          Each city administration was invited to provide local data and offer feedback on any
          missing or incomplete information. 34 out of the 36 cities provided data for this
          ranking. For the two cities which did not provide data and for any incomplete data,
          public data sources were used instead.
        gloss_de: "Jede Stadtverwaltung wurde gebeten, lokale Daten bereitzustellen und Rückmeldung zu fehlenden oder unvollständigen Angaben zu geben. 34 der 36 Städte lieferten Daten für dieses Ranking. Für die beiden Städte, die keine Daten lieferten, und für unvollständige Daten wurden stattdessen öffentliche Datenquellen verwendet."
        locator: "§2 How was this ranking compiled?; PDF p.9 (report p.17)"
      - id: supplemented
        text: >-
          Where needed, we supplemented this with publicly available data from cities,
          government bodies, the European Cyclists’ Federation, and Openstreetmap. In cases where
          only estimates were available, this is clearly indicated. Each city's data quality was
          rated on a scale from poor to high to highlight potential uncertainties.
        gloss_de: "Wo nötig, haben wir dies um öffentlich verfügbare Daten von Städten, Behörden, der European Cyclists’ Federation und OpenStreetMap ergänzt. Wo nur Schätzungen vorlagen, ist dies deutlich angegeben. Die Datenqualität jeder Stadt wurde auf einer Skala von schlecht bis hoch bewertet, um mögliche Unsicherheiten zu zeigen."
        locator: "Data sources and quality; PDF p.10 (report p.19)"
      - id: area
        text: >-
          Unless otherwise specified, each city refers to the municipality of the same name. We
          have chosen to focus on the area under the control of local authorities, particularly
          mayors.
        gloss_de: "Sofern nicht anders angegeben, bezeichnet jede Stadt die gleichnamige Gemeinde. Wir haben uns auf das Gebiet konzentriert, das der Kontrolle der Kommunalverwaltung untersteht, insbesondere der Bürgermeister."
        locator: "City selection; PDF p.10 (report p.19)"
      - id: collection-dates
        text: >-
          Data collection took place from December 2024 to February 7, 2025, using the most
          up-to-date information
        gloss_de: "Die Datenerhebung fand von Dezember 2024 bis zum 7. Februar 2025 statt, mit den aktuellsten verfügbaren Informationen"
        locator: "Pull quote, §3; PDF p.11 (report p.20)"
      - id: cutoff
        text: >-
          Any significant updates were incorporated only if new data was provided by cities or
          partners before April 4, 2025. More recent changes or updates were not taken into
          account.
        gloss_de: "Wesentliche Aktualisierungen wurden nur berücksichtigt, wenn Städte oder Partner vor dem 4. April 2025 neue Daten lieferten. Spätere Änderungen oder Aktualisierungen wurden nicht berücksichtigt."
        locator: "Data sources and quality (continued); PDF p.11 (report p.20)"
      - id: average
        text: >-
          On average, protected cycling infrastructure only amounts to the equivalent of 17% of
          the road network.
        gloss_de: "Im Durchschnitt entspricht die geschützte Radinfrastruktur nur 17 % des Straßennetzes."
        locator: "Indicator 3: Protected cycling infrastructure; PDF p.15 (report pp.28-29)"
      - id: shared-paths
        text: >-
          Shared foot and bike paths, while not ideal, still offer protection from motorised
          traffic, helping certain cities perform relatively well. These types of infrastructure
          are common in countries like Germany, Poland and Finland.
        gloss_de: "Gemeinsame Geh- und Radwege sind nicht ideal, bieten aber dennoch Schutz vor dem Kfz-Verkehr und helfen manchen Städten zu einem relativ guten Abschneiden. Diese Art von Infrastruktur ist in Ländern wie Deutschland, Polen und Finnland verbreitet."
        locator: "Indicator 3: Protected cycling infrastructure; PDF p.15 (report pp.28-29)"

  - id: cc2025-annexes
    publisher: Clean Cities Campaign
    title: "Streets for Kids, Cities for All: City Ranking 2025, Annexes (methodology)"
    url: https://cleancitiescampaign.org/wp-content/uploads/2025/05/Annexes_City-Ranking_Streets-For-Kids-Cities-for-All.pdf
    accessed: 2026-10-06
    language: en
    kind: ngo
    archive_url: https://web.archive.org/web/20260515233944/https://cleancitiescampaign.org/wp-content/uploads/2025/05/Annexes_City-Ranking_Streets-For-Kids-Cities-for-All.pdf
    excerpts:
      - id: protected-def
        text: >-
          Protected cycling infrastructure is defined as any cycling infrastructure that is
          physically segregated (by a barrier, height difference or distance) and thus provides
          protection from motorised traffic, increasing actual and perceived safety.
        gloss_de: "Als geschützte Radinfrastruktur gilt jede Radinfrastruktur, die baulich getrennt ist (durch eine Barriere, einen Höhenunterschied oder Abstand) und so Schutz vor dem Kfz-Verkehr bietet, was die tatsächliche und die empfundene Sicherheit erhöht."
        locator: "Annex 2, Protected cycling infrastructure, Additional information; PDF p.4"
      - id: included
        text: >-
          This includes cycle tracks but also shared foot and bike paths, pedestrian streets or
          greenways. It doesn't include cycle lanes that are painted on the road, nor cycle
          streets, nor living streets or shared spaces, nor shared bus lanes.
        gloss_de: "Dazu gehören Radwege, aber auch gemeinsame Geh- und Radwege, Fußgängerzonen oder Grüne Wege. Nicht dazu gehören auf die Fahrbahn gemalte Radfahrstreifen, Fahrradstraßen, verkehrsberuhigte Bereiche oder Shared Spaces und mit dem Bus geteilte Fahrstreifen."
        locator: "Annex 2, Protected cycling infrastructure, Additional information; PDF p.4"
      - id: osm-fallback
        text: >-
          In absence of official city data, OSM data compiled by the European Cyclists’
          Federation (ECF) was used, following ECF's cycling infrastructure tracker methodology
          selecting OSM objects with key highways and the following values:
        gloss_de: "Fehlten amtliche Daten der Stadt, wurden von der European Cyclists’ Federation (ECF) zusammengestellte OSM-Daten verwendet, nach der Methodik des ECF-Trackers für Radinfrastruktur, der OSM-Objekte mit dem Schlüssel highway und den folgenden Werten auswählt:"
        locator: "Annex 2, Protected cycling infrastructure, Additional information; PDF p.4"
      - id: ratio-not-share
        text: >-
          The figure calculated is a ratio and is comparable to, but not equivalent to, the share
          of the road network that is equipped with protected cycling infrastructure, as not all
          cycling infrastructure is necessarily adjacent to a road.
        gloss_de: "Die berechnete Zahl ist ein Verhältnis und vergleichbar mit dem Anteil des Straßennetzes, der mit geschützter Radinfrastruktur ausgestattet ist, aber nicht gleichbedeutend damit, da nicht jede Radinfrastruktur zwingend an einer Straße liegt."
        locator: "Annex 2, Protected cycling infrastructure, Uncertainties and limitations; PDF p.4"
      - id: city-definitions
        text: >-
          Differences in definitions or methodologies for counting different cycling
          infrastructure types across cities can influence the figures provided by cities.
        gloss_de: "Unterschiedliche Definitionen oder Methoden der Städte beim Zählen verschiedener Arten von Radinfrastruktur können die von den Städten gelieferten Zahlen beeinflussen."
        locator: "Annex 2, Protected cycling infrastructure, Uncertainties and limitations; PDF p.4"
      - id: osm-missing
        text: >-
          Missing OSM data might distort city figures, OSM tagging guidelines might not have been
          applied correctly when mapping.
        gloss_de: "Fehlende OSM-Daten können die Zahlen einer Stadt verzerren; die OSM-Tagging-Richtlinien wurden beim Kartieren möglicherweise nicht richtig angewendet."
        locator: "Annex 2, Protected cycling infrastructure, Uncertainties and limitations; PDF p.4"
      - id: road-network-area
        text: >-
          For this indicator, the entire public road network within the city area has been
          considered.
        gloss_de: "Für diesen Indikator wurde das gesamte öffentliche Straßennetz im Stadtgebiet berücksichtigt."
        locator: "Annex 2, Safe speeds, Additional information (applied to Indicator 3); PDF p.3"
      - id: road-lanes
        text: >-
          The number of lanes or directions on a road does not affect the road network length,
          .i.e. a road with 3 lanes counts for the same as a single-lane road, a two-way street
          the same as a one-way street.
        gloss_de: "Die Zahl der Fahrstreifen oder Fahrtrichtungen einer Straße ändert die Länge des Straßennetzes nicht, d. h. eine Straße mit drei Fahrstreifen zählt genauso wie eine einstreifige Straße und eine Straße mit Gegenverkehr genauso wie eine Einbahnstraße."
        locator: "Annex 2, Safe speeds, Additional information (applied to Indicator 3); PDF p.3"

  - id: cc2025-cycling-table
    publisher: Clean Cities Campaign
    title: "City Ranking 2025: Protected cycling infrastructure table"
    url: https://cleancitiescampaign.org/city-ranking-2025-cycling-infrastructure/
    published: 2025-05-14
    accessed: 2026-10-06
    language: en
    kind: ngo
    archive_url: https://web.archive.org/web/20260728092404/https://cleancitiescampaign.org/city-ranking-2025-cycling-infrastructure/
    excerpts:
      - id: page-def
        text: >-
          In this table, we have ranked cities based on the extent of their protected cycling
          infrastructure – dedicated bike lanes that are physically separated from motor traffic
          to ensure safe and accessible routes for cyclists of all ages.
        gloss_de: "In dieser Tabelle haben wir die Städte nach dem Umfang ihrer geschützten Radinfrastruktur gereiht – eigene Radwege, die baulich vom Kfz-Verkehr getrennt sind, damit Radfahrende jeden Alters sichere und zugängliche Routen haben."
        locator: "Introduction above the table"
      - id: vienna-update
        text: >-
          625.1 km (previously: 384.1 km) of protected cycling infrastructure for a road network
          of 2,844 km
        gloss_de: "625,1 km (vorher 384,1 km) geschützte Radinfrastruktur bei einem Straßennetz von 2.844 km"
        locator: "UPDATE (JULY 2025), City of Vienna"
      - id: vienna-why
        text: >-
          Explanation: A more detailed breakdown of traffic-calmed areas revealed roads with
          restricted motor vehicle access that are part of the cycling network. These have now
          been included.
        gloss_de: "Erklärung: Eine genauere Aufschlüsselung der verkehrsberuhigten Bereiche ergab Straßen mit eingeschränkter Zufahrt für Kraftfahrzeuge, die Teil des Radnetzes sind. Diese wurden nun einbezogen."
        locator: "UPDATE (JULY 2025), City of Vienna"

  - id: qecio-methodology
    publisher: European Cyclists' Federation (ECF)
    title: "Quantifying Europe's Cycling Infrastructure using OSM (QECIO 2.1): Our Methodology (v2.10)"
    url: https://european-cyclists-federation.github.io/Documents/Methodology.pdf
    published: 2024-01-11
    accessed: 2026-10-06
    language: en
    kind: index
    excerpts:
      - id: no-official
        text: >-
          There is a great demand for data on cycling infrastructure, but as for now, no official
          source provides this kind of information on a European scale.
        gloss_de: "Die Nachfrage nach Daten zur Radinfrastruktur ist groß, doch bislang liefert keine amtliche Quelle solche Informationen auf europäischer Ebene."
        locator: "Abstract, p.2"
      - id: nuts3
        text: >-
          We researched 37 European countries, including all 27 EU member states, and the
          information was gathered at NUTS 3 level (Nomenclature of territorial units for
          statistics).
        gloss_de: "Wir haben 37 europäische Länder untersucht, darunter alle 27 EU-Mitgliedstaaten, und die Informationen auf der Ebene NUTS 3 (Systematik der Gebietseinheiten für die Statistik) erhoben."
        locator: "Abstract, p.2"
      - id: clip
        text: >-
          The analysis was performed at NUTS-3 level, clipping the highway per NUTS-3
          administrative boundary.
        gloss_de: "Die Analyse erfolgte auf der Ebene NUTS-3, wobei die Straßen (highway) an der Verwaltungsgrenze jeder NUTS-3-Einheit zugeschnitten wurden."
        locator: "Methodology, Technical details, step 1, p.4"
      - id: directionality
        text: >-
          In some cases, we translated a single highway feature into two cycling infrastructure
          features (for example when cycleway:both is used or cycleway:left and cycleway:right on
          the same highway). For the length calculations, we divided the length of the
          unidirectional cycling infrastructure by two.
        gloss_de: "In manchen Fällen haben wir aus einem einzelnen highway-Objekt zwei Objekte der Radinfrastruktur gemacht (zum Beispiel, wenn cycleway:both oder cycleway:left und cycleway:right an derselben Straße verwendet werden). Für die Längenberechnung haben wir die Länge der Radinfrastruktur in nur einer Fahrtrichtung durch zwei geteilt."
        locator: "Methodology, Technical details, step 4, p.5"
      - id: segregated-set
        text: >-
          The segregated cycling infrastructures considered are cycle tracks, cycle and
          pedestrian tracks and cycle lanes.
        gloss_de: "Als getrennte Radinfrastruktur gelten Radwege, Geh- und Radwege und Radfahrstreifen."
        locator: "Explanation of the indicators, Ratio of segregated cycling infrastructure to the main road network, p.5"
      - id: ratio-100
        text: >-
          About the interpretation of the ratios: ratio of 100 can be roughly interpreted as 100%
          of main roads having bidirectional cycling infrastructure.
        gloss_de: "Zur Deutung der Verhältniszahlen: Ein Verhältnis von 100 lässt sich grob so verstehen, dass 100 % der Hauptstraßen Radinfrastruktur in beiden Richtungen haben."
        locator: "Explanation of the indicators, p.5"
      - id: track-def
        text: >-
          Cycle infrastructure that is separated from motorised traffic by physical
          infrastructure (curbs, grass, etc.) and reserved for exclusive use for cycles.
        gloss_de: "Radinfrastruktur, die durch bauliche Elemente (Bordsteine, Grünstreifen usw.) vom Kfz-Verkehr getrennt und ausschließlich dem Radverkehr vorbehalten ist."
        locator: "Annex II, Table 2, Cycle tracks, Definition, p.15"
      - id: lane-def
        text: >-
          Cycle infrastructure that is an inherent part of the carriageway, set aside for the use
          of bicycles by paint or other markings but without a physical separation from motorised
          traffic.
        gloss_de: "Radinfrastruktur, die fester Bestandteil der Fahrbahn ist und durch Farbe oder andere Markierungen dem Radverkehr vorbehalten ist, aber ohne bauliche Trennung vom Kfz-Verkehr."
        locator: "Annex II, Table 2, Cycle lanes, Definition, p.15"
      - id: shared-def
        text: Track designated (signed) for use by pedestrian and cyclists.
        gloss_de: "Für Fußgänger und Radfahrende ausgewiesener (beschilderter) Weg."
        locator: "Annex II, Table 2, Cycle and pedestrian tracks, Definition, p.15"
      - id: disclaimer
        text: >-
          The data featured in this dashboard only represents OSM contributions. The lower
          numbers may therefore reflect missing OSM data rather than the actual absence of
          cycling infrastructure in each area.
        gloss_de: "Die in diesem Dashboard gezeigten Daten geben nur OSM-Beiträge wieder. Niedrigere Zahlen können daher eher fehlende OSM-Daten widerspiegeln als tatsächlich fehlende Radinfrastruktur im jeweiligen Gebiet."
        locator: "Disclaimer, p.8"

