  - id: osm-wiki-key-cycleway
    publisher: OpenStreetMap Wiki
    title: "Key:cycleway"
    url: https://wiki.openstreetmap.org/wiki/Key:cycleway
    accessed: 2026-10-06
    language: en
    kind: ngo
    excerpts:
      - id: inherent
        text: >-
          The cycleway=* tagging is used on linear features tagged with highway=* to map cycling
          infrastructure that is an inherent part of the road.
        locator: "Introduction"
      - id: sides
        text: >-
          It is advisable to use cycleway tags in combination with side attributes, i.e.
          cycleway:left=*, cycleway:right=* or cycleway:both=* (instead of a simple cycleway=*).
          This clearly indicates which side of the road an infrastructure specification refers
          to.
        locator: "§3 Bicycle infrastructure in one-way roads"

  - id: osm-wiki-cycleway-lane
    publisher: OpenStreetMap Wiki
    title: "Tag:cycleway=lane"
    url: https://wiki.openstreetmap.org/wiki/Tag:cycleway%3Dlane
    accessed: 2026-10-06
    language: en
    kind: ngo
    archive_url: https://web.archive.org/web/20260823021352/https://wiki.openstreetmap.org/wiki/Tag:cycleway%3Dlane
    excerpts:
      - id: def
        text: >-
          A cycle lane is bicycle infrastructure that is an inherent part of the road, but set
          aside for the exclusive use of bicycles, whilst being separated only by paint or other
          markings, and without a physical separation from vehicles.
        locator: "Introduction"
      - id: both-sides
        text: >-
          cycleway=lane is used to tag two-way streets where there are cycle lanes on both sides
          of the road, or sometimes for one-way streets where there is only a lane operating in
          the direction of main traffic flow
        locator: "Introduction"

  - id: osm-wiki-cycleway-track
    publisher: OpenStreetMap Wiki
    title: "Tag:cycleway=track"
    url: https://wiki.openstreetmap.org/wiki/Tag:cycleway%3Dtrack
    accessed: 2026-10-06
    language: en
    kind: ngo
