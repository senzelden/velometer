        gloss_de: "Bis zum 31. Dezember 2027 und danach alle vier Jahre bis zum 31. Dezember übermittelt der Mitgliedstaat Daten zu den im Anhang aufgeführten Indikatoren nach den dort festgelegten Methoden der Datenerhebung."
