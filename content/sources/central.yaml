    excerpts:
      - id: slow-2025
        text: "Rok 2025 se v Praze opět nesl ve znamení pomalého rozvoje cyklistické infrastruktury. Přibyly jen jednotky kilometrů stezek, legalizovaných chodníků a cyklopruhů a tempo zůstalo výrazně nižší než v letech 2021–2023."
        gloss_en: "In Prague, 2025 was again marked by slow development of cycling infrastructure. Only a few kilometres of paths, legalised footways and cycle lanes were added, and the pace remained well below 2021–2023."
        gloss_de: "Auch 2025 stand in Prag im Zeichen einer langsamen Entwicklung der Radinfrastruktur. Hinzu kamen nur wenige Kilometer Wege, für den Radverkehr freigegebene Gehwege und Radfahrstreifen, und das Tempo blieb deutlich unter dem der Jahre 2021–2023."
        locator: "lead paragraph"
      - id: lanes-2025
        text: "Vyhrazených cyklopruhů byl vyznačen 1,1 kilometr, ochranných 6,5 kilometrů."
        gloss_en: "1.1 km of reserved cycle lanes and 6.5 km of advisory (protective) lanes were marked."
        gloss_de: "Markiert wurden 1,1 Kilometer Radfahrstreifen und 6,5 Kilometer Schutzstreifen."
        locator: "article body, paragraph on cycle lanes"
      - id: own-monitoring
        text: "Data prezentovaná v tomto přehledovém článku vycházejí z našeho redakčního monitoringu nové infrastruktury. Je možné, že skutečné počty se mohou mírně lišit."
        gloss_en: "The data in this overview article come from our editorial monitoring of new infrastructure. Actual numbers may differ slightly."
        gloss_de: "Die in diesem Überblicksartikel genannten Daten stammen aus unserem redaktionellen Monitoring neuer Infrastruktur. Die tatsächlichen Zahlen können leicht abweichen."
        locator: "closing note"

  # ---------------------------------------------------------------- bratislava
  - id: bratislava-city-infra-2025
    publisher: Hlavné mesto Slovenskej republiky Bratislava
    title: Cyklistická infraštruktúra v Bratislave sa rozširuje
    url: https://bratislava.sk/spravy/cyklisticka-infrastruktura-v-bratislave-sa-rozsiruje
    published: 2025-12-03
    accessed: 2026-10-06
    language: sk
    kind: official
    archive_url: https://web.archive.org/web/20260429001923/https://www.bratislava.sk/spravy/cyklisticka-infrastruktura-v-bratislave-sa-rozsiruje
    excerpts:
      - id: built-2025
        text: "Mesto investovalo v roku 2025 aj do ďalšieho rozvoja cyklodopravy na svojom území. Vybudovalo 14,2 kilometra novej cyklistickej infraštruktúry vrátane významných projektov popri predĺženej električkovej trati v Petržalke alebo na Dunajskej ulici."
        gloss_en: "In 2025 the city also invested in further development of cycling on its territory. It built 14.2 km of new cycling infrastructure, including major projects along the extended tram line in Petržalka and on Dunajská street."
        gloss_de: "Die Stadt investierte 2025 auch in den weiteren Ausbau des Radverkehrs auf ihrem Gebiet und baute 14,2 Kilometer neue Radinfrastruktur, darunter wichtige Projekte entlang der verlängerten Straßenbahnstrecke in Petržalka und in der Dunajská-Straße."
        locator: "lead paragraph"
      - id: breakdown-total
        text: "Z vyše štrnástich kilometrov, o ktoré sa sieť rozšírila, je 6,9 kilometra samostatných cyklistických komunikácií, 2,2 kilometra ochranných pruhov, 3,6 kilometra spoločného chodníka pre chodcov a cyklistov a 1,5 kilometra bicyklovej cesty. Cyklistická infraštruktúra v meste celkovo meria viac než 205 kilometrov."
        gloss_en: "Of the more than fourteen kilometres by which the network grew, 6.9 km are separate cycle tracks, 2.2 km advisory lanes, 3.6 km shared footpaths for pedestrians and cyclists and 1.5 km bicycle road. Cycling infrastructure in the city measures more than 205 km in total."
        gloss_de: "Von den mehr als vierzehn Kilometern, um die das Netz wuchs, sind 6,9 Kilometer eigenständige Radwege, 2,2 Kilometer Schutzstreifen, 3,6 Kilometer gemeinsame Geh- und Radwege und 1,5 Kilometer Fahrradstraße. Die Radinfrastruktur der Stadt misst insgesamt mehr als 205 Kilometer."
        locator: "article body, second paragraph"
      - id: connected-network
        text: "Týmto prvkom vznikla ucelená sieť s minimálnou dĺžkou deväťdesiat kilometrov."
        gloss_en: "This element created a connected network at least ninety kilometres long."
        gloss_de: "Mit diesem Element entstand ein zusammenhängendes Netz von mindestens neunzig Kilometern Länge."
        locator: "closing paragraph, quote of Stanislav Skýva (city department of walking and cycling)"
  - id: bratislava-sita-akcny-plan-2025
    publisher: SITA (Slovenská tlačová agentúra)
    title: "Bratislava plánuje vybudovať kilometre cyklotrás, chce vytvoriť ucelenú mestskú sieť"
    url: https://sita.sk/nasadoprava/bratislava-planuje-vybudovat-kilometre-cyklotras-a-vytvorit-ucelenu-mestsku-siet/
    published: 2025-04-02
    accessed: 2026-10-06
    language: sk
    kind: press
    archive_url: https://web.archive.org/web/20260120113357/https://sita.sk/nasadoprava/bratislava-planuje-vybudovat-kilometre-cyklotras-a-vytvorit-ucelenu-mestsku-siet/
    excerpts:
      - id: since-2019
        text: "Bratislava od roku 2019 vybudovala približne 50 km nových cyklotrás. Magistrát deklaruje, že len tento rok pribudne ďalších 10 km technicky alebo stavebne oddelených trás, plus ďalšie kilometre vyznačených cyklopruhov."
        gloss_en: "Since 2019 Bratislava has built approximately 50 km of new cycle routes. The city hall says that this year alone a further 10 km of technically or physically separated routes will be added, plus further kilometres of marked cycle lanes."
        gloss_de: "Bratislava hat seit 2019 etwa 50 km neue Radrouten gebaut. Der Magistrat erklärt, dass allein in diesem Jahr weitere 10 km technisch oder baulich getrennte Routen hinzukommen, dazu weitere Kilometer markierter Radfahrstreifen."
        locator: "article body, second paragraph"
      - id: target-2030
        text: "Cieľom stanoveným v dokumente Bratislava 2030 je vytvorenie hlavných mestských cyklotrás tak ako sú zadefinované v Územnom genereli dopravy. „Do roku 2030 by malo byť vybudovaných 180 kilometrov hlavných mestských cyklotrás,“ dodáva magistrát."
        gloss_en: "The goal set in the Bratislava 2030 document is to create the main city cycle routes as defined in the Transport Master Plan. 'By 2030, 180 km of main city cycle routes should be built,' the city hall adds."
        gloss_de: "Ziel des Dokuments Bratislava 2030 ist es, die städtischen Hauptradrouten so zu schaffen, wie sie im Verkehrsentwicklungsplan festgelegt sind. „Bis 2030 sollen 180 Kilometer städtische Hauptradrouten gebaut sein“, ergänzt der Magistrat."
        locator: "article body, closing paragraph"
      - id: not-only-km
        text: "„Rozvoj novej cykloinfraštruktúry nie je len o novopostavených kilometroch. Niekedy dôležitejšie než počet kilometrov je vybudovanie aj relatívne krátkeho nového úseku, ktorý priamo prepojí už existujúce frekventované cyklotrasy,“ poznamenalo mesto"
        gloss_en: "'Developing new cycling infrastructure is not only about newly built kilometres. Sometimes more important than the number of kilometres is building even a relatively short new section that directly connects existing busy cycle routes,' the city noted"
        gloss_de: "„Beim Ausbau neuer Radinfrastruktur geht es nicht nur um neu gebaute Kilometer. Manchmal ist wichtiger als die Zahl der Kilometer, auch einen relativ kurzen neuen Abschnitt zu bauen, der bereits bestehende, stark genutzte Radrouten direkt verbindet“, merkte die Stadt an"
        locator: "article body, third paragraph"
  - id: bratislava-cyklokoalicia-2025
    publisher: Cyklokoalícia
    title: "Bratislava: Čo pribudlo v roku 2025"
    url: https://cyklokoalicia.sk/2026/04/bratislava-co-pribudlo-v-roku-2025/
    published: 2026-04-10
    accessed: 2026-10-06
    language: sk
    kind: ngo
    archive_url: https://web.archive.org/web/20260517032821/https://cyklokoalicia.sk/2026/04/bratislava-co-pribudlo-v-roku-2025/
    excerpts:
      - id: hundreds-of-metres
        text: "Pri pohľade na zoznam za rok 2025 vidíme prírastky v stovkách metrov, nie v kilometroch."
        gloss_en: "Looking at the list for 2025, we see additions in hundreds of metres, not in kilometres."
        gloss_de: "Ein Blick auf die Liste für 2025 zeigt Zuwächse in Hunderten von Metern, nicht in Kilometern."
        locator: "concluding section"
      - id: both-sides
        text: "V katastri Vrakune pribudla nová zmiešaná cestička pre chodcov a cyklistov. Pred jej výstavbou tu chýbali dokonca aj chodníky. Spolu má dĺžku necelý kilometer (na jednej aj druhej strane)."
        gloss_en: "In the Vrakuňa district a new shared path for pedestrians and cyclists was added. Before it was built there were not even footways here. In total it is just under a kilometre long (on one side and the other)."
        gloss_de: "Im Gebiet von Vrakuňa kam ein neuer gemeinsamer Weg für Fußgänger und Radfahrer hinzu. Vor seinem Bau fehlten hier sogar Gehwege. Insgesamt ist er knapp einen Kilometer lang (auf der einen und der anderen Seite)."
        locator: "article body, Vrakuňa item"

