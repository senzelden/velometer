    excerpts:
      - id: friendly-routes
        text: "Urząd miejski w swoim oświadczeniu zaznacza, że poza ujętymi w raporcie drogami rowerowymi, ciągami pieszo-rowerowymi i rowerowymi pasami ruchu, w mieście istnieją też inne trasy „przyjazne rowerzystom”. Urzędnicy szacują ich długość na 1,4 tys. km. Chodzi tu m.in. o kontrapasy i strefy uspokojonego ruchu."
        gloss_en: "In its statement the city hall stresses that besides the cycle tracks, shared footpath/cycle paths and cycle lanes covered by the report, there are other 'cyclist-friendly' routes in the city. Officials estimate their length at 1,400 km. These include contraflow lanes and traffic-calmed zones."
        gloss_de: "Die Stadtverwaltung betont in ihrer Stellungnahme, dass es in der Stadt neben den im Bericht erfassten Radwegen, Geh- und Radwegen und Radfahrstreifen auch andere „radfreundliche“ Routen gibt. Die Beamten schätzen ihre Länge auf 1.400 km. Gemeint sind unter anderem Radfahrstreifen gegen die Einbahnrichtung und verkehrsberuhigte Zonen."
        locator: "article body, paragraph on the city's statement"
