    url: https://www.portalsamorzadowy.pl/inwestycje/sieci-tras-rowerowych-w-miastach-licza-juz-po-kilkaset-kilometrow-znamy-plany-na-2026-rok,641875.html
    published: 2026-01-04
    accessed: 2026-10-06
    language: pl
    kind: press
    archive_url: https://web.archive.org/web/20260618163406/https://www.portalsamorzadowy.pl/inwestycje/sieci-tras-rowerowych-w-miastach-licza-juz-po-kilkaset-kilometrow-znamy-plany-na-2026-rok,641875.html
    excerpts:
      - id: zdm-36-9km
        text: "W informacji z początku grudnia ZDM wskazuje, że w roku 2025 powstało 36,9 km infrastruktury rowerowej, a w trakcie budowy lub za pomocą zmian w organizacji ruchu w trakcie wyznaczania są 23 km różnego rodzaju infrastruktury rowerowej, w tym 18,8 km dróg dla rowerów."
        gloss_en: "In information from early December, ZDM states that 36.9 km of cycling infrastructure were created in 2025, and 23 km of various kinds of cycling infrastructure, including 18.8 km of cycle tracks, are under construction or being marked through traffic-organisation changes."
        gloss_de: "In einer Mitteilung von Anfang Dezember gibt der ZDM an, dass 2025 insgesamt 36,9 km Radinfrastruktur entstanden sind; 23 km Radinfrastruktur verschiedener Art, darunter 18,8 km Radwege, sind im Bau oder werden durch Änderungen der Verkehrsorganisation gerade markiert."
        locator: "section 860 km na koniec roku w Warszawie"
      - id: estimate-860km
        text: "Wówczas nie było jeszcze wiadomo, które z realizowanych prac zakończą się do 31 grudnia, ale zdaniem zarządu szacunkowa łączna długość na koniec 2025 r. to ok. 860 km."
        gloss_en: "At that point it was not yet known which of the works under way would be finished by 31 December, but in the authority's view the estimated total length at the end of 2025 is about 860 km."
        gloss_de: "Damals war noch nicht bekannt, welche der laufenden Arbeiten bis zum 31. Dezember abgeschlossen sein würden, nach Einschätzung der Behörde liegt die geschätzte Gesamtlänge Ende 2025 aber bei etwa 860 km."
        locator: "section 860 km na koniec roku w Warszawie"
