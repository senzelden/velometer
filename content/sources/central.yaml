        gloss_en: "The city hall often boasts of the growing number of kilometres of cycle routes. These numbers, however, do not reflect reality."
        gloss_de: "Die Stadtverwaltung rühmt sich oft der wachsenden Zahl von Kilometern an Radrouten. Diese Zahlen geben die Wirklichkeit jedoch nicht wieder."
        locator: "article body, quote of Jakub Nowotarski (Akcja Miasto)"

