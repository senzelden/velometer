  # -------------------------------------------------------------------- krakow
  - id: krakow-250km-2022
    publisher: Urząd Miasta Krakowa (krakow.pl)
    title: 250 kilometrów infrastruktury rowerowej miasta
    url: https://krakow.pl/aktualnosci/260628,1912,komunikat,250_kilometrow_infrastruktury_rowerowej_miasta.html
    published: 2022-05-31
    accessed: 2026-10-06
    language: pl
    kind: official
    archive_url: https://web.archive.org/web/20220703023127/https://www.krakow.pl/aktualnosci/260628,1912,komunikat,250_kilometrow_infrastruktury_rowerowej_miasta.html
    excerpts:
      - id: from-142-to-250
        text: "W 2014 – roku referendum – w którym krakowianie opowiedzieli się za rozbudową ścieżek rowerowych, miasto miało do dyspozycji wydzieloną infrastrukturę rowerową liczącą 142,5 km. Z biegiem lat oddawane były kolejne kilometry dróg oraz wprowadzano rozwiązania projektowe, które spowodowały, że obecnie do dyspozycji mieszkańców oddanych jest około 250 km."
        gloss_en: "In 2014, the year of the referendum in which Kraków residents voted for expanding cycle paths, the city had 142.5 km of separated cycling infrastructure. Over the years further kilometres were opened and design solutions introduced, so that about 250 km are now available to residents."
        gloss_de: "2014, im Jahr des Referendums, in dem sich die Krakauer für den Ausbau der Radwege aussprachen, verfügte die Stadt über 142,5 km abgetrennte Radinfrastruktur. Im Lauf der Jahre wurden weitere Kilometer Wege freigegeben und planerische Lösungen eingeführt, sodass den Bewohnern heute rund 250 km zur Verfügung stehen."
        locator: "article body, second paragraph"
      - id: per-year
        text: "W 2019 r. powstało ok. 3,7 km ścieżek, w 2020 r. – 5,7 km, w 2021 r. – 0,85 km."
        gloss_en: "About 3.7 km of paths were built in 2019, 5.7 km in 2020 and 0.85 km in 2021."
        gloss_de: "2019 entstanden etwa 3,7 km Wege; 5,7 km waren es im Jahr 2020 und 0,85 km im Jahr 2021."
        locator: "article body, third paragraph"
      - id: definition
        text: "Na szeroko rozumianą infrastrukturę rowerową składają się: drogi dla rowerów, ciągi pieszo-rowerowe, chodniki z dopuszczonym ruchem rowerowym, pasy rowerowe, kontrapasy oraz tzw. kontraruch rowerowy, gdzie dopuszczona jest jazda rowerem „pod prąd” na ulicach jednokierunkowych w strefie uspokojonego ruchu drogowego, czyli z ograniczeniem prędkości do 30 km/h."
        gloss_en: "Cycling infrastructure in the broad sense comprises: cycle tracks, shared footpath/cycle paths, footways where cycling is permitted, cycle lanes, contraflow lanes and so-called contraflow cycling, where riding 'against the flow' is allowed on one-way streets in traffic-calmed zones, i.e. with a 30 km/h limit."
        gloss_de: "Zur Radinfrastruktur im weiteren Sinn gehören: Radwege, Geh- und Radwege, für den Radverkehr freigegebene Gehwege, Radfahrstreifen, Radfahrstreifen gegen die Einbahnrichtung sowie das sogenannte Radfahren gegen die Einbahnrichtung, bei dem das Radfahren „gegen die Fahrtrichtung“ in Einbahnstraßen in verkehrsberuhigten Zonen erlaubt ist, also bei einer Höchstgeschwindigkeit von 30 km/h."
        locator: "article body, fourth paragraph"
  - id: krakow-ztp-plan-2030
    publisher: Zarząd Transportu Publicznego w Krakowie (ZTP)
    title: "Bezpieczna infrastruktura dla pół miliona Krakowian. Zespół rowerowy przedstawia rekomendacje do 2030 roku"
    url: https://ztp.krakow.pl/wszystkie-aktualnosci/rower/bezpieczna-infrastruktura-dla-pol-miliona-krakowian-zespol-rowerowy-przedstawia-rekomendacje-do-2030-roku.html
    published: 2026-09-03
    accessed: 2026-10-06
    language: pl
    kind: official
    archive_url: https://web.archive.org/web/20260905192419/https://ztp.krakow.pl/wszystkie-aktualnosci/rower/bezpieczna-infrastruktura-dla-pol-miliona-krakowian-zespol-rowerowy-przedstawia-rekomendacje-do-2030-roku.html
    excerpts:
      - id: not-only-km
        text: "Nie chcemy mierzyć rozwoju ruchu rowerowego wyłącznie liczbą nowych kilometrów. Najważniejsze ilu mieszkańców dzięki danej inwestycji będzie mogło przejechać swoją trasę bezpiecznie, wygodnie i bez miejsc, w których infrastruktura nagle się kończy."
        gloss_en: "We do not want to measure the development of cycling only by the number of new kilometres. What matters most is how many residents an investment lets ride their route safely, comfortably and without places where the infrastructure suddenly ends."
        gloss_de: "Wir wollen die Entwicklung des Radverkehrs nicht nur an der Zahl neuer Kilometer messen. Am wichtigsten ist, wie viele Bewohner dank einer Investition ihre Strecke sicher, bequem und ohne Stellen fahren können, an denen die Infrastruktur plötzlich endet."
        locator: "article body, quote of Marcin Dumnicki (Kraków Miastem Rowerów), member of the city's cycling team"
      - id: budget-0-6pct
        text: "Propozycją zespołu jest przeznaczanie do 2030 r. na rozwój infrastruktury rowerowej równowartości co najmniej 0,6 proc. budżetu miasta rocznie"
        gloss_en: "The team proposes allocating to cycling infrastructure, until 2030, the equivalent of at least 0.6 percent of the city budget each year"
        gloss_de: "Das Team schlägt vor, bis 2030 jährlich mindestens den Gegenwert von 0,6 Prozent des Stadthaushalts für den Ausbau der Radinfrastruktur bereitzustellen"
        locator: "section Zespół rekomenduje model finansowania, quote of Łukasz Gryga (ZTP deputy director, team chair)"
