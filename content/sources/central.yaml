    accessed: 2026-10-06
    language: hu
    kind: official
    excerpts:
      - id: main-network-800km
        text: "A kerékpárral megtett utazások számának jelentős növeléséhez a teljes budapesti közúthálózatot (alaphálózat, kb. 5500 km) biztonságosan kerékpározhatóvá kell tenni, ezen belül megfelelő sűrűségű és komfortú főhálózat (kb. 800 km) szükséges."
        gloss_en: "To significantly increase the number of trips made by bicycle, the whole Budapest road network (base network, approx. 5,500 km) must be made safely cyclable, and within it a main network of adequate density and comfort (approx. 800 km) is needed."
        gloss_de: "Um die Zahl der mit dem Fahrrad zurückgelegten Wege deutlich zu erhöhen, muss das gesamte Budapester Straßennetz (Grundnetz, etwa 5.500 km) sicher befahrbar werden, und darin ist ein Hauptnetz ausreichender Dichte und ausreichenden Komforts (etwa 800 km) nötig."
        locator: "PDF p. 5, summary findings"
      - id: city-managed-235km
        text: "A Budapest Közút Zrt. által végzett kerékpáros útellenőrzési munka jelenleg 279 fővárosi kezelésű kerékpárútszakaszon és 206 fővárosi kezelésű kerékpársávszakaszon zajlik, melyek összesített hossza 235 kilométer."
        gloss_en: "The cycle-route inspection work carried out by Budapest Közút Zrt. currently covers 279 city-managed cycle track sections and 206 city-managed cycle lane sections, with a combined length of 235 km."
        gloss_de: "Die Kontrolle der Radwege durch die Budapest Közút Zrt. umfasst derzeit 279 Radwegabschnitte und 206 Radfahrstreifenabschnitte in städtischer Verwaltung mit einer Gesamtlänge von 235 Kilometern."
        locator: "PDF p. 27, 1.5.1 Útállapot szerinti minősítés (önálló kerékpárforgalmi létesítmények)"
  - id: budapest-telex-g7-2024
    publisher: Telex (G7)
    title: "Nem látszik, hogy ellenzéki vezetés alatt dübörögne a budapesti kerékpáros fejlesztés"
    url: https://telex.hu/g7/adat/2024/04/12/nem-latszik-hogy-ellenzeki-vezetes-alatt-duborogne-a-budapesti-kerekparos-fejlesztes
    published: 2024-04-12
    accessed: 2026-10-06
    language: hu
    kind: press
    archive_url: https://web.archive.org/web/20260218115808/https://telex.hu/g7/adat/2024/04/12/nem-latszik-hogy-ellenzeki-vezetes-alatt-duborogne-a-budapesti-kerekparos-fejlesztes
    excerpts:
      - id: km-poor-indicator
        text: "A hálózat kilométerben kifejezett hossza pedig valójában nem túl jó mutató, mert például a fővárosban sok helyen egyszerűen a járdára húztak egy-egy sárga vonalat, és ebből lett a kerékpárút, de ez nem nagyon tekinthető minőségi, modern megoldásnak."
        gloss_en: "The length of the network in kilometres is actually not a very good indicator, because in many places in the capital a yellow line was simply painted on the footway and that became the cycle path, which can hardly be considered a quality, modern solution."
        gloss_de: "Die in Kilometern ausgedrückte Länge des Netzes ist eigentlich kein sehr guter Indikator, denn in der Hauptstadt wurde vielerorts einfach eine gelbe Linie auf den Gehweg gezogen, und daraus wurde der Radweg; das kann aber kaum als hochwertige, moderne Lösung gelten."
        locator: "article body, paragraph on data availability"
      - id: kfht-targets
        text: "Ebből az is megtudható, hogy a fővárosban 2022-ben csupán 139 kilométernyi elfogadható színvonalú kerékpárút volt, és ezt szeretnék 2027-ig 292 km-re, majd 2030-ra 504 km-re növelni. További 395 km-t 2030 után valósítanának meg."
        gloss_en: "It also shows that in 2022 the capital had only 139 km of cycle paths of acceptable standard, which they want to increase to 292 km by 2027 and then to 504 km by 2030. A further 395 km would be built after 2030."
        gloss_de: "Daraus geht auch hervor, dass es in der Hauptstadt 2022 nur 139 Kilometer Radwege von annehmbarem Standard gab; diese will man bis 2027 auf 292 km und bis 2030 auf 504 km steigern. Weitere 395 km sollen nach 2030 umgesetzt werden."
        locator: "article body, paragraph on the Kerékpárforgalmi főhálózati terv"
      - id: osm-vs-ksh
        text: "E szerint Budapesten 307 km kerékpárút volt 2024 januárjában, minden formát beleértve. Ez az adat harmadával magasabb, mint a KSH által 2022-ben nyilvántartott 210 km, az eltérés oka abban lehet, hogy az eltérő típusú infrastruktúrákat melyik forrás számolja kerékpárútnak és melyik nem."
        gloss_en: "According to this, Budapest had 307 km of cycle paths in January 2024, all forms included. That figure is a third higher than the 210 km recorded by the statistics office KSH for 2022; the difference may lie in which source counts which types of infrastructure as cycle paths."
        gloss_de: "Danach gab es in Budapest im Januar 2024 insgesamt 307 km Radwege, alle Formen eingeschlossen. Diese Zahl liegt um ein Drittel über den 210 km, die das Statistikamt KSH für 2022 verzeichnete; der Unterschied könnte darin liegen, welche Quelle welche Arten von Infrastruktur als Radweg zählt und welche nicht."
        locator: "article body, paragraph after the ECF city comparison ('E szerint' refers to ECF figures compiled from OpenStreetMap data)"
      - id: bkk-main-network-built
        text: "A 2020-2024 között (azaz a jelenlegi) ciklusban összesen 52 kilométernyi kerékpárforgalmi főhálózati elem épült, ezzel szemben 2015-2019 között (azaz az előző ciklusnak köszönhetően) mindössze 34 kilométer, de 2010-2014 közötti ciklusba is csak 42 km új főhálózat jött létre."
        gloss_en: "In the 2020–2024 (i.e. current) term a total of 52 km of cycle main-network elements were built, against only 34 km in 2015–2019 (the previous term) and only 42 km of new main network in the 2010–2014 term."
        gloss_de: "In der Periode 2020–2024 (also der jetzigen) wurden insgesamt 52 Kilometer Elemente des Radhauptnetzes gebaut, dagegen 2015–2019 (also dank der vorigen Periode) nur 34 Kilometer, und auch in der Periode 2010–2014 entstanden nur 42 km neues Hauptnetz."
        locator: "Frissítés (update) section, statement sent by BKK after publication"

