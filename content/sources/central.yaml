sources:
  # -------------------------------------------------------------------- berlin
  - id: berlin-drs-19-25987
    publisher: Abgeordnetenhaus Berlin (answer of the Senatsverwaltung für Mobilität, Verkehr, Klimaschutz und Umwelt)
    publisher_de: "Abgeordnetenhaus Berlin (Antwort der Senatsverwaltung für Mobilität, Verkehr, Klimaschutz und Umwelt)"
    title: "Schriftliche Anfrage 19/25987: Acht Jahre Mobilitätsgesetz – Zwischen Anspruch und Wirklichkeit im Radverkehr (answer of 20 May 2026)"
    title_de: "Schriftliche Anfrage 19/25987: Acht Jahre Mobilitätsgesetz – Zwischen Anspruch und Wirklichkeit im Radverkehr (Antwort vom 20. Mai 2026)"
    url: https://pardok.parlament-berlin.de/starweb/adis/citat/VT/19/SchrAnfr/S19-25987.pdf
    published: 2026-05-20
    accessed: 2026-10-06
    language: de
    kind: parliament
    excerpts:
      - id: vorrangnetz-target
        text: "Das Radvorrangnetz umfasst als planerisches Zielnetz ca. 870 km Streckenlänge."
        gloss_en: "As a planned target network, the priority cycle network (Radvorrangnetz) comprises approx. 870 km of route length."
        locator: "PDF p. 9 (printed p. 8), Antwort zu 14"
      - id: vorrangnetz-split
        text: "Es verlaufen ca. 350 km des Radvorrangnetzes auf Hauptverkehrsstraßen und mehr als 500 km im Nebennetz."
        gloss_en: "Approx. 350 km of the priority cycle network run along main roads and more than 500 km in the minor street network."
        locator: "PDF p. 9 (printed p. 8), Antwort zu 15"
      - id: vorrangnetz-sum-row
        text: "Summe 14,3 13,6 10,9 9,8"
        gloss_en: "Total 14.3 13.6 10.9 9.8 (km of the priority network implemented in 2022, 2023, 2024, 2025)."
        locator: "PDF p. 10 (printed p. 9), Antwort zu 17, table 'Vorrangnetz', columns 2022 [Km] to 2025 [Km], row Summe"
      - id: ergaenzungsnetz-sum-row
        text: "Summe 10,1 5,1 9,6 7,5"
        gloss_en: "Total 10.1 5.1 9.6 7.5 (km of the supplementary network implemented in 2022, 2023, 2024, 2025)."
        locator: "PDF p. 10 (printed p. 9), Antwort zu 17, table 'Ergänzungsnetz', columns 2022 [Km] to 2025 [Km], row Summe"
      - id: no-road-type-split
        text: "Eine Aufstellung nach Nebenstraßen und Hauptverkehrsstraßen liegt aktuell nicht vor."
        gloss_en: "A breakdown by minor streets and main roads is not currently available."
        locator: "PDF p. 10 (printed p. 9), Antwort zu 17, below the tables"
      - id: vorrangnetz-implemented
        text: "Insgesamt sind 78,2 km des Radvorrangnetzes umgesetzt worden."
        gloss_en: "In total, 78.2 km of the priority cycle network have been implemented."
        locator: "PDF p. 10 (printed p. 9), Antwort zu 18"
  - id: berlin-fortschrittsbericht-2025
    publisher: Senatsverwaltung für Mobilität, Verkehr, Klimaschutz und Umwelt (SenMVKU)
    title: "Fahrrad Berlin – Fortschrittsbericht 2025 (Anlage 1 to Hauptausschuss report rote Nr. 1733 E of 12 August 2026; scanned PDF, excerpts transcribed from the page images)"
    title_de: "Fahrrad Berlin – Fortschrittsbericht 2025 (als Anlage 1 zum Bericht an den Hauptausschuss, rote Nr. 1733 E vom 12. August 2026; gescanntes PDF, Auszüge von den Seitenbildern abgeschrieben)"
    url: https://www.parlament-berlin.de/adosservice/19/Haupt/vorgang/h19-1733.E-v.pdf
    published: 2026-08-12
    accessed: 2026-10-06
    language: de
    kind: official
    excerpts:
      - id: data-basis
        text: "Die in diesem Bericht für das Jahr 2025 dargestellten Analysen zum Ausbau des Radnetzes Berlin basieren überwiegend auf einer verwaltungsübergreifenden, von der GB infraVelo GmbH (infraVelo) betriebenen Projekt-Datenbank „Radverkehr“. Alle Tabellen und Grafiken beziehen sich auf den Stichtag 31.12.2025."
        gloss_en: "The analyses of the expansion of Berlin's cycle network presented in this report for 2025 are based mainly on a cross-administration project database 'Radverkehr' operated by GB infraVelo GmbH. All tables and charts refer to the reference date 31 Dec 2025."
        locator: "PDF p. 8 (report p. 6), 2.1.1 Einführende Erläuterungen, Datenquellen und Stand der dargestellten Informationen"
      - id: scope
        text: "Die für das Jahr 2025 in den folgenden Tabellen, Grafiken und Texten dargestellten Informationen beziehen sich, wenn nicht anders beschrieben, auf die Gesamtheit der umgesetzten bzw. geplanten Radverkehrsmaßnahmen – unabhängig beispielsweise von der Baulastträgerschaft oder der Art der Finanzierung."
        gloss_en: "Unless stated otherwise, the 2025 information in the following tables, charts and texts refers to all implemented or planned cycling measures, regardless of, for example, which authority is responsible for the road or how the measure is financed."
        locator: "PDF p. 8 (report p. 6), 2.1.1, Datenquellen und Stand der dargestellten Informationen"
      - id: revisions
        text: "Es ist in Einzelfällen möglich, dass in der Datenbank Projektinformationen nachträglich korrigiert oder ergänzt werden, so dass die Zahlen im vorliegenden Bericht gegenüber den vorangegangenen Berichten geringfügig abweichen können."
        gloss_en: "In individual cases project information in the database may be corrected or supplemented after the fact, so the figures in this report may differ slightly from those in previous reports."
        locator: "PDF p. 8 (report p. 6), 2.1.1, Datenquellen und Stand der dargestellten Informationen"
      - id: total-2025
        text: "In 2025 wurden insgesamt 21,2 Kilometer Strecke neu gebaut oder verbessert. Zum Jahresende 2025 befanden sich weitere 17,1 Kilometer in Bau/Bauvorbereitung sowie 67,2 Kilometer in Planung."
        gloss_en: "In 2025 a total of 21.2 km of route were newly built or improved. At the end of 2025 a further 17.1 km were under construction or in preparation for construction and 67.2 km were being planned."
        locator: "PDF p. 9 (report p. 7), 2.1.2 Umsetzung des Berliner Radverkehrsnetzes, Gesamtüberblick"
      - id: network-share
        text: "Wie in Tabelle 2 dargestellt wurden von den ca. 870 Kilometern Strecke, die aktuell im Vorrangnetz vorgesehen sind, in 2025 ca. 1 % fertiggestellt, seit 2017 insgesamt knapp 9%. Im aktuellen Ergänzungsnetz sind ca. 1.528 Kilometer Strecke vorgesehen, hiervon konnten in 2025 knapp 0,5% der Strecken fertiggestellt werden, seit 2017 insgesamt ca. 4%."
        gloss_en: "As shown in Table 2, of the approx. 870 km of route currently planned in the priority network, approx. 1% was completed in 2025 and just under 9% in total since 2017. Approx. 1,528 km of route are planned in the current supplementary network; just under 0.5% was completed in 2025 and approx. 4% in total since 2017."
        locator: "PDF pp. 10–11 (report pp. 8–9), 2.1.2, text above Tabelle 2"
      - id: table2-vorrangnetz-row
        text: "Vorrangnetz 870,5 8,6 0,99% 78,2 8,99%"
        gloss_en: "Priority network: 870.5 km in total; 8.6 km (0.99%) completed in 2025; 78.2 km (8.99%) completed 2017 to 2025."
        locator: "PDF p. 11 (report p. 9), Tabelle 2 'In 2025 fertiggestellte Strecken differenziert nach der Zuordnung im Berliner Radverkehrsnetz in Kilometer', row Vorrangnetz (columns Gesamt; Fertiggestellt 2025 km, %; Fertiggestellt 2017 bis 2025 km, %)"
      - id: table2-radverkehrsnetz-row
        text: "Radverkehrsnetz 2.398,3 16,1 0,67% 140,1 5,84%"
        gloss_en: "Cycle network (priority plus supplementary): 2,398.3 km in total; 16.1 km (0.67%) completed in 2025; 140.1 km (5.84%) completed 2017 to 2025."
        locator: "PDF p. 11 (report p. 9), Tabelle 2, row Radverkehrsnetz"
      - id: table2-summe-row
        text: "Summe 2.948,3 21,2 0,72% 173,9 5,90%"
        gloss_en: "Total (cycle network, main roads outside it and other routes): 2,948.3 km; 21.2 km (0.72%) completed in 2025; 173.9 km (5.90%) completed 2017 to 2025."
        locator: "PDF p. 11 (report p. 9), Tabelle 2, row Summe"
      - id: osm-survey
        text: "Diese Bestandserhebung der Radinfrastruktur im Vorrangnetz wurde auf Grundlage von Open Street Maps-Daten durchgeführt und lag der Senatsverwaltung für Mobilität, Verkehr, Klimaschutz und Umwelt (SenMVKU) zum Jahreswechsel 2025/2026 vor."
        gloss_en: "This inventory survey of the cycling infrastructure in the priority network was carried out on the basis of OpenStreetMap data and was available to the Senate Department (SenMVKU) at the turn of 2025/2026."
        locator: "PDF p. 11 (report p. 9), 2.1.2, Priorisierungskonzept"
  - id: berlin-fortschrittsbericht-2024
    publisher: Senatsverwaltung für Mobilität, Verkehr, Klimaschutz und Umwelt (SenMVKU)
    title: "Fahrrad Berlin – Fortschrittsbericht 2024 (sent to the Hauptausschuss on 24 June 2025, rote Nr. 1733 C)"
    title_de: "Fahrrad Berlin – Fortschrittsbericht 2024 (am 24. Juni 2025 an den Hauptausschuss übersandt, rote Nr. 1733 C)"
    url: https://www.berlin.de/sen/uvk/_assets/verkehr/verkehrsplanung/radverkehr/radprojekte/radfortschrittsbericht/fortschrittsbericht-fahrrad-2024.pdf
    accessed: 2026-10-06
    language: de
    kind: official
    excerpts:
      - id: reference-date
        text: "Alle Tabellen und Grafiken beziehen sich auf den Stichtag 31. Dezember 2024. Im Jahr 2025 abgeschlossene oder begonnene Maßnahmen sind nicht berücksichtigt."
        gloss_en: "All tables and charts refer to the reference date 31 December 2024. Measures completed or started in 2025 are not included."
        locator: "p. 5, 2.1.1 Einführende Erläuterungen, Datenquellen und Stand der dargestellten Informationen"
      - id: total-2024
        text: "In 2024 wurden insgesamt 23,6 Kilometer Strecke neu gebaut oder verbessert. Zum Jahresende 2024 befanden sich weitere 24,3 Kilometer in Bau/Bauvorbereitung sowie 84,9 Kilometer in Planung."
        gloss_en: "In 2024 a total of 23.6 km of route were newly built or improved. At the end of 2024 a further 24.3 km were under construction or in preparation for construction and 84.9 km were being planned."
        locator: "p. 5, 2.1.2 Umsetzung des Berliner Radverkehrsnetzes"
      - id: network-share
        text: "Wie in Tabelle 2 dargestellt wurden von den 872 Kilometern Strecke, die im Vorrangnetz vorgesehen sind, in 2024 circa 1,2 Prozent fertiggestellt, seit 2022 insgesamt 4,5 Prozent. Im Ergänzungsnetz sind 1.507 Kilometer Strecke vorgesehen, hiervon konnten in 2024 0,6 Prozent der Strecken fertiggestellt werden, seit 2022 insgesamt 1,5 Prozent."
        gloss_en: "As shown in Table 2, of the 872 km of route planned in the priority network, about 1.2 percent was completed in 2024 and 4.5 percent in total since 2022. The supplementary network plans 1,507 km of route; 0.6 percent of it was completed in 2024 and 1.5 percent in total since 2022."
        locator: "p. 7, 2.1.2, text above Tabelle 2"
      - id: quality-standards
        text: "Im Ergebnis zeigt sich, dass von den 2024 im Vorrangnetz (ohne Berliner Stadtgrün) umgesetzten Strecken bei 78 Prozent der Streckenlänge (8,4 von 10,8 Kilometern) die Qualitätsstandards des Radverkehrsplans eingehalten werden konnten."
        gloss_en: "The result shows that of the routes implemented in the priority network in 2024 (excluding Berlin's green spaces), the quality standards of the cycling plan were met on 78 percent of the route length (8.4 of 10.8 km)."
        locator: "p. 11, 2.2.3 Qualitätsstandards"
  - id: berlin-radverkehrsplan-2021
    publisher: Senatsverwaltung für Umwelt, Mobilität, Verbraucher- und Klimaschutz
    title: Radverkehrsplan des Landes Berlin (2021)
    url: https://www.berlin.de/sen/uvk/_assets/verkehr/verkehrsplanung/radverkehr/radverkehrsplan/radverkehrsplan.pdf
    accessed: 2026-10-06
    language: de
    kind: official
    archive_url: https://web.archive.org/web/20260104153351/https://www.berlin.de/sen/uvk/_assets/verkehr/verkehrsplanung/radverkehr/radverkehrsplan/radverkehrsplan.pdf
    excerpts:
      - id: not-in-table-3
        text: "In Tabelle 3 nicht dargestellt sind 553 Kilometer Hauptverkehrsstraßen (Stufen I–III) außerhalb des Berliner Radverkehrsnetzes, die gemäß § 43 MobG BE ebenfalls mit sicheren Radverkehrsanlagen ausgestattet werden sollen. Weiterhin nicht dargestellt sind rund 388 Kilometer Radfernwege (inklusive Berliner Mauerweg)."
        gloss_en: "Not shown in Table 3 are 553 km of main roads (levels I–III) outside the Berlin cycle network, which under § 43 of the Mobility Act are also to be equipped with safe cycling facilities. Also not shown are around 388 km of long-distance cycle routes (including the Berlin Wall Trail)."
        locator: "PDF p. 13, below Tabelle 3 'Übersicht der Netzelemente des Radverkehrsnetzes Berlin mit den ermittelten Längen' (Radvorrangnetz 865, Ergänzungsnetz 1.506, Gesamtlänge 2.371 km)"
      - id: vorrangnetz-865
        text: "Das Ergebnis ist ein Radvorrangnetz (Entwurfsstand 07. Juni 2021), welches bei einer Länge von 865 Kilometern 80 Prozent der Bevölkerung sowie Arbeits- und Ausbildungsplätze im 400-Meter-Einzugsbereich erreicht."
        gloss_en: "The result is a priority cycle network (draft of 7 June 2021) which, at a length of 865 km, reaches 80 percent of the population and of workplaces and training places within a 400-metre catchment."
        locator: "PDF p. 16, derivation of the Radvorrangnetz"
      - id: deadline-2030
        text: "Das Radverkehrsnetz Berlin soll gemäß § 41 Absatz 4 MobG BE bis 2030 realisiert werden."
        gloss_en: "Under § 41(4) of the Berlin Mobility Act, the Berlin cycle network is to be realised by 2030."
        locator: "PDF p. 19, 2.3.4 Umsetzung des Radverkehrsnetzes Berlin"
  - id: berlin-radverkehrsplan-page
    publisher: Senatsverwaltung für Mobilität, Verkehr, Klimaschutz und Umwelt
    title: Radverkehrsplan (berlin.de web page)
    title_de: "Radverkehrsplan (Webseite auf berlin.de)"
    url: https://www.berlin.de/sen/uvk/mobilitaet-und-verkehr/verkehrsplanung/radverkehr/radverkehrsplan/
    accessed: 2026-10-06
    language: de
    kind: official
    archive_url: https://web.archive.org/web/20260920192813/https://www.berlin.de/sen/uvk/mobilitaet-und-verkehr/verkehrsplanung/radverkehr/radverkehrsplan/
    excerpts:
      - id: network-length
        text: "Unter anderem definiert der Plan ein engmaschiges Radverkehrsnetz mit einer Länge von insgesamt 2.371 Kilometern, davon 865 Kilometern Vorrangnetz, mit entsprechenden Qualitätsstandards."
        gloss_en: "Among other things, the plan defines a close-meshed cycle network with a total length of 2,371 km, of which 865 km is priority network, with corresponding quality standards."
        locator: "main text, second paragraph"
      - id: modal-share-target
        text: "Der Radverkehrsanteil soll bis 2030 von 18 Prozent im Jahr 2018 auf mindestens 23 Prozent steigen."
        gloss_en: "Cycling's share of trips is to rise from 18 percent in 2018 to at least 23 percent by 2030."
        locator: "main text, fourth paragraph"
  - id: berlin-radverkehrsnetz-page
    publisher: Senatsverwaltung für Mobilität, Verkehr, Klimaschutz und Umwelt
    title: Radverkehrsnetz (berlin.de web page)
    title_de: "Radverkehrsnetz (Webseite auf berlin.de)"
    url: https://www.berlin.de/sen/uvk/mobilitaet-und-verkehr/verkehrsplanung/radverkehr/radverkehrsnetz/
    accessed: 2026-10-06
    language: de
    kind: official
    archive_url: https://web.archive.org/web/20260812123359/https://www.berlin.de/sen/uvk/mobilitaet-und-verkehr/verkehrsplanung/radverkehr/radverkehrsnetz/
    excerpts:
      - id: deadline-2030
        text: "Das Radverkehrsnetz soll bis 2030 umgesetzt werden. Es ersetzt nicht die erforderliche Planungsarbeit der Baubehörden, sondern bildet deren konzeptionelle Grundlage."
        gloss_en: "The cycle network is to be implemented by 2030. It does not replace the necessary planning work of the construction authorities but forms its conceptual basis."
        locator: "intro text, fourth paragraph (page still states 2030 for the whole network on 2026-10-06)"
      - id: target-network
        text: "Die interaktive Karte zeigt den straßenscharfen Verlauf des planerischen Zielnetzes."
        gloss_en: "The interactive map shows the street-accurate course of the planned target network."
        locator: "section Netzumfang und Karte"
  - id: berlin-mobg-amendment-2026
    publisher: Land Berlin, Gesetz- und Verordnungsblatt für Berlin
    title: "Drittes Gesetz zur Änderung des Berliner Mobilitätsgesetzes vom 9. Juli 2026 (GVBl. 82. Jg., Nr. 25, 22 July 2026, p. 713)"
    title_de: "Drittes Gesetz zur Änderung des Berliner Mobilitätsgesetzes vom 9. Juli 2026 (GVBl. 82. Jg., Nr. 25, 22. Juli 2026, S. 713)"
    url: https://pardok.parlament-berlin.de/starweb/adis/citat/VT/19/gvbl/g26250713.pdf
    published: 2026-07-22
    accessed: 2026-10-06
    language: de
    kind: official
    excerpts:
      - id: deadline-2030-2035
        text: "„(4) Die Herstellung des Radvorrangnetzes und dessen Beschilderung soll bis zum Jahr 2030 und die des Nebennetzes bis 2035 erfolgen.“"
        gloss_en: "'(4) The priority cycle network and its signage are to be completed by 2030, and the secondary network by 2035.'"
        locator: "p. 714, Artikel 1 Nr. 16 b) (new wording of § 41 Absatz 4 MobG)"
      - id: main-roads-exception
        text: "Von der Einrichtung einer Radverkehrsanlage kann ganz abgesehen werden, soweit sie aus örtlichen Gegebenheiten und unter Berücksichtigung des § 25 Absatz 2 nicht sachgerecht eingerichtet werden kann, oder eine qualifizierte alternative Strecken- oder Wegeführung auf Nebenstraßen im unmittelbaren Umfeld vorhanden ist."
        gloss_en: "A cycling facility may be dispensed with entirely where, given local conditions and taking § 25(2) into account, it cannot properly be provided, or where a qualified alternative route on minor streets exists in the immediate vicinity."
        locator: "p. 714, Artikel 1 Nr. 18 (new wording of § 43 Absatz 1 MobG, on main roads)"
  - id: berlin-dpa-fortschrittsbericht-2025
    publisher: Nordkurier (dpa)
    title: "Bericht: Senat ließ viele Mittel für Radverkehr liegen (dpa report on the Senate's Fahrrad-Fortschrittsbericht 2025)"
    title_de: "Bericht: Senat ließ viele Mittel für Radverkehr liegen (dpa-Meldung zum Fahrrad-Fortschrittsbericht 2025 des Senats)"
    url: https://www.nordkurier.de/regional/brandenburg/bericht-senat-liess-viele-mittel-fuer-radverkehr-liegen-4840670
    published: 2026-09-08
    accessed: 2026-10-06
    language: de
    kind: press
    archive_url: https://web.archive.org/web/20260917224849/https://www.nordkurier.de/regional/brandenburg/bericht-senat-liess-viele-mittel-fuer-radverkehr-liegen-4840670
    excerpts:
      - id: km-2025
        text: "Das hatte zur Folge, dass mit 21,2 Kilometern deutlich weniger neue Fahrradwege fertiggestellt wurden als in den Vorjahren. 2022 waren es noch 32,4 Kilometer, seither ist die Länge jedes Jahr gesunken."
        gloss_en: "As a result, at 21.2 km, significantly fewer new cycle paths were completed than in previous years. In 2022 it was still 32.4 km, and the length has fallen every year since."
        locator: "article body, fourth paragraph"
      - id: network-share
        text: "Von den 2.400 Kilometern Strecke, die aktuell im Berliner Radverkehrsnetz vorgesehen sind, wurden zwischen 2017 und 2025 lediglich gut 140 Kilometer oder rund 5,8 Prozent fertiggestellt."
        gloss_en: "Of the 2,400 km of route currently planned in the Berlin cycle network, only a good 140 km, or around 5.8 percent, were completed between 2017 and 2025."
        locator: "article body, sixth paragraph"
  - id: berlin-tagesspiegel-dpa-2025-12
    publisher: Der Tagesspiegel (dpa)
    title: "Senat verfehlt eigenes Ziel: In diesem Jahr wurden nur 20,5 Kilometer neue Radwege in Berlin gebaut (dpa; Senate figure given on request, before year end)"
    title_de: "Senat verfehlt eigenes Ziel: In diesem Jahr wurden nur 20,5 Kilometer neue Radwege in Berlin gebaut (dpa; Zahl des Senats auf Anfrage, vor Jahresende)"
    url: https://www.tagesspiegel.de/berlin/senat-hangt-eigenem-ziel-hinterher-205-kilometer-neue-radwege-in-berlin-gebaut-15065944.html
    published: 2025-12-19
    accessed: 2026-10-06
    language: de
    kind: press
    archive_url: https://web.archive.org/web/20260212055904/https://www.tagesspiegel.de/berlin/senat-hangt-eigenem-ziel-hinterher-205-kilometer-neue-radwege-in-berlin-gebaut-15065944.html
    excerpts:
      - id: preliminary-2025
        text: "Im laufenden Jahr wurden 35 Radwege-Projekte mit einer Gesamtlänge von 20,5 Kilometern gebaut, teilte die Senatsverwaltung für Verkehr auf Anfrage der Deutschen Presse-Agentur mit."
        gloss_en: "This year, 35 cycle path projects with a total length of 20.5 km were built, the Senate transport department told the German Press Agency on request."
        locator: "article body, first paragraph"
      - id: incomplete-caveat
        text: "Allerdings weist die Verwaltung darauf hin, dass in der Bilanz möglicherweise noch nicht alle tatsächlich umgesetzten Baumaßnahmen berücksichtigt sind."
        gloss_en: "However, the administration points out that the tally may not yet include all construction measures actually carried out."
        locator: "article body, second paragraph"
      - id: km-2022
        text: "Im Jahr 2022 waren unter der grünen Verkehrssenatorin Bettina Jarasch rund 26,5 Kilometer Radwege hinzugebaut worden."
        gloss_en: "In 2022, under the Green transport senator Bettina Jarasch, around 26.5 km of cycle paths had been added."
        locator: "section Senat verpasst eigenes Ziel erneut"
  - id: berlin-changing-cities-monitor
    publisher: Changing Cities e.V.
    title: Verkehrswende-Monitor (Radnetz monitoring, as of 31 Dec 2025)
    title_de: "Verkehrswende-Monitor (Radnetz-Monitoring, Stand 31. Dezember 2025)"
    url: https://changing-cities.org/kampagnen/verkehrswende-monitor/
    accessed: 2026-10-06
    language: de
    kind: ngo
    archive_url: https://web.archive.org/web/20260803122927/https://changing-cities.org/kampagnen/verkehrswende-monitor/
    excerpts:
      - id: target-network
        text: "2.699,8 Kilometer: So lang soll das Berliner Radnetz bis 2030 sein."
        gloss_en: "2,699.8 km: that is how long the Berlin cycle network is to be by 2030."
        locator: "section Das Radnetz, counter tile"
      - id: built-since-2018
        text: "183,6 Kilometer wurden seit 2018 gebaut. Das sind 6,8 % des Gesamtnetzes."
        gloss_en: "183.6 km have been built since 2018. That is 6.8% of the total network."
        locator: "section Das Radnetz, counter tile"
      - id: own-measurement
        text: "Wir messen selbst nach! Diese Zahl bezieht sich auf den Stichtag 31.12.2025."
        gloss_en: "We measure it ourselves! This figure refers to the reference date 31 Dec 2025."
        locator: "section Das Radnetz, counter tile note"
      - id: km-2025
        text: "25,2 Kilometer wurden 2025 neu geschaffen. Der Radnetzausbau stagniert auf niedrigem Niveau."
        gloss_en: "25.2 km were newly created in 2025. The expansion of the cycle network is stagnating at a low level."
        locator: "section Das Radnetz, counter tile"

  # -------------------------------------------------------------------- vienna
  - id: vienna-radverkehrsnetz-fakten
    publisher: Stadt Wien – Verkehrsorganisation und technische Verkehrsangelegenheiten
    title: Zahlen und Fakten zum Wiener Radverkehrsnetz
    url: https://www.wien.gv.at/verkehr/radverkehrsnetz-radwege-statistiken
    published: 2026-01-21
    accessed: 2026-10-06
    language: de
    kind: official
    archive_url: https://web.archive.org/web/20260608054721/https://www.wien.gv.at/verkehr/radverkehrsnetz-radwege-statistiken
    excerpts:
      - id: definition
        text: "Das Radverkehrsnetz umfasst sämtliche Radverkehrsanlagen in Wien. Seit dem Jahr 2018 werden die tatsächlichen Längen der verschiedenen Anlagearten gezählt, womit auch (unterschiedliche) Anlagen auf beiden Seiten einer Straße erfasst werden. Derzeit beträgt die Länge des Radverkehrsnetzes in Wien circa 1.811 Kilometer."
        gloss_en: "The cycle network comprises all cycling facilities in Vienna. Since 2018 the actual lengths of the different facility types have been counted, so that (different) facilities on both sides of a street are also recorded. The cycle network in Vienna is currently about 1,811 km long."
        locator: "section Netzlänge (page last updated 21.01.2026)"
      - id: types-separate
        text: "Radwege: 211,1 Kilometer Getrennte Geh- und Radwege: 47,7 Kilometer Gemischte Geh- und Radwege: 128,2 Kilometer Radfahrstreifen: 43,5 Kilometer Mehrzweckstreifen: 134,6 Kilometer"
        gloss_en: "Cycle tracks: 211.1 km; separated footpath/cycle tracks: 47.7 km; shared footpath/cycle tracks: 128.2 km; cycle lanes: 43.5 km; advisory (multi-purpose) lanes: 134.6 km."
        locator: "section Anlagearten, list items 1–5"
      - id: types-mixed
        text: "Radfahren gegen die Einbahn: 365,8 Kilometer Radfahren auf der Busspur: 20,1 Kilometer Radroute: 259,7 Kilometer"
        gloss_en: "Contraflow cycling in one-way streets: 365.8 km; cycling in bus lanes: 20.1 km; cycle route: 259.7 km."
        locator: "section Anlagearten, list items 8–10"
      - id: types-calmed
        text: "Wohnstraße: 44,8 Kilometer Verkehrsberuhigter Bereich: 411,3 Kilometer Radfahren im Gelände: 81,5 Kilometer"
        gloss_en: "Residential street: 44.8 km; traffic-calmed area: 411.3 km; cycling off-road: 81.5 km."
        locator: "section Anlagearten, list items 12–14"
  - id: vienna-radwegeausbau-bilanz-2025
    publisher: Mobilitätsagentur Wien GmbH (fahrradwien.at)
    title: Bilanz Radwegeausbau 2025 (Radwegoffensive 2025)
    url: https://www.fahrradwien.at/wp-content/uploads/sites/2/2026/01/Radwegoffensive_2025_Bilanz.pdf
    accessed: 2026-10-06
    language: de
    kind: official
    archive_url: https://web.archive.org/web/20260209232301/https://www.fahrradwien.at/wp-content/uploads/sites/2/2026/01/Radwegoffensive_2025_Bilanz.pdf
    excerpts:
      - id: header
        text: "Bilanz Radwegeausbau 2025 53 Projekte 20.447 m Länge"
        gloss_en: "Cycle path expansion tally 2025: 53 projects, 20,447 m length."
        locator: "p. 1, document header"
      - id: started-not-completed
        text: "Die Bilanz zum Radwegeausbau 2025 enthält 53 Radinfrastrukturprojekte im Hauptradverkehrsnetz, mit deren Realisierung im Jahr 2025 begonnen wurde. Es handelt sich um 20,4 Kilometer, die im Jahr 2025 gestartet wurden."
        gloss_en: "The 2025 cycle path tally contains 53 cycling infrastructure projects in the main cycle network whose realisation began in 2025. They amount to 20.4 km started in 2025."
        locator: "p. 1, Erläuterungen zur Methodik"
      - id: all-types
        text: "Es werden alle Typen von Radverkehrsanlagen gezählt, d.h. baulich getrennte Radwege, Geh- und Radwege, Fahrradstraßen etc."
        gloss_en: "All types of cycling facility are counted, i.e. physically separated cycle tracks, footpath/cycle tracks, cycle streets etc."
        locator: "p. 1, Erläuterungen zur Methodik"
      - id: measurement
        text: "Die Längen der Projekte werden im digitalen Stadtplan der Stadt Wien gemessen. Die Messung der Radfahranlagen erfolgt von Beginn bis Endpunkt, dabei wird jede Radfahranlage für sich gezählt. Projekte zur Verbesserung von Kreuzungen fließen im Sinne eines Knotenpunktes mit einem Meter in die Bilanz mit ein."
        gloss_en: "Project lengths are measured in the City of Vienna's digital city map. Cycling facilities are measured from start to end point, and each facility is counted separately. Projects improving junctions enter the tally as a node with one metre."
        locator: "p. 1, Erläuterungen zur Methodik"
      - id: excluded
        text: "Sanierungsarbeiten im Bestand, wie etwa Belagsverbesserungen, werden in der Bilanz nicht gezählt."
        gloss_en: "Renovation of existing facilities, such as surface improvements, is not counted in the tally."
        locator: "p. 1, Erläuterungen zur Methodik"
  - id: vienna-orf-radwegenetz-2025
    publisher: ORF Wien (wien.ORF.at)
    title: Radwegenetz soll heuer um 24 Kilometer wachsen
    url: https://wien.orf.at/stories/3296850/
    published: 2025-03-13
    accessed: 2026-10-06
    language: de
    kind: press
    archive_url: https://web.archive.org/web/20260706134018/https://wien.orf.at/stories/3296850/
    excerpts:
      - id: plan-2025
        text: "Mehr als 50 Projekten will man sich 2025 widmen, wobei bei einigen erst der Auftakt erfolgt, andere hingegen schon abgeschlossen werden. Insgesamt soll es rund 24 Kilometer neue Radwege geben."
        gloss_en: "More than 50 projects are to be tackled in 2025; some will only be started, others completed. In total there are to be around 24 km of new cycle paths."
        locator: "lead paragraph"
      - id: legislature-100km
        text: "Insgesamt, so wurde heute hervorgehoben, wurden in dieser – demnächst endenden – Legislaturperiode rund 100 Kilometer neue Radinfrastruktur auf den Weg gebracht."
        gloss_en: "In total, it was emphasised today, around 100 km of new cycling infrastructure were set in motion in this legislative period, which is about to end."
        locator: "article body, penultimate section"
