        text: >-
          Det foreslås, at Borgerrepræsentationen pålægger Teknik- og Miljøudvalget, at det i
          arbejdet med at revidere planer, politikker og strategier indenfor teknik- og
          miljøområdet, indgår at Københavns Kommune får en ny stærk cykelstrategi
        gloss_en: >-
          It is proposed that the City Council instructs the Technical and Environmental
          Committee that, in revising plans, policies and strategies in the technical and
          environmental field, the City of Copenhagen gets a new, strong cycling strategy
        gloss_de: "Es wird vorgeschlagen, dass die Bürgerschaft (Borgerrepræsentationen) den Ausschuss für Technik und Umwelt beauftragt, bei der Überarbeitung von Plänen, Politiken und Strategien im Bereich Technik und Umwelt einzubeziehen, dass die Kommune Kopenhagen eine neue, starke Radverkehrsstrategie erhält"
