    excerpts:
      - id: control
        text: >-
          Anfragen des Abgeordnetenhauses an den Senat sind ein wichtiges Mittel zur Ausübung der
          parlamentarischen Kontrolle (Kontrollrecht).
        gloss_en: >-
          Questions from the Abgeordnetenhaus to the Senate are an important means of exercising
          parliamentary control (right of scrutiny).
        locator: "Das Fragerecht, first sentence"
      - id: written-answer
        text: Der Senat beantwortet die Anfrage schriftlich. Die Antwort soll innerhalb von drei Wochen erfolgen.
        gloss_en: The Senate answers the question in writing. The answer is due within three weeks.
        locator: "Das Fragerecht"
      - id: pardok
        text: >-
          Alle Schriftlichen Anfragen sind darüber hinaus dauerhaft in der
          Parlamentsdokumentation (PARDOK) abrufbar.
        gloss_en: All written questions are also permanently available in the parliamentary documentation system (PARDOK).
        locator: "Section Anfragen"
  - id: agh-arbeitsweise
    publisher: Abgeordnetenhaus Berlin
    title: Aufgaben und Arbeitsweise des Parlaments
    url: https://www.parlament-berlin.de/das-parlament/arbeitsweise
    accessed: 2026-10-07
    language: de
    kind: parliament
    excerpts:
      - id: budget
        text: >-
          Eine herausragende Rolle spielt hierbei das Haushaltsgesetz, in dem jeweils für ein
          Jahr oder zwei Jahre bestimmt wird, für welche Zwecke die vor allem aus
          Steuereinnahmen gewonnenen Gelder ausgegeben werden sollen.
        gloss_en: >-
          The budget act plays an outstanding role here; it determines, for one or two years at a
          time, the purposes for which the money raised mainly from taxes is to be spent.
        locator: "Aufgaben und Arbeitsweise des Parlaments, second paragraph"
      - id: control
        text: Die dritte große Aufgabe liegt in der Kontrolle der Regierung.
        gloss_en: The third major task is scrutiny of the government.
        locator: "Aufgaben und Arbeitsweise des Parlaments, fourth paragraph"
  - id: infravelo-ueber-uns
    publisher: GB infraVelo GmbH
    title: Über uns
    url: https://www.infravelo.de/ueber-uns/
    accessed: 2026-10-07
    language: de
    kind: official
    excerpts:
      - id: founded
        text: >-
          infraVelo wurde Mitte 2017 im Auftrag der Senatsverwaltung für Umwelt, Verkehr und
          Klimaschutz (seit Mai 2023 "Senatsverwaltung für Mobilität, Verkehr, Klimaschutz und
          Umwelt") gegründet.
        gloss_en: >-
          infraVelo was founded in mid-2017 on behalf of the Senate Department for the
          Environment, Transport and Climate Protection (since May 2023 the 'Senate Department
          for Mobility, Transport, Climate Protection and the Environment').
        locator: "Section Wer wir sind"
      - id: subsidiary
        text: Wir sind ein 100%iges Tochterunternehmen der landeseigenen Grün Berlin GmbH.
        gloss_en: We are a wholly owned subsidiary of the state-owned Grün Berlin GmbH.
        locator: "Section Wer wir sind"
  - id: infravelo-organisation
    publisher: GB infraVelo GmbH
    title: Organisation (Unternehmensstruktur und Organe der Gesellschaft)
    url: https://www.infravelo.de/ueber-uns/organisation/
    accessed: 2026-10-07
    language: de
    kind: official
    excerpts:
      - id: priorities
        text: Die inhaltliche Ausrichtung und Priorisierung unserer Projekte obliegt der SenMVKU.
        gloss_en: The substantive direction and prioritisation of our projects lie with SenMVKU.
        locator: "Section Senatsverwaltung für Mobilität, Verkehr, Klimaschutz und Umwelt"
      - id: responsibility
        text: >-
          Die Zuständigkeit für die Radverkehrsinfrastruktur in Berlin liegt bei der SenMVKU und
          bei den Bezirken.
        gloss_en: Responsibility for cycling infrastructure in Berlin lies with SenMVKU and the districts.
        locator: "Section Senatsverwaltung für Mobilität, Verkehr, Klimaschutz und Umwelt"
  - id: infravelo-faq
    publisher: GB infraVelo GmbH
    title: Fragen und Antworten
    url: https://www.infravelo.de/ueber-uns/fragen-und-antworten/
    accessed: 2026-10-07
    language: de
    kind: official
    excerpts:
      - id: funding
        text: infraVelo erhält Zuweisungen aus dem öffentlichen Haushalt des Landes Berlin.
        gloss_en: infraVelo receives allocations from the public budget of the Land Berlin.
        locator: "Wie finanziert sich infraVelo?"
      - id: no-own-projects
        text: >-
          infraVelo initiiert keine Projekte, sondern nimmt Projektsteuerungs-,
          Projektmanagement-, Baumanagement- und Bauherrenaufgaben wahr, die infraVelo zuvor von
          der Senatsverwaltung für Mobilität, Verkehr, Klimaschutz und Umwelt (SenMVKU)
          übertragen wurden.
        gloss_en: >-
          infraVelo does not initiate projects; it carries out project control, project
          management, construction management and client tasks previously assigned to it by
          SenMVKU.
        locator: "Entwickelt oder initiiert infraVelo auch eigenständig Projekte?"
      - id: database
        text: >-
          infraVelo übernimmt seit Januar 2020 wichtige Funktionen bei der Projektsteuerung von
          bezirklichen Maßnahmen: Mit der Führung einer zentralen Datenbank aller
          Radverkehrsmaßnahmen in Berlin werden die Projekte vor allem hinsichtlich ihrer
          Terminierung und Finanzen überwacht.
        gloss_en: >-
          Since January 2020 infraVelo has taken on key functions in steering district measures:
          by keeping a central database of all cycling measures in Berlin, the projects are
          monitored above all for scheduling and finances.
        locator: "Welche Projekte sind auf der Projektkarte zu sehen?"
      - id: quarterly
        text: >-
          In der Datenbank werden Informationen zu den Radverkehrsmaßahmen aller Berliner Bezirke
          zentral erfasst und von den Projektverantwortlichen in den Bezirken quartalsweise
          aktualisiert.
        gloss_en: >-
          The database records information on the cycling measures of all Berlin districts
          centrally; the project leads in the districts update it quarterly.
        locator: "Was ist der Zweck der bezirklichen Datenbank?"
      - id: not-alone
        text: >-
          infraVelo ist nicht alleine für den Ausbau der Radverkehrsinfrastruktur zuständig: Auch
          die Bezirke und die Senatsverwaltung für Mobilität, Verkehr, Klimaschutz und Umwelt
          (SenMVKU) sind als Baulastträger für einzelne Radverkehrsprojekte aktiv
        gloss_en: >-
          infraVelo is not solely responsible for expanding cycling infrastructure: the districts
          and SenMVKU are also active as the authorities responsible for individual cycling
          projects
        locator: "Wann verbessert sich die Radverkehrsinfrastruktur sichtbar?"
      - id: prioritises
        text: >-
          Als Zuwendungsgeberin von infraVelo priorisiert die Senatsverwaltung für Mobilität,
          Verkehr, Klimaschutz und Umwelt (SenMVKU) die Projekte und Vorhaben.
        gloss_en: As infraVelo's funder, SenMVKU prioritises the projects and plans.
        locator: "Wie werden Vorhaben priorisiert?"
      - id: steering
        text: >-
          infraVelo unterstützt diese Koordinierung mit der Leitung von drei bis vier
          Steuerungsrunden pro Jahr und Bezirk.
        gloss_en: infraVelo supports this coordination by chairing three to four steering rounds per year and district.
        locator: "Wie erfolgt die Abstimmung zwischen den Bezirken und infraVelo?"

