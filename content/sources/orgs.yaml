# Sources on the organisations behind our external figures (M8 spec §3): who they are, how they
# are funded and what political role their figures play. Not tied to one region.
# Research log: docs/review/m8-organisations.md
sources:
  # ------------------------------------------------------------ Clean Cities Campaign
  - id: cc-what-we-do
    publisher: Clean Cities Campaign
    title: What we do
    url: https://cleancitiescampaign.org/what-we-do/
    accessed: 2026-10-07
    language: en
    kind: ngo
    excerpts:
      - id: network
        text: >-
          We are Europe’s largest network of organisations on a mission to build public support
          for cities to shift from polluting cars to active, shared and electric mobility.
        gloss_de: "Wir sind Europas größtes Netzwerk von Organisationen, die öffentliche Unterstützung dafür gewinnen wollen, dass Städte vom umweltschädlichen Auto auf aktive, geteilte und elektrische Mobilität umsteigen."
        locator: "Introduction"
      - id: hosted
        text: Clean Cities is hosted by T&E
        gloss_de: "Clean Cities ist bei T&E angesiedelt"
        locator: "Introduction, second sentence"
      - id: policy
        text: >-
          Backed by research, we shape city, national and European policy, trusted by both
          policymakers and campaigners for our dedication to transformative change.
        gloss_de: "Gestützt auf Forschung gestalten wir städtische, nationale und europäische Politik mit und genießen wegen unseres Einsatzes für grundlegenden Wandel das Vertrauen von Politik und Kampagnen gleichermaßen."
        locator: "Who we are, Thought leaders"
  - id: cc-ranking-2025-page
    publisher: Clean Cities Campaign
    title: "City Ranking 2025: Streets for Kids, Cities for All (overview page)"
    title_de: "City Ranking 2025: Streets for Kids, Cities for All (Übersichtsseite)"
    url: https://cleancitiescampaign.org/city-ranking-2025/
    accessed: 2026-10-07
    language: en
    kind: ngo
    excerpts:
      - id: cities
        text: >-
          We’ve analysed 36 European cities to see how they’re progressing in creating transport
          systems that prioritise the needs of children.
        gloss_de: "Wir haben 36 europäische Städte daraufhin untersucht, wie weit sie mit Verkehrssystemen vorankommen, die die Bedürfnisse von Kindern in den Vordergrund stellen."
        locator: "Introduction"
      - id: indicators
        text: >-
          The table below shows the combined ranking of the 36 cities, based on their performance
          across all three key indicators.
        gloss_de: "Die Tabelle unten zeigt das Gesamtranking der 36 Städte, beruhend auf ihrem Abschneiden bei allen drei Hauptindikatoren."
        locator: "Overall results"
  - id: te-funders
    publisher: Transport & Environment (T&E)
    title: Funders
    url: https://www.transportenvironment.org/about-us/funders
    accessed: 2026-10-07
    language: en
    kind: ngo
    excerpts:
      - id: funding
        text: >-
          We receive funding from a diverse range of donors, including foundations, government
          agencies, multilateral institutions, and our own membership of 49 independent
          environmental organisations across Europe.
        gloss_de: "Wir erhalten Mittel von vielfältigen Geldgebern, darunter Stiftungen, Behörden, multilaterale Institutionen und unsere eigenen Mitglieder, 49 unabhängige Umweltorganisationen in ganz Europa."
        locator: "Our funding (page last updated April 17, 2026)"
  - id: paris-fr-cc-ranking-2025
    publisher: Ville de Paris
    title: "Paris, ville européenne la plus adaptée à la mobilité des enfants"
    url: https://www.paris.fr/pages/paris-ville-europeenne-la-plus-adaptee-a-la-mobilite-des-enfants-31537
    accessed: 2026-10-07
    language: fr
    kind: official
    excerpts:
      - id: cites-ranking
        text: >-
          Paris est la capitale européenne la plus accueillante pour les enfants : c’est le
          résultat d’une étude menée l’association Clean Cities auprès de 36 villes européennes.
        gloss_en: >-
          Paris is the most child-friendly European capital: that is the result of a study by
          the Clean Cities association of 36 European cities.
        gloss_de: "Paris ist die kinderfreundlichste europäische Hauptstadt: Das ist das Ergebnis einer Studie des Vereins Clean Cities zu 36 europäischen Städten."
        locator: "News item, first paragraph (page updated 17/06/2025)"
  - id: cities-today-cc-ranking-2025
    publisher: Cities Today
    title: Paris tops ranking for child-friendly urban travel
    url: https://cities-today.com/paris-tops-ranking-for-child-friendly-urban-travel/
    published: 2025-05-19
    accessed: 2026-10-07
    language: en
    kind: press
    excerpts:
      - id: calls
        text: >-
          The report calls on national governments and the European Commission to strengthen
          legal frameworks, promote best practice and improve data collection to support safe,
          child-focused mobility across the continent.
        gloss_de: "Der Bericht fordert die nationalen Regierungen und die Europäische Kommission auf, den Rechtsrahmen zu stärken, gute Praxis zu fördern und die Datenerhebung zu verbessern, um sichere, an Kindern ausgerichtete Mobilität auf dem ganzen Kontinent zu unterstützen."
        locator: "Article body, last paragraph"

  # ------------------------------------------------------------ European Cyclists' Federation
  - id: ecf-about
    publisher: European Cyclists' Federation (ECF)
    title: About ECF
    url: https://www.ecf.com/en/about-us/about-ecf/
    accessed: 2026-10-07
    language: en
    kind: ngo
    excerpts:
      - id: umbrella
        text: >-
          We are the single European umbrella organisation for cycling for both transportation
          and leisure.
        gloss_de: "Wir sind der einzige europäische Dachverband für das Radfahren, im Alltagsverkehr wie in der Freizeit."
        locator: "About ECF, first sentence"
      - id: founded
        text: >-
          Founded in 1983, the European Cyclists’ Federation is a Brussels-based independent
          non-profit association dedicated to achieving more and better cycling for all in
          Europe.
        gloss_de: "Die 1983 gegründete European Cyclists’ Federation ist ein unabhängiger, gemeinnütziger Verband mit Sitz in Brüssel, der sich für mehr und besseres Radfahren für alle in Europa einsetzt."
        locator: "About ECF, second sentence"
      - id: members
        text: >-
          With more than 70 member organisations in over 40 countries, we unite the European
          cycling movements as the only civil society voice at the pan-European level
        gloss_de: "Mit mehr als 70 Mitgliedsorganisationen in über 40 Ländern vereinen wir die europäischen Radverkehrsbewegungen als einzige Stimme der Zivilgesellschaft auf gesamteuropäischer Ebene"
        locator: "About ECF, third sentence"
      - id: funding-life
        text: ECF gratefully acknowledges financial support from the LIFE Programme of the European Union
        gloss_de: "Die ECF dankt für die finanzielle Unterstützung durch das LIFE-Programm der Europäischen Union"
        locator: "Page footer"
      - id: funding-industry
        text: ECF gratefully acknowledges financial support from the European Cycling Industries
        gloss_de: "Die ECF dankt für die finanzielle Unterstützung durch die European Cycling Industries"
        locator: "Page footer"
  - id: ecf-2024-breakthroughs
    publisher: European Cyclists' Federation (ECF)
    title: "2024: A year of breakthroughs for cycling"
    url: https://www.ecf.com/en/news/-2024-a-year-of-breakthroughs-for-cycling/
    published: 2024-12-18
    accessed: 2026-10-07
    language: en
    kind: ngo
    excerpts:
      - id: declaration-advocacy
        text: >-
          ECF, as the only Europe-wide civil society voice for cycling, together with its
          industry partners Cycling Industries Europe and Confederation of the European Bicycle
          Industry (CONEBI) had long advocated for a unified cycling policy at the European
          level and were at the forefront every step of the way
        gloss_de: "Die ECF als einzige europaweite Stimme der Zivilgesellschaft für den Radverkehr hatte sich zusammen mit ihren Industriepartnern Cycling Industries Europe und Confederation of the European Bicycle Industry (CONEBI) lange für eine einheitliche Radverkehrspolitik auf europäischer Ebene eingesetzt und war bei jedem Schritt an vorderster Front dabei"
        locator: "Section The historic European Declaration on Cycling"
      - id: egum
        text: >-
          In August, the European Commission’s Expert Group on Urban Mobility (EGUM), co-chaired
          by ECF, issued a set of recommendation to improve road safety for people walking,
          cycling, and using light electric vehicles.
        gloss_de: "Im August legte die Expertengruppe der Europäischen Kommission für urbane Mobilität (EGUM), deren Ko-Vorsitz die ECF innehat, eine Reihe von Empfehlungen vor, um die Verkehrssicherheit für Menschen zu verbessern, die zu Fuß gehen, Rad fahren oder leichte Elektrofahrzeuge nutzen."
        locator: "Section Advancing road safety"
  - id: ec-declaration-cycling
    publisher: European Commission, DG Mobility and Transport
    title: European declaration on cycling
    url: https://transport.ec.europa.eu/transport-themes/urban-transport/european-declaration-cycling_en
    accessed: 2026-10-07
    language: en
    kind: official
    excerpts:
      - id: signed
        text: >-
          The European declaration on cycling, signed in 2024 by the European Parliament,
          Council and Commission, recognises cycling as a sustainable, accessible, and
          affordable means of transport, with strong added value for the EU economy.
        gloss_de: "Die Europäische Erklärung zum Radverkehr, 2024 von Europäischem Parlament, Rat und Kommission unterzeichnet, erkennt das Radfahren als nachhaltiges, zugängliches und erschwingliches Verkehrsmittel mit großem Mehrwert für die Wirtschaft der EU an."
        locator: "Boosting cycling across the EU, first paragraph"
  - id: qecio-site
    publisher: European Cyclists' Federation (ECF)
    title: "ECF Cycling Infrastructure Tracker: Quantifying Europe’s Cycling Infrastructure using OpenStreetMap (QECIO 2.0)"
    url: https://european-cyclists-federation.github.io/
    accessed: 2026-10-07
    language: en
    kind: index
    excerpts:
      - id: purpose
        text: >-
          There is great demand for data on cycling infrastructure, but currently, no official
          source provides this kind of information on a European scale. This data project
          responds to this need by extracting data about cycling infrastructure from
          OpenStreetMap (OSM).
        gloss_de: "Die Nachfrage nach Daten zur Radinfrastruktur ist groß, doch derzeit liefert keine amtliche Quelle solche Informationen auf europäischer Ebene. Dieses Datenprojekt antwortet auf diesen Bedarf, indem es Daten zur Radinfrastruktur aus OpenStreetMap (OSM) extrahiert."
        locator: "Introduction"

  # ------------------------------------------------------------ BikeNetKit
  - id: bikenetkit-github-org
    publisher: BikeNetKit (GitHub organisation profile)
    publisher_de: "BikeNetKit (Organisationsprofil auf GitHub)"
    title: BikeNetKit organisation README
    title_de: "README der Organisation BikeNetKit"
    url: https://github.com/BikeNetKit
    accessed: 2026-10-07
    language: en
    kind: research
    excerpts:
      - id: toolkit
        text: >-
          this digital toolkit compiles state-of-the-art bicycle network planning algorithms by
          the bicycle network research community, kick-started by NERDS since 2019, packaged as
          a Python software suite
        gloss_de: "dieses digitale Werkzeugpaket bündelt moderne Algorithmen zur Planung von Radnetzen aus der Forschungsgemeinschaft zu Radnetzen, 2019 von NERDS angestoßen, als Python-Softwarepaket"
        locator: "README, The toolkit to design and improve bike networks"
      - id: started
        text: We started developing BikeNetKit in 2026.
        gloss_de: "Wir haben 2026 mit der Entwicklung von BikeNetKit begonnen."
        locator: "README, Contributing to the ecosystem"
      - id: audience
        text: >-
          BikeNetKit is aimed at urban planners as a decision support tool for various network
          planning tasks, or for proactive citizens to create a compelling vision for urban
          cycling in their city.
        gloss_de: "BikeNetKit richtet sich an Stadtplaner als Entscheidungshilfe für verschiedene Aufgaben der Netzplanung, oder an engagierte Bürger, die eine überzeugende Vision für den Radverkehr in ihrer Stadt entwickeln wollen."
        locator: "README, User-friendly software for planners and advocates"
      - id: stance
        text: >-
          Yet, politicians often neglect their citizens, not building for cycling at all, or
          without a plan.
        gloss_de: "Doch Politiker vernachlässigen ihre Bürger oft, indem sie gar nicht für den Radverkehr bauen oder ohne Plan."
        locator: "README, first paragraph"
      - id: funding
        text: Development of BikeNetKit is supported by the Innovation Fund Denmark
        gloss_de: "Die Entwicklung von BikeNetKit wird vom Innovation Fund Denmark gefördert"
        locator: "README, Supported by"
      - id: funding-more
        text: the EU HORIZON project JUST STREETS
        gloss_de: "das EU-HORIZON-Projekt JUST STREETS"
        locator: "README, Supported by"
      - id: funding-itu
        text: the Data Science Section of IT University of Copenhagen.
        gloss_de: "die Data Science Section der IT University of Copenhagen."
        locator: "README, Supported by"
  - id: bikenetkit-gisruk-2026
    publisher: Zenodo (GISRUK 2026 conference proceeding; IT University of Copenhagen)
    publisher_de: "Zenodo (Tagungsbeitrag GISRUK 2026; IT University of Copenhagen)"
    title: "BikeNetKit: Developing an open-source bicycle network software suite for urban planners"
    url: https://zenodo.org/records/19390654
    published: 2026-04-02
    accessed: 2026-10-07
    language: en
    kind: research
    excerpts:
      - id: affiliation
        text: Networks, Data and Society (NERDS), IT University of Copenhagen
        gloss_de: "Networks, Data and Society (NERDS), IT University of Copenhagen"
        locator: "Authors, affiliation 1"
      - id: ad-hoc
        text: >-
          Contemporary bicycle network planning is largely an ad hoc process based on little
          empirical evidence, sometimes outsourced to for-profit consultancies working with
          opaque methods.
        gloss_de: "Die heutige Planung von Radnetzen ist weitgehend ein Ad-hoc-Prozess auf wenig empirischer Grundlage, mitunter an gewinnorientierte Beratungsfirmen mit undurchsichtigen Methoden ausgelagert."
        locator: "Description, first sentence"
      - id: policy
        text: >-
          BikeNetKit is targeted at, and developed with the input of, urban planners and
          policy-makers.
        gloss_de: "BikeNetKit richtet sich an Stadtplaner und politische Entscheidungsträger und wird mit ihren Beiträgen entwickelt."
        locator: "Description"

  # ------------------------------------------------------------ Changing Cities
  - id: changing-cities-verein
    publisher: Changing Cities e.V.
    title: Verein
    url: https://changing-cities.org/verein/
    accessed: 2026-10-07
    language: de
    kind: ngo
    excerpts:
      - id: origin
        text: >-
          Der Verein ist aus dem Netzwerk Lebenswerte Stadt e.V. hervorgegangen, der erfolgreich
          den Volksentscheid Fahrrad organisiert hat.
        gloss_en: >-
          The association grew out of Netzwerk Lebenswerte Stadt e.V., which successfully
          organised the Volksentscheid Fahrrad (cycling referendum).
        locator: "Section Ja, wir sind die mit dem Fahrrad-Volksentscheid"
      - id: members-funding
        text: 1480 Fördermitglieder (Stand 2/2026) unterstützen den Verein und bilden die finanzielle Basis.
        gloss_en: "1,480 supporting members (as of 2/2026) support the association and form its financial basis."
        locator: "Section Wir sind viele"
      - id: own-claim
        text: >-
          Mit dem Volksentscheid Fahrrad haben wir das Mobilitätsgesetz durchgesetzt. Seitdem
          kämpfen wir um seine Umsetzung: Meter für Meter.
        gloss_en: >-
          With the Volksentscheid Fahrrad we pushed through the Mobility Act. Since then we have
          been fighting for its implementation, metre by metre.
        locator: "News teaser on the page"
  - id: changing-cities-transparenz
    publisher: Changing Cities e.V.
    title: "Transparenz (Initiative Transparente Zivilgesellschaft)"
    url: https://changing-cities.org/transparenz/
    accessed: 2026-10-07
    language: de
    kind: ngo
    excerpts:
      - id: founded
        text: "Gründungsjahr: 2016"
        gloss_en: "Year founded: 2016"
        locator: "1. Name, Sitz, Anschrift und Gründungsjahr"
      - id: large-funder
        text: >-
          Im Jahr 2025 machten folgende Förderungen mehr als 10 Prozent des Jahresbudgets aus:
          104.606,73 € der European Climate Foundation
        gloss_en: >-
          In 2025 the following grants made up more than 10 percent of the annual budget:
          €104,606.73 from the European Climate Foundation
        locator: "10. Namen von Personen, deren jährliche Zahlungen mehr als 10 % des Gesamtjahresbudgets ausmachen"
  - id: changing-cities-volksentscheid
    publisher: Changing Cities e.V.
    title: Volksentscheid Fahrrad
    url: https://changing-cities.org/kampagnen/volksentscheid-fahrrad/
    accessed: 2026-10-07
    language: de
    kind: ngo
    excerpts:
      - id: signatures
        text: >-
          Der Volksentscheid Fahrrad übergab am 14. Juni 2016 nach dreieinhalb Wochen
          Sammelphase 105.425 Unterschriften für den Antrag auf ein Volksbegehren an das Berliner
          Abgeordnetenhaus.
        gloss_en: >-
          On 14 June 2016, after a collection phase of three and a half weeks, the Volksentscheid
          Fahrrad handed 105,425 signatures for a request for a popular initiative to the Berlin
          Abgeordnetenhaus.
        locator: "Campaign text, first sentence"
      - id: negotiated
        text: >-
          Gemeinsam mit dem ADFC, dem BUND, dem FUSS e.V. und dem Senat hat der Volksentscheid
          Fahrrad ein RadGesetz verhandelt, das am 28. Juni 2018 als Teil des Berliner
          Mobilitätsgesetzes verabschiedet wurde.
        gloss_en: >-
          Together with the ADFC, BUND, FUSS e.V. and the Senate, the Volksentscheid Fahrrad
          negotiated a cycling law that was passed on 28 June 2018 as part of the Berlin Mobility
          Act.
        locator: "Campaign text, second sentence"
  - id: klimareporter-radgesetz-2018
    publisher: Klimareporter°
    title: Berlin bekommt Radgesetz
    url: https://klimareporter.de/verkehr/berlin-bekommt-radgesetz
    published: 2018-06-28
    accessed: 2026-10-07
    language: de
    kind: press
    excerpts:
      - id: co-drafted
        text: >-
          Die Euphorie kommt allerdings nicht von ungefähr, denn die Aktivisten haben selbst an
          dem Gesetz mitgearbeitet.
        gloss_en: >-
          The euphoria is no accident, though: the activists themselves worked on the law.
        locator: "Article body, first paragraph"
      - id: drafted-with
        text: >-
          Zusammen mit Aktivisten von "Volksentscheid Fahrrad", dem Radfahrverband ADFC und dem
          Umweltverband BUND erarbeitete die Senatsverwaltung das wegweisende Gesetz.
        gloss_en: >-
          Together with activists of 'Volksentscheid Fahrrad', the cycling association ADFC and
          the environmental association BUND, the Senate administration drew up the landmark
          law.
        locator: "Article body, second paragraph"

  # ------------------------------------------------------------ Berlin: Senate, parliament, infraVelo
  - id: berlin-mobg-page
    publisher: Senatsverwaltung für Mobilität, Verkehr, Klimaschutz und Umwelt
    title: Berliner Mobilitätsgesetz (berlin.de web page)
    title_de: "Berliner Mobilitätsgesetz (Webseite auf berlin.de)"
    url: https://www.berlin.de/sen/uvk/mobilitaet-und-verkehr/verkehrspolitik/mobilitaetsgesetz/
    accessed: 2026-10-07
    language: de
    kind: official
    excerpts:
      - id: collaboration
        text: >-
          Das Berliner Mobilitätsgesetz ist das Ergebnis einer engen Zusammenarbeit zwischen der
          Stadtgesellschaft, des Abgeordnetenhauses und der Verwaltung aus Senat und Bezirken.
          Dabei sind wichtige Impulse engagierter Bürgerinnen und Bürger direkt in den
          Gesetzgebungsprozess eingeflossen.
        gloss_en: >-
          The Berlin Mobility Act is the result of close cooperation between civil society, the
          Abgeordnetenhaus and the administration of the Senate and the districts. Important
          impulses from engaged citizens fed directly into the legislative process.
        locator: "Section Die Schritte zum Berliner Mobilitätsgesetz"
      - id: promulgated
        text: >-
          Verkündet als Artikel 1 des Gesetzes zur Neuregelung gesetzlicher Vorschriften zur
          Mobilitätsgewährleistung vom 5. Juli 2018
        gloss_en: >-
          Promulgated as Article 1 of the Act reorganising statutory provisions on guaranteeing
          mobility of 5 July 2018
        locator: "Download list, Berliner Mobilitätsgesetz"
  - id: berlin-radfortschrittsbericht-page
    publisher: Senatsverwaltung für Mobilität, Verkehr, Klimaschutz und Umwelt
    title: Radfortschrittsbericht (berlin.de web page)
    title_de: "Radfortschrittsbericht (Webseite auf berlin.de)"
    url: https://www.berlin.de/sen/uvk/mobilitaet-und-verkehr/verkehrsplanung/radverkehr/radprojekte/radfortschrittsbericht/
    accessed: 2026-10-07
    language: de
    kind: official
    excerpts:
      - id: annual
        text: >-
          Über den Stand der Entwicklung berichtet der jährliche Fortschrittsbericht. In dem
          Bericht werden umfassend die Ergebnisse der Aktivitäten der Senatsverkehrsverwaltung,
          der landeseigen Infrastrukturgesellschaft infraVelo sowie der Bezirke dargestellt.
        gloss_en: >-
          The annual progress report reports on the state of development. It presents in full
          the results of the activities of the Senate transport administration, the state-owned
          infrastructure company infraVelo and the districts.
        locator: "Introduction"
      - id: streckenlaenge
        text: >-
          Ab dem Bericht 2022, wird hier die neue Maßeinheit „Streckenlänge“ verwendet. Das
          bedeutet, dass eine beidseitige Radverkehrsanlage an einem 1 Kilometer langen
          Streckenabschnitt als 1 Kilometer umgesetzte Strecke „gemessen“ und kommuniziert wird.
        gloss_en: >-
          From the 2022 report onwards the new unit 'route length' (Streckenlänge) is used: a
          cycling facility on both sides of a 1-km section is 'measured' and communicated as 1 km
          of implemented route.
        locator: "Anmerkung, below the 2024 summary"
      - id: per-direction-before
        text: >-
          In der Vergangenheit wurde 1 Kilometer pro Richtung gezählt und für den
          Streckenabschnitt entsprechend 2 Kilometer umgesetzte Radverkehrsanlagen kommuniziert.
        gloss_en: >-
          In the past 1 km was counted per direction, so 2 km of implemented cycling facilities
          were communicated for such a section.
        locator: "Anmerkung, below the 2024 summary"
      - id: not-comparable
        text: Die Zahlen erscheinen so niedriger und sind nicht direkt mit den Vorjahreswerten vergleichbar.
        gloss_en: The figures thus appear lower and are not directly comparable with previous years' values.
        locator: "Anmerkung, below the 2024 summary"
  - id: berlin-dpa-fortschrittsbericht-hauptausschuss
    publisher: Nordkurier (dpa)
    title: "Bericht: Senat ließ viele Mittel für Radverkehr liegen (dpa report on the Senate's Fahrrad-Fortschrittsbericht 2025; same article as berlin-dpa-fortschrittsbericht-2025, other passages)"
    title_de: "Bericht: Senat ließ viele Mittel für Radverkehr liegen (dpa-Meldung zum Fahrrad-Fortschrittsbericht 2025 des Senats; derselbe Artikel wie berlin-dpa-fortschrittsbericht-2025, andere Passagen)"
    url: https://www.nordkurier.de/regional/brandenburg/bericht-senat-liess-viele-mittel-fuer-radverkehr-liegen-4840670
    published: 2026-09-08
    accessed: 2026-10-07
    language: de
    kind: press
    excerpts:
      - id: for-hauptausschuss
        text: >-
          Inklusive Bundesmitteln flossen 2025 knapp 27 Millionen Euro in den Berliner
          Radverkehr, wie aus dem Fahrrad-Fortschrittsbericht der zuständigen
          Verkehrssenatsverwaltung für den Hauptausschuss im Abgeordnetenhaus hervorgeht.
        gloss_en: >-
          Including federal funds, just under 27 million euros went into cycling in Berlin in
          2025, according to the cycling progress report of the responsible Senate transport
          administration for the main (budget) committee of the Abgeordnetenhaus.
        locator: "Lead paragraph"
      - id: available
        text: >-
          Dem Bericht zufolge standen im vergangenen Jahr über alle Haushaltstitel hinweg rund
          82,4 Millionen Euro für den Radverkehr zur Verfügung.
        gloss_en: >-
          According to the report, around 82.4 million euros were available for cycling last
          year across all budget lines.
        locator: "Article body, second paragraph"
  - id: berlin-tagesspiegel-radwegestopp-2023
    publisher: Der Tagesspiegel
    title: "Sobald ein Auto-Parkplatz wegfällt: Berliner Senat stoppt vorerst Radwegprojekte"
    url: https://www.tagesspiegel.de/berlin/sobald-auch-nur-ein-parkplatz-wegfallt-berliner-senatsverwaltung-stoppt-vorerst-radwegprojekte-9992884.html
    published: 2023-06-15
    accessed: 2026-10-07
    language: de
    kind: press
    excerpts:
      - id: stop
        text: >-
          Keine neuen Radwege mehr für Berlin, wenn dafür auch nur ein Pkw-Stellplatz wegfällt:
          Die Senatsverkehrsverwaltung hat die Bezirke gebeten, Radwegprojekte vorerst zu
          stoppen.
        gloss_en: >-
          No more new cycle paths for Berlin if even one car parking space would be lost: the
          Senate transport administration has asked the districts to stop cycle path projects for
          the time being.
        locator: "Lead paragraph (rest of the article behind the paywall)"
  - id: agh-parlamentarische-anfragen
    publisher: Abgeordnetenhaus Berlin
    title: Parlamentarische Anfragen
