  - id: drahtesel-mobilitaetsagentur-2016
    publisher: Drahtesel (Radlobby Österreich magazine)
    publisher_de: "Drahtesel (Magazin der Radlobby Österreich)"
    title: Fünf Jahre mit Blum
    url: https://www.drahtesel.or.at/fuenf-jahre-mit-blum/
    published: 2016-12-02
    accessed: 2026-10-07
    language: de
    kind: press
    excerpts:
      - id: start-2011
        text: Im Herbst 2011 trat Martin Blum seine Arbeit als Fahrradbeauftragter der Stadt Wien an.
        gloss_en: In autumn 2011 Martin Blum took up his post as the City of Vienna's cycling commissioner.
        locator: "Standfirst"
      - id: created
        text: Eine Institution, die bald nach Arbeitsbeginn von der rot-grünen Stadtregierung geschaffen wurde.
        gloss_en: An institution created by the red-green city government soon after it took office.
        locator: "First paragraph"
      - id: communication
        text: >-
          Bevor wir Bilanz ziehen, sollten wir uns in Erinnerung rufen, was die Mobilitätsagentur
          eigentlich ist: eine Art Kommunikationsabteilung der Stadt. Konkrete
          Infrastrukturmaßnahmen durchsetzen kann sie ebenso wenig wie Ampelschaltungen ändern
          oder die Straßenverkehrsordnung novellieren.
        gloss_en: >-
          Before taking stock, we should recall what the Mobilitätsagentur actually is: a kind of
          communications department of the city. It can no more push through concrete
          infrastructure measures than change traffic-light phases or amend the road traffic
          regulations.
        locator: "Section Bewusstseinsbildung und Service"
      - id: budget
        text: >-
          Die rund zwei Millionen Jahresbudgets der Agentur fließen in Veranstaltungen und
          Kampagnen, die Radfahren und Zufußgehen fördern und attraltiv machen sollen.
        gloss_en: >-
          The agency's annual budget of around two million goes into events and campaigns meant
          to promote cycling and walking and make them attractive.
        locator: "Section Bewusstseinsbildung und Service"

