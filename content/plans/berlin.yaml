title: Reported, completed, mapped
intro:
  - >-
    Berlin's Radverkehrsplan sets a yearly path for its planned cycle network: so many km of the
    priority network (Vorrangnetz) and of the supplementary network (Ergänzungsnetz) per year up to
    2030 [@berlin-radverkehrsplan-vo19-013]. The plan itself expects that path to be adjusted,
    quoted below. This page sets three series against it. They count different things, and none
    of them confirms or refutes another.
sections:
  - dimension: reported
    heading: Reported
    paragraphs:
      - >-
        Reported km are the Senate's own. The yearly progress report goes to the main committee as
        a report (rote Nummer); written questions are answered as Drucksachen. Both draw on a
        project database run by infraVelo [@berlin-fortschrittsbericht-2025] and count route
        length once per street section, so a street with facilities on both sides counts once.
        The report on 2021 still halved main-road facilities to reach that basis, quoted below
        [@berlin-fortschrittsbericht-2021].
      - >-
        Documents revise one another, and every printed figure is kept. For 2025 the latest answer
        reports 8.6 km on the priority network, as the 2025 report does, while an answer of May
        2026 printed 9.8 km for the same year [@berlin-drs-19-27049] [@berlin-drs-19-25987]. For
        the supplementary network in 2023 the latest answer prints 55.1 km, which neither its own
        column total nor the earlier answer's 5.1 km supports. It stays as printed, with a note,
        and is marked suspect, so the earlier figure is shown as current [@berlin-drs-19-27049].
  - dimension: completed
    heading: Completed projects
    paragraphs:
      - >-
        Completed projects come from the measures dataset on Berlin's geoportal: one line per
        project since 2021, with its status, the networks it lies on and the quarter its works
        ended, fed from the same infraVelo database, quoted below
        [@berlin-gdi-radverkehrsmassnahmen]. We count the projects with status completed by the
        year their works ended. The lines are drawn per project, not per network edge, so their
        km and the reported km need not agree.
  - dimension: mapped
    heading: Mapped on the network
    paragraphs:
      - >-
        The third series is ours: OpenStreetMap way-sides in tiers A and B that run along a
        segment of the planned network, measured per side in mapped km [#adr-0006]. Mapped km are
        not km completed to the plan's standard. They include tracks that existed long before the
        plan, and a rise can be catch-up mapping as well as new infrastructure. The level therefore
        says little about the plan. The comparable quantity is the change since the start of 2022,
        the plan's first target year, and even that change is context for the reported figures,
        not a check on them.
