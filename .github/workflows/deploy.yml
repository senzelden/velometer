# CD (M17 spec §4.5, docs/deploy.md §2): build both sites from the server's data snapshot, hold
# that exact export to the R64 passes in a local dry run, and only then deploy it as the server's
# `ci` user. The deploy job waits in the `production` environment until the user approves it
# there: that click is the user's go for this deploy. `setup`, `unlock`, `snapshot`,
# `golive-check` and `deploy tiles` stay local; the `ci` key cannot run them (deploy/ci-gate.py).
# Actions are pinned to the commit of a release tag; the comment names the tag.
name: deploy

on:
  workflow_dispatch:
    inputs:
      site:
        description: The site to deploy (both are built and checked either way)
        type: choice
        options: [velometer, datalab, both]
        default: both

permissions:
  contents: read

concurrency: production

defaults:
  run:
    shell: bash # bash --noprofile --norc -eo pipefail: any failing command stops the step

env:
  HOST: 2.31.133.185 # the one host deploy/known_hosts pins
  DOMAIN: zaehlwerk-datalab.de

jobs:
  # the gate (CLAUDE.md) on the commit to deploy, before the approval is asked for
  gate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # sitemap lastmod reads git history (ruling T3a)
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends osmium-tool poppler-utils
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pytest
      - run: node --test "src/velometer/app/static/js/tests/*.test.mjs"

  deploy:
    needs: gate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    environment: production
    permissions:
      contents: write # the export tag only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # sitemap lastmod reads git history (ruling T3a)
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked

      - name: Work directories (outside the checkout, which must stay clean)
        run: |
          w="$RUNNER_TEMP/deploy"
          for d in snapshot tiles export datalab caddy passes; do install -d "$w/$d"; done
          {
            echo "WORK=$w"; echo "SNAP=$w/snapshot"; echo "TILES=$w/tiles"
            echo "EXPORT=$w/export"; echo "DATALAB=$w/datalab"; echo "CADDY=$w/caddy"
            echo "PASSES=$w/passes"
          } >> "$GITHUB_ENV"

      - name: The ci key in an agent, the server's pinned host key
        env:
          CI_DEPLOY_KEY: ${{ secrets.CI_DEPLOY_KEY }}
        run: |
          test -n "$CI_DEPLOY_KEY" || { echo "::error::no CI_DEPLOY_KEY in production (docs/deploy.md §2)"; exit 1; }
          install -d -m 0700 ~/.ssh
          install -m 0644 deploy/known_hosts ~/.ssh/known_hosts_velometer
          cat > ~/.ssh/config <<EOF
          Host $HOST
            User ci
            UserKnownHostsFile ~/.ssh/known_hosts_velometer
            GlobalKnownHostsFile /dev/null
            StrictHostKeyChecking yes
            UpdateHostKeys no
            BatchMode yes
          EOF
          chmod 0600 ~/.ssh/config
          eval "$(ssh-agent -s -a "$RUNNER_TEMP/agent.sock")" > /dev/null
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
          printf '%s\n' "$CI_DEPLOY_KEY" | ssh-add -

      - name: Fetch the data snapshot and the tiles, sha256-checked
        run: |
          rsync -t "ci@$HOST:/srv/snapshot/velometer.sqlite.gz" "ci@$HOST:/srv/snapshot/velometer.sqlite.gz.sha256" "$SNAP/"
          (cd "$SNAP" && sha256sum -c velometer.sqlite.gz.sha256)
          rsync -t "ci@$HOST:/srv/tiles/velometer.pmtiles" "$TILES/"
          # the tiles have no .sha256 on the server: the live export's build.json records theirs
          curl -fsS --proto '=https' "https://velometer.$DOMAIN/build.json" \
            | jq -e '.tiles | {protomaps_build, maxzoom, sha256}' > "$TILES/velometer.pmtiles.json"
          sha=$(jq -er .sha256 "$TILES/velometer.pmtiles.json")
          [[ $sha =~ ^[0-9a-f]{64}$ ]]
          (cd "$TILES" && echo "$sha  velometer.pmtiles" | sha256sum -c -)

      - name: The database
        run: |
          gunzip -c "$SNAP/velometer.sqlite.gz" > velometer.sqlite
          rm -- "$SNAP/velometer.sqlite.gz"

      - name: The export's other inputs
        run: |
          # the snapshot holds the database only; without these the export has no tier maps and
          # no plan pages and still passes deploy-check (docs/deploy.md §2)
          for d in data/maps data/plans/berlin; do
            if [ -z "$(find "$d" -type f -print -quit 2>/dev/null)" ]; then
              echo "::error::$d is missing: the snapshot does not carry it yet (docs/deploy.md §2)"
              exit 1
            fi
          done

      - name: Export and check velometer
        run: |
          uv run velometer app export --out "$EXPORT" --base / --public --tiles-info "$TILES/velometer.pmtiles.json"
          uv run velometer app deploy-check "$EXPORT" --public

      - name: Build the Datalab, its accessibility date today's
        run: |
          checked=$(date -u +%F)
          echo "CHECKED=$checked" >> "$GITHUB_ENV"
          uv run velometer datalab build --velometer-export "$EXPORT" --out "$DATALAB" --checked "$checked"

      - name: Caddy as setup installs it, checked by SHA-512
        run: |
          v=$(sed -n 's/^ *v=\([0-9][0-9.]*\)$/\1/p' deploy/cloud-init.yaml)
          sha512=$(sed -n 's/^ *sha512=\([0-9a-f]\{128\}\)$/\1/p' deploy/cloud-init.yaml)
          [[ $v =~ ^[0-9]+\.[0-9]+\.[0-9]+$ && $sha512 =~ ^[0-9a-f]{128}$ ]]
          tgz="caddy_${v}_linux_amd64.tar.gz"
          url="https://github.com/caddyserver/caddy/releases/download/v${v}"
          curl -fsSL --proto '=https' -o "$CADDY/$tgz" "$url/$tgz"
          curl -fsSL --proto '=https' -o "$CADDY/checksums.txt" "$url/caddy_${v}_checksums.txt"
          grep -qx "$sha512  $tgz" "$CADDY/checksums.txt"
          (cd "$CADDY" && echo "$sha512  $tgz" | sha512sum -c -)
          tar -xzf "$CADDY/$tgz" -C "$CADDY" caddy
          "$CADDY/caddy" version | grep -q "^v${v} "

      - name: Dry run, kept running for the passes
        run: |
          setsid uv run python tools/deploy_dryrun.py --site "$EXPORT" --server caddy --datalab "$DATALAB" --tiles "$TILES/velometer.pmtiles" --caddy-bin "$CADDY/caddy" --keep-running > "$WORK/dryrun.log" 2>&1 &
          pid=$!
          echo "DRYRUN_PID=$pid" >> "$GITHUB_ENV"
          for _ in $(seq 600); do
            if grep -q '^serving until Ctrl-C$' "$WORK/dryrun.log" || ! kill -0 "$pid" 2> /dev/null; then break; fi
            sleep 1
          done
          cat "$WORK/dryrun.log"
          grep -Eq '^[0-9]+ checks, 0 problems$' "$WORK/dryrun.log"
          grep -q '^serving until Ctrl-C$' "$WORK/dryrun.log"
          port=$(sed -n 's|^caddy serving .* at http://velometer\.localhost:\([0-9]*\)/ and .*|\1|p' "$WORK/dryrun.log")
          [[ $port =~ ^[0-9]+$ ]]
          echo "PORT=$port" >> "$GITHUB_ENV"

      - name: R64 full render pass and keyboard pass
        run: uv run python tools/render_pass.py --site "$EXPORT" --base / --out "$PASSES/all" --url "http://velometer.localhost:$PORT" --pages all --keyboard

      - name: R64 type pages, interact and flip
        run: uv run python tools/render_pass.py --site "$EXPORT" --base / --out "$PASSES/types" --url "http://velometer.localhost:$PORT" --pages types --interact --flip

      - name: R64 Datalab
        run: uv run python tools/render_pass.py --site "$DATALAB" --base / --lang de --out "$PASSES/datalab" --url "http://localhost:$PORT"

      - name: Every pass at 0 findings
        run: |
          uv run python tools/pass_findings.py "$PASSES/all=velometer.localhost" "$PASSES/types=velometer.localhost" "$PASSES/datalab=localhost" | tee "$WORK/passes.md"

      - name: Stop the dry run
        run: kill -INT -- "-$DRYRUN_PID"

      - name: Tag the export's commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          c=$(jq -er .commit_full "$EXPORT/build.json")
          [ "$c" = "$GITHUB_SHA" ]
          tag="export-${c:0:7}"
          if git rev-parse -q --verify "refs/tags/$tag" > /dev/null; then
            [ "$(git rev-parse "refs/tags/$tag^{commit}")" = "$c" ]
          else
            git tag "$tag" "$c"
          fi
          # the token goes in git's environment, not on its command line
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          export GIT_CONFIG_VALUE_0
          git push origin "refs/tags/$tag"
          echo "TAG=$tag" >> "$GITHUB_ENV"

      - name: Deploy velometer
        if: inputs.site == 'velometer' || inputs.site == 'both'
        run: |
          printf 'yes\n' | uv run python tools/server.py deploy velometer "$EXPORT" --host "$HOST" --user ci | tee "$WORK/deploy-velometer.log"

      - name: Deploy the Datalab
        if: inputs.site == 'datalab' || inputs.site == 'both'
        run: |
          printf 'yes\n' | uv run python tools/server.py deploy datalab "$DATALAB" --host "$HOST" --user ci | tee "$WORK/deploy-datalab.log"

      - name: Verify the live sites
        run: uv run python tools/server.py verify --domain zaehlwerk-datalab.de

      - name: Short live pass
        run: |
          if [ -f "$WORK/deploy-velometer.log" ]; then
            uv run python tools/render_pass.py --site "$EXPORT" --base / --out "$PASSES/live-velometer" --url "https://velometer.$DOMAIN" --pages types
            uv run python tools/pass_findings.py "$PASSES/live-velometer=velometer.$DOMAIN" | tail -n 1 | tee -a "$WORK/passes.md"
          fi
          if [ -f "$WORK/deploy-datalab.log" ]; then
            uv run python tools/render_pass.py --site "$DATALAB" --base / --lang de --out "$PASSES/live-datalab" --url "https://$DOMAIN"
            uv run python tools/pass_findings.py "$PASSES/live-datalab=$DOMAIN" | tail -n 1 | tee -a "$WORK/passes.md"
          fi

      - name: Job summary
        if: always()
        env:
          SITE: ${{ inputs.site }}
        run: |
          {
            echo "## deploy $SITE at ${GITHUB_SHA:0:7}"
            echo
            echo "Run (R64 evidence): $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "Accessibility statement date: ${CHECKED:-not built}; export tag: ${TAG:-not pushed}"
            echo
            if [ -f "${WORK:-/nonexistent}/passes.md" ]; then cat "$WORK/passes.md"; else echo "No pass was counted."; fi
            echo
            cat "${WORK:-/nonexistent}"/deploy-*.log 2> /dev/null | grep -E '^(velometer|datalab): current -> ' || echo "No release was switched."
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "${SSH_AGENT_PID:-}" ]; then ssh-agent -k > /dev/null; fi
