[project]
name = "velometer"
version = "0.1.0"
description = "Reproducible OSM measurement of protected cycling infrastructure in European cities"
readme = "HANDOVER.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
  "osmium>=4.0",
  "pydantic>=2.7",
  "typer>=0.12",
  "pyyaml>=6.0",
  "pyproj>=3.6",
  "shapely>=2.0",
]

[project.scripts]
velometer = "velometer.cli:app"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27", "matplotlib>=3.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/velometer"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = ["slow: needs network or large data; deselected by default"]
